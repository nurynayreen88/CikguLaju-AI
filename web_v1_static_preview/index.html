<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c7669">
<title>CikguLaju AI — Web</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#173d37;background:#f5f8f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:920px;margin:auto;padding:24px}.header{display:flex;align-items:center;gap:12px;font-size:1.1rem;font-weight:800}.mark{background:#087568;color:#fff;padding:13px;border-radius:13px}.panel{background:white;border:1px solid #e0eae6;border-radius:24px;padding:clamp(26px,6vw,58px);margin:56px auto 18px;max-width:640px;box-shadow:0 16px 48px #174b3910}h1{font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:-.04em;line-height:1.15;margin:0 0 18px}p{line-height:1.65;color:#536c64} .pill{display:inline-block;background:#e6f5ee;color:#087568;border-radius:30px;padding:7px 12px;font-size:.78rem;font-weight:700;margin-bottom:20px}.login{background:#087568;color:#fff;border:0;border-radius:12px;padding:15px 20px;font:inherit;font-weight:700;width:100%;margin-top:14px;cursor:not-allowed;opacity:.55}.notice{font-size:.88rem;color:#65796f;margin-top:14px}.foot{text-align:center;color:#75867f;font-size:.8rem;margin-top:26px}@media(max-width:550px){.wrap{padding:16px}.panel{margin-top:35px;border-radius:18px;padding:27px}}
</style>
</head>
<body>
<div class="wrap">
<header class="header"><span class="mark">CL</span><span>CikguLaju AI</span></header>
<main class="panel">
<span class="pill">Versi Web</span>
<h1>RPH lebih mudah, semuanya di satu tempat.</h1>
<p>Gunakan akaun CikguLaju Telegram sedia ada untuk mengakses RPH melalui web. Selepas log masuk, cikgu boleh memilih Tahun, Subjek, Unit dan Lesson/PdP.</p>
<div id="telegram-widget" aria-label="Log masuk Telegram"></div>
<p class="notice" role="status" id="login-status">Menyemak sambungan log masuk…</p>
</main>
<footer class="foot">CikguLaju AI · Web staging</footer>
</div>
<script>
"use strict";
window.onCikguLajuTelegramAuth=async function(user){
 const status=document.getElementById("login-status");
 try{
  const response=await fetch("/api/auth/telegram/widget",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(user)});
  if(!response.ok)throw new Error(response.status===403?"Akaun Telegram belum didaftarkan dalam CikguLaju.":"Pengesahan gagal. Sila cuba semula.");
  status.textContent="Log masuk berjaya.";
  location.reload();
 }catch(error){status.textContent=error.message;}
};
(async()=>{
 const status=document.getElementById("login-status");
 try{
  const session=await fetch("/api/auth/telegram/session",{credentials:"same-origin",cache:"no-store"});
  if(session.ok){status.textContent="Akaun telah disahkan. Ruang kerja web akan dibuka selepas integrasi RPH selesai.";return;}
  const response=await fetch("/api/auth/capabilities",{cache:"no-store"});
  if(!response.ok)throw Error("offline");
  const config=await response.json();
  if(config.telegram_widget_enabled!==true||!config.bot_username){status.textContent="Log masuk Telegram belum diaktifkan pada pelayan web.";return;}
  const script=document.createElement("script");
  script.async=true;script.src="https://telegram.org/js/telegram-widget.js?22";
  script.setAttribute("data-telegram-login",config.bot_username);
  script.setAttribute("data-size","large");script.setAttribute("data-userpic","false");
  script.setAttribute("data-onauth","onCikguLajuTelegramAuth(user)");
  document.getElementById("telegram-widget").appendChild(script);
  status.textContent="Sahkan akaun Telegram untuk meneruskan.";
 }catch(_){status.textContent="Sambungan log masuk belum tersedia. Sila cuba kemudian.";}
})();
</script>
</body>
</html>
