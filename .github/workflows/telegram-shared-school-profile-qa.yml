name: Telegram Shared Teacher Profile Bridge QA
on:
  push:
    branches:
      - feature/telegram-web-shared-teacher-profile-20261105
    paths:
      - 'web/shared_teacher_school_telegram.py'
      - 'tests/test_telegram_shared_teacher_school.py'
      - '.github/workflows/telegram-shared-school-profile-qa.yml'
      - 'tools/run_telegram_with_curriculum_api.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teacher-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask==3.1.3
      - name: Validate school edit stays scoped, idempotent and non-destructive
        run: |
          python -m py_compile web/shared_teacher_school_telegram.py tools/run_telegram_with_curriculum_api.py
          python -m unittest discover -s tests -p 'test_telegram_shared_teacher_school.py' -v
      - name: Verify legacy Telegram callbacks and paid gates remain mounted
        run: |
          python - <<'PY'
          from pathlib import Path
          entry=Path("tools/run_telegram_with_curriculum_api.py").read_text("utf8")
          for original in ["install_pi_rpt_2027","install_user_payment_store","install_proof_first_payment","install_user_manual"]:
              assert original in entry
          assert "install_shared_teacher_school" in entry
          PY
