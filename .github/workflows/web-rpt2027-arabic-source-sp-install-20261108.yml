name: Stage corrected Bahasa Arab RPT Year2-6 PDF drafts on Web review branch
on:
  push:
    branches:
      - feature/web-rpt2027-arabic-t2t6-spdraft-20261108
    paths:
      - .github/workflows/web-rpt2027-arabic-source-sp-install-20261108.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: web-rpt2027-arabic-source-sp-safe-staging
  cancel-in-progress: false
jobs:
  stage_five_arabic_pdfs:
    if: github.ref == 'refs/heads/feature/web-rpt2027-arabic-t2t6-spdraft-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Web review branch (NEVER main or production)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only PDF + Web QA dependencies
        run: python -m pip install 'PyMuPDF==1.24.14' 'flask==3.1.3' 'pillow==11.3.0'
      - name: Pin exact green academic staging CI run, then download PDFs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view 42469631870 -R "$GITHUB_REPOSITORY" --json conclusion,headSha > "$RUNNER_TEMP/source_run.json"
          python - <<'PY'
          import json,os
          info=json.load(open(os.environ['RUNNER_TEMP']+'/source_run.json'))
          assert info["conclusion"]=="success",info
          assert info["headSha"]=="edee7c3fe937f0abf09affd027b709784f34c5cb",info
          PY
          mkdir -p "$RUNNER_TEMP/rpt_5"
          gh run download 42469631870 -R "$GITHUB_REPOSITORY" -n 'RPT2027-20-BM-PI-ARAB-MUZIK-Seragam-DRAF' -D "$RUNNER_TEMP/rpt_5"
          test -s "$RUNNER_TEMP/rpt_5/baki_4_subjek_DRAF/CIKGULAJU_RPT_BAHASA_ARAB_TAHUN_6_2027_LIMA_LAJUR_DRAF.pdf"
      - name: Replace exactly five Year2-6 Arabic PDFs, update both SHA pins, leave other 51 untouched
        run: |
          python -m scripts.stage_web_arabic_rpt_2027_sp_candidates --artifacts "$RUNNER_TEMP/rpt_5/baki_4_subjek_DRAF"
          python -m unittest tests.test_web_rpt2027_56_release_catalog tests.test_web_rpt_2027_all tests.test_web_rpt_original_cover_layout tests.test_web_rpt2027_arabic_dskp_sp_release_gate_20261108 -v
          python -m scripts.audit_web56_teacher_pdf_leaks_20261108 --fail-on-findings --output "$RUNNER_TEMP/web56_arabic_source_sp_teacher_leak.json"
      - name: Verify browser original-cover name/logo overlay still matches all 56 hashes
        run: |
          sha256sum -c web_v1_static_preview/pdf-lib.min.js.sha256
          node --check web_v1_static_preview/rpt-personalize.js
          node tests/qa_web_rpt_personal_cover_node.cjs "$RUNNER_TEMP/rpt_original_cover_arabic_updated"
          python tests/qa_web_rpt_original_cover_render.py --outputs "$RUNNER_TEMP/rpt_original_cover_arabic_updated"
      - name: Commit only 5 binary PDF drafts and two matching SHA records to Web feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'feature/web-rpt2027-arabic-t2t6-spdraft-20261108'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rpt_2027/web_2027_pdfs/bahasa_arab/tahun_2.pdf \
             rpt_2027/web_2027_pdfs/bahasa_arab/tahun_3.pdf \
             rpt_2027/web_2027_pdfs/bahasa_arab/tahun_4.pdf \
             rpt_2027/web_2027_pdfs/bahasa_arab/tahun_5.pdf \
             rpt_2027/web_2027_pdfs/bahasa_arab/tahun_6.pdf \
             rpt_2027/web_2027_pdfs/manifest.json \
             rpt_2027/web_2027_pdfs/original_cover_layout_verified.json
          git diff --cached --name-only > "$RUNNER_TEMP/staged_changed_paths.txt"
          python - <<'PY'
          from pathlib import Path
          import os
          changed=Path(os.environ["RUNNER_TEMP"]+"/staged_changed_paths.txt").read_text().splitlines()
          prefix="rpt_2027/web_2027_pdfs/"
          expected={prefix+f"bahasa_arab/tahun_{i}.pdf" for i in range(2,7)}
          expected|={prefix+"manifest.json",prefix+"original_cover_layout_verified.json"}
          assert set(changed)==expected,(changed,sorted(expected))
          print("Exactly five PDF binaries and SHA manifests staged; 51 other PDFs unchanged.")
          PY
          git commit -m 'assets(web): stage source-visual Arabic Y2-6 RPT DRAF with 290 SP candidate PdP'
          git push origin HEAD:refs/heads/feature/web-rpt2027-arabic-t2t6-spdraft-20261108
