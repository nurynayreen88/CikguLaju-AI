name: PI RPT 2027 final 698 source alignment
on:
  pull_request:
    paths:
      - tools/export_pi_final_rpt_source_20261125.py
      - tools/plan_pi_rpt_final_20261125.py
      - staging/pendidikan_islam/rpt_2027_prior_calendar_reference_20261125.json
      - .github/workflows/pi-rpt-final-source-20261125.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-final-rpt-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash build_jawi.sh
      - run: python -m tools.export_pi_final_rpt_source_20261125
        env:
          PYTHONUNBUFFERED: "1"
          CIKGULAJU_WEB_NATIVE_RPH_ENABLED: "0"
      - run: python -m tools.plan_pi_rpt_final_20261125
      - run: python -m tools.test_pi_no_duration_display_20261125
      - run: python -m pip install reportlab arabic-reshaper python-bidi
      - run: python -m tools.render_pi_final_rpt_20261125
      - uses: actions/upload-artifact@v4
        with:
          name: pi-rpt-final-698-source
          path: qa/pi-rpt-final-source/*
          retention-days: 7
