name: RPT2027 Sains Year4-5 original DSKP full SP source coverage
on:
  pull_request:
    paths:
      - 'scripts/build_rpt2027_sains_kssr2017_complete_y4y5_20261110.py'
      - 'tests/test_rpt2027_sains_kssr2017_full_y4y5_20261110.py'
      - '.github/workflows/rpt2027-sains-y4y5-full-official-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pdf-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'PyMuPDF==1.24.14' 'reportlab==4.2.5'
      - name: Validate source-complete official SK/SP and retain academic hold
        run: |
          python -m py_compile scripts/build_rpt2027_sains_kssr2017_complete_y4y5_20261110.py
          python -m unittest tests.test_rpt2027_sains_kssr2017_full_y4y5_20261110 -v
      - name: Render 88 and 116 sourced PdP annual PDFs, inspect physical text and layout
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import fitz
          from scripts.build_rpt2027_sains_kssr2017_complete_y4y5_20261110 import build_all
          out=Path('output/rpt2027_sains_original_2017_y4y5_full_source_staging')
          built=build_all(out)
          assert [(y,n) for y,n,p in built]==[(4,88),(5,116)]
          for year,count,p in built:
              with fitz.open(p) as d:
                  assert len(d)>2
                  assert all(page.rect.width>page.rect.height for page in d)
                  text='\n'.join(pg.get_text('text') for pg in list(d)[1:])
                  assert 'M01' in text and 'Unit 1' in text and 'PdP 001' in text, (year,text[:900])
                  assert 'Pernyataan penuh' not in text and 'SEBELUM READY' not in text
                  assert text.count('Kumpulan A:')>=36
                  print('FULL_DSKP_RPT_SOURCE_PDF_QA',year,count,len(d),p,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rpt2027-sains-y4-88-y5-116-official-dskp-complete-sp-review-not-academic-final
          retention-days: 30
          path: output/rpt2027_sains_original_2017_y4y5_full_source_staging/
          if-no-files-found: error
