name: Sains real native Telegram Word-PDF smoke contract

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/sains_native_internal_real_documents_smoke_20261108.py"
      - "tests/test_sains_native_real_word_pdf_internal_20261108.py"
      - "tools/run_telegram_with_curriculum_api.py"
      - ".github/workflows/sains_native_real_word_pdf_smoke_20261108.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-native-word-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native Telegram document test dependencies
        run: python -m pip install "flask==3.1.3" "python-docx==1.1.2" "reportlab==4.2.5" "pypdf==5.1.0"
      - name: Authenticate native sequence endpoint and verify ten generated Word/PDF outputs
        run: python -m unittest discover -s tests -p "test_sains_native_real_word_pdf_internal_20261108.py" -v
      - name: Assert production is fail-closed without explicit one-shot flag
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.sains_native_internal_real_documents_smoke_20261108 import ENABLED,log_when_enabled
          assert ENABLED not in os.environ
          class NoRuntime:
              def __getattr__(self,name): raise RuntimeError("Do not import or render the bot when off")
          assert log_when_enabled(NoRuntime()) is None
          launcher=Path("tools/run_telegram_with_curriculum_api.py").read_text(encoding="utf-8")
          assert "from tools.sains_native_internal_real_documents_smoke_20261108 import" in launcher
          print("SCIENCE REAL RPH PROBE DEFAULT OFF; NEW 342 RPH ALL ACADEMIC HOLD")
          PY
