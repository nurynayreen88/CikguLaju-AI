name: Web unified RPH preview checks
on:
  push:
    branches:
      - staging/cikgulaju-web-v1
    paths:
      - '.github/workflows/web-unified-rph-preview-tests.yml'
      - 'web/unified_rph_web.py'
      - 'tests/test_web_unified_rph_preview.py'
      - 'tools/run_web_v1_preview.py'
      - 'web_v1_static_preview/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Flask dependency
        run: python -m pip install 'flask==3.1.2'
      - name: Syntax and source-bound previews
        run: |
          python -m py_compile web/unified_rph_web.py tools/run_web_v1_preview.py
          python -m unittest discover -s tests -p 'test_web_unified_rph_preview.py' -v
      - name: Validate normal dropdown first, preview second
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('web_v1_static_preview/index.html').read_text(encoding='utf8')
          assert 'id="web-quick-access"' not in s
          assert 'id="y6rph-panel"' not in s
          assert 'id="y6rph-lesson"' not in s
          assert 'id="rph-preview-button"' in s
          assert s.index('id="year"') < s.index('id="subject"') < s.index('id="unit"') < s.index('id="lesson"') < s.index('id="rph-preview-button"')
          assert s.index('id="rph-preview-button"') < s.index('id="rph-preview-panel"')
          assert s.index('id="rph-preview-panel"') < s.index('id="rpt2027-panel"')
          assert 'id="rph-print"' in s and 'id="rph-word"' in s
          assert 'id="generate-pdf"' not in s and 'id="generate-docx"' not in s
          assert 'RPT 2027 — Semua Subjek' in s
          assert 'renderedRphKey' in s
          scripts = re.findall(r'<script>\s*(.*?)\s*</script>',s,flags=re.S)
          assert len(scripts)==1
          Path('/tmp/web-unified-rph-preview.js').write_text(scripts[0],encoding='utf8')
          print('PASS: normal selection UI, no separate Year6 controls, shared preview/Word/PDF only after lesson')
          PY
          node --check /tmp/web-unified-rph-preview.js
