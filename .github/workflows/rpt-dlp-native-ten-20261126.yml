name: DLP ten exact native Word and PDF layout candidates
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/build_rpt_dlp_native_20261126.py'
      - 'web/rpt_native_word_cover.py'
      - 'rpt_2027/web_2027_pdfs/original_cover_layout_verified.json'
      - '.github/workflows/rpt-dlp-native-ten-20261126.yml'
permissions:
  contents: read
jobs:
  layout:
    strategy:
      fail-fast: false
      matrix:
        subject: [mathematics_dlp,science_dlp]
        year: [2,3,4,5,6]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - run: python -m tools.build_rpt_dlp_native_20261126 --subject ${{ matrix.subject }} --year ${{ matrix.year }} --out "$RUNNER_TEMP/rpt-private"
      - if: always()
        run: rm -rf "$RUNNER_TEMP/rpt-private"
