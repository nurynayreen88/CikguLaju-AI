name: Matematik v60 native Telegram-Web staging contract

on:
  pull_request:
    paths:
      - "web/matematik_v60_native_rows.py"
      - "web/matematik_v60_native_coverage.py"
      - "tools/audit_matematik_v60_v2599_native_source_20261108.py"
      - "web/telegram_verified_sequence_rph_bridge.py"
      - "tools/run_telegram_with_curriculum_api.py"
      - "tests/test_matematik_v60_native_rows_20261108.py"
      - "tests/test_matematik_v60_native_coverage_20261108.py"
      - "tests/test_matematik_v60_private_sequence_20261108.py"
      - "tests/test_matematik_v60_web_telegram_state_20261108.py"
      - "rph_standalone/matematik/v60_source_loader.py"
      - "rph_standalone/matematik/v60_source/**"
      - ".github/workflows/matematik-v60-native-runtime-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-native-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bridge-only dependencies
        run: python -m pip install "Flask==3.1.3"
      - name: Check syntax without importing the production bot
        run: |
          python -m py_compile web/matematik_v60_native_rows.py
          python -m py_compile web/matematik_v60_native_coverage.py
          python -m py_compile web/telegram_verified_sequence_rph_bridge.py
          python -m py_compile tools/run_telegram_with_curriculum_api.py
      - name: Verify all 585 original source lessons (no DB)
        run: python -m unittest discover -s tests -p "test_matematik_v60_main_source.py" -v
      - name: Test native Telegram row adapter and authenticated-Web source parity
        run: |
          python -m unittest discover -s tests -p "test_matematik_v60_native_rows_20261108.py" -v
          python -m unittest discover -s tests -p "test_matematik_v60_native_coverage_20261108.py" -v
          python -m unittest discover -s tests -p "test_matematik_v60_private_sequence_20261108.py" -v
          python -m unittest discover -s tests -p "test_matematik_v60_web_telegram_state_20261108.py" -v

      - name: Audit actual Telegram Mathematics v25.99 canonical sequence mapping (read-only)
        run: |
          python -m tools.audit_matematik_v60_v2599_native_source_20261108 --output /tmp/matematik_v60_native_coverage.json > /tmp/math_v60_audit_stdout.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/matematik_v60_native_coverage.json', encoding='utf-8'))
          print("MATH-V60 SOURCE",report['source_lessons'],"NATIVE MATCHED",report['matched'])
          for year, row in report['per_year'].items():
              print("Year",year,"PdP",row['native_pdp'],"matched",row['matched'],
                    "missing",row['unmatched'],"conflicts",row['conflicts'])
          print("Academic and E2E signoffs remain withheld even on full mapping.")
          if not report['mapping_ready']:
              raise SystemExit("HOLD: actual Telegram Maths v25.99 mapping not reconciled 585/585")
          PY

