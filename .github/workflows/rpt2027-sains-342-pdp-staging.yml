name: RPT2027 Sains 342-source-PdP five-column partial QA
on:
  pull_request:
    paths:
      - 'scripts/audit_rpt2027_teacher_text_leaks_20261108.py'
      - 'tests/test_rpt2027_teacher_text_leak_scan.py'
      - 'scripts/build_rpt_2027_sains_342_actual_source_staging.py'
      - 'tests/test_rpt_2027_sains_342_actual_source_staging.py'
      - 'scripts/audit_sains_rpt2027_uncovered_verified_sp_staging.py'
      - 'tests/test_sains_rpt2027_uncovered_verified_sp_staging.py'
      - 'scripts/build_rpt2027_sains_80_sp_gap_appendix_staging.py'
      - 'tests/test_rpt2027_sains_80_sp_gap_appendix_staging.py'
      - 'scripts/audit_sains_2027_29_sp_12_topic_clusters_staging.py'
      - 'tests/test_sains_2027_29_sp_12_topic_clusters_staging.py'
      - 'audits/sains_5_missing_topic_units_10_candidate_pdp_21_sp_20261107_DRAF.json'
      - 'scripts/build_rpt2027_sains_10_missing_topic_candidate_pdp_staging.py'
      - 'tests/test_rpt2027_sains_10_missing_topic_candidate_pdp_staging.py'
      - 'rpt_2027/common/sains_kssr2017_edition_release_guard.py'
      - 'audits/sains_rpt2027_kssr2017_legacy_code_conflict_20261107.json'
      - 'tests/test_sains_2027_kssr2017_edition_release_guard.py'
      - 'rpt_2027/sains/kssr2017_t4_t5_official_sp_code_ranges_20261107.json'
      - 'scripts/audit_sains_v26_vs_kssr2017_original_year4_year5_codes.py'
      - 'tests/test_sains_v26_vs_kssr2017_original_y4_y5_code_diff.py'
      - 'scripts/build_rpt2027_sains_kssr2017_y4y5_original_source_staging.py'
      - 'tests/test_rpt2027_sains_original2017_y4y5_source_generator.py'
      - 'scripts/audit_sains_kssr2017_full_statement_vs_legacy_staging.py'
      - 'tests/test_sains_kssr2017_full_statement_vs_legacy_staging.py'
      - 'rpt_2027/sains/kssr2017_y4_y5_186_official_sp_source_extraction_20261107_DRAF.json'
      - 'scripts/audit_sains_rpt2027_legacy_pdp_conflicts_staging.py'
      - 'tests/test_sains_rpt2027_legacy_pdp_conflicts_staging.py'
      - 'rpt_2027/sains/kssr2017_t2_t3_official_sp_code_ranges_20261107.json'
      - 'scripts/audit_sains_y2_y3_original_dskp_sp_membership_staging.py'
      - 'tests/test_sains_y2_y3_original_dskp_sp_membership_staging.py'
      - 'rpt_2027/sains/bpk2020_panduan_sains_t6_43_sp_16_section_source_index_20261108_DRAF.json'
      - 'rpt_2027/common/sains_y6_bpk_2020_panduan_43_sp_source.py'
      - 'rpt_2027/sains/sains_y6_kssr2017_2021_sistem_saraf_2_sp_text_corrections_20261108_DRAF.json'
      - 'rpt_2027/sains/sains_y6_kssr2017_2021_14_additional_sp_text_conflicts_20261108_DRAF.json'
      - 'scripts/audit_sains_y6_bpk_panduan_43_sp_kps_staging.py'
      - 'tests/test_sains_y6_bpk_panduan_43_sp_kps_staging.py'
      - '.github/workflows/rpt2027-sains-342-pdp-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa_sains342:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'PyMuPDF==1.24.14' 'reportlab==4.2.5' 'beautifulsoup4==4.12.3'
      - run: python -m py_compile scripts/build_rpt_2027_sains_342_actual_source_staging.py scripts/audit_sains_rpt2027_uncovered_verified_sp_staging.py
      - name: Run five subject-year DSKP-source RPT tests
        run: python -m unittest tests.test_rpt_2027_sains_342_actual_source_staging -v
      - name: Compute audited Sains SP missing from historical PdP (not lessons)
        run: |
          python -m scripts.audit_sains_rpt2027_uncovered_verified_sp_staging
          python -m unittest tests.test_sains_rpt2027_uncovered_verified_sp_staging -v
      - name: Keep all legacy Sains source versions blocked against KSSR2017
        run: python -m unittest tests.test_sains_2027_kssr2017_edition_release_guard -v
      - name: Compare Year4/5 legacy v26 SP codes to official original KSSR2017
        run: |
          python -m unittest tests.test_sains_v26_vs_kssr2017_original_y4_y5_code_diff -v
          python -m scripts.audit_sains_v26_vs_kssr2017_original_year4_year5_codes
      - name: Validate SHA-locked external KSSR2017 186-SP rebase generator
        run: python -m unittest tests.test_rpt2027_sains_original2017_y4y5_source_generator -v
      - name: Guard against same-numeric-code but different official DSKP wording
        run: python -m unittest tests.test_sains_kssr2017_full_statement_vs_legacy_staging -v
      - name: Compute all 186 official Year4/5 text-to-legacy SP comparisons
        run: |
          python -m scripts.audit_sains_kssr2017_full_statement_vs_legacy_staging             --out staging/rpt_2027_seragam_2026/sains_kssr2017_186_sp_wording_diff_DRAF.json
      - name: Locate every legacy Sains PdP with a non-KSSR2017 source code
        run: |
          python -m unittest tests.test_sains_rpt2027_legacy_pdp_conflicts_staging -v
          python -m scripts.audit_sains_rpt2027_legacy_pdp_conflicts_staging
      - name: Cross-check Sains Year2/3 historical 96 SP against original KPM DSKP codes
        run: |
          python -m unittest tests.test_sains_y2_y3_original_dskp_sp_membership_staging -v
          python -m scripts.audit_sains_y2_y3_original_dskp_sp_membership_staging
      - name: Check all 84 Sains Year6 PdP against 16 source-backed BPK 2020 KPS activity blocks
        run: |
          python -m unittest tests.test_sains_y6_bpk_panduan_43_sp_kps_staging -v
          python -m scripts.audit_sains_y6_bpk_panduan_43_sp_kps_staging
      - name: Audit 29 unrepresented content SP as 12 actual DSKP SK topics
        run: |
          python -m unittest tests.test_sains_2027_29_sp_12_topic_clusters_staging -v
          python -m scripts.audit_sains_2027_29_sp_12_topic_clusters_staging
      - name: Render ten sourced Sains topic activity proposals for five absent units
        run: |
          python -m unittest tests.test_rpt2027_sains_10_missing_topic_candidate_pdp_staging -v
          python -m scripts.build_rpt2027_sains_10_missing_topic_candidate_pdp_staging
      - name: Render three additional source-verified 80-SP annex PDFs
        run: |
          python -m unittest tests.test_rpt2027_sains_80_sp_gap_appendix_staging -v
          python -m scripts.build_rpt2027_sains_80_sp_gap_appendix_staging
      - name: Build five Sains partial 2027 PDF drafts
        run: |
          python -m scripts.build_rpt_2027_sains_342_actual_source_staging
          python - <<'PY'
          import fitz
          from pathlib import Path
          p=Path('staging/rpt_2027_seragam_2026/sains_342_pdp_SEPARA_DRAF')
          pdfs=sorted(p.glob('*.pdf'))
          assert len(pdfs)==5
          pages=0
          for file in pdfs:
              with fitz.open(file) as d:
                  assert d.page_count>=2
                  pages+=d.page_count
                  for i,pg in enumerate(d):
                      assert pg.rect.width>pg.rect.height
                      assert chr(0) not in pg.get_text()
                      for b in pg.get_text('blocks'):
                          x0,y0,x1,y1=b[:4]
                          assert 0<=x0<=x1<=pg.rect.width and 0<=y0<=y1<=pg.rect.height,(file.name,i,b[:4])
                  d[0].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(
                      str(file.with_suffix('.cover.png')))
                  d[1].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(
                      str(file.with_suffix('.page2.png')))
          print('SAINS_342_PDF_QA_OK files',len(pdfs),'pages',pages)
          PY
      - name: Audit RPT developer-note leakage in SAINS output (read-only)
        run: |
          python -m unittest tests.test_rpt2027_teacher_text_leak_scan -v
          python -m scripts.audit_rpt2027_teacher_text_leaks_20261108 \
            --teacher-output-only \
            --fail-on-findings \
            --output staging/rpt_2027_seragam_2026/teacher_text_leak_SAINS.json \
            staging/rpt_2027_seragam_2026/sains_342_pdp_SEPARA_DRAF
      - uses: actions/upload-artifact@v4
        with:
          name: RPT2027-SAINS-342-PDP-PROPOSAL-FIVE-COLUMN-PARTIAL-DRAF
          path: |
            staging/rpt_2027_seragam_2026/teacher_text_leak_SAINS.json
            staging/rpt_2027_seragam_2026/sains_342_pdp_SEPARA_DRAF/*.pdf
            staging/rpt_2027_seragam_2026/sains_342_pdp_SEPARA_DRAF/*.png
            staging/rpt_2027_seragam_2026/sains_verified_sp_coverage_gap_20261107_DRAF.json
            staging/rpt_2027_seragam_2026/sains_80_sp_not_covered_DSKP_REFERENCE_DRAF/*.pdf
            staging/rpt_2027_seragam_2026/sains_29_sp_12_topic_clusters_review_20261107_DRAF.json
            staging/rpt_2027_seragam_2026/sains_5_missing_units_10_candidate_pdp_DRAF/*.pdf
            staging/rpt_2027_seragam_2026/sains_v26_vs_kssr2017_official_y4_y5_code_diff_20261107.json
            staging/rpt_2027_seragam_2026/sains_kssr2017_186_sp_wording_diff_DRAF.json
            staging/rpt_2027_seragam_2026/sains_legacy_pdp_kssr2017_conflicts_DRAF.json
            staging/rpt_2027_seragam_2026/sains_y2_y3_original_dskp_code_membership_DRAF.json
            staging/rpt_2027_seragam_2026/sains_y6_2020_BPK_guide_43_sp_84_pdp_kps_DRAF.json
          if-no-files-found: error
          retention-days: 14
