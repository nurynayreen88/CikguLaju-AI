name: RPT2027 Sains 342-source-PdP five-column partial QA
on:
  pull_request:
    paths:
      - 'scripts/build_rpt_2027_sains_342_actual_source_staging.py'
      - 'tests/test_rpt_2027_sains_342_actual_source_staging.py'
      - 'scripts/audit_sains_rpt2027_uncovered_verified_sp_staging.py'
      - 'tests/test_sains_rpt2027_uncovered_verified_sp_staging.py'
      - 'scripts/build_rpt2027_sains_80_sp_gap_appendix_staging.py'
      - 'tests/test_rpt2027_sains_80_sp_gap_appendix_staging.py'
      - '.github/workflows/rpt2027-sains-342-pdp-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa_sains342:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'PyMuPDF==1.24.14' 'reportlab==4.2.5'
      - run: python -m py_compile scripts/build_rpt_2027_sains_342_actual_source_staging.py scripts/audit_sains_rpt2027_uncovered_verified_sp_staging.py
      - name: Run five subject-year DSKP-source RPT tests
        run: python -m unittest tests.test_rpt_2027_sains_342_actual_source_staging -v
      - name: Compute audited Sains SP missing from historical PdP (not lessons)
        run: |
          python -m scripts.audit_sains_rpt2027_uncovered_verified_sp_staging
          python -m unittest tests.test_sains_rpt2027_uncovered_verified_sp_staging -v
      - name: Render three additional source-verified 80-SP annex PDFs
        run: |
          python -m unittest tests.test_rpt2027_sains_80_sp_gap_appendix_staging -v
          python -m scripts.build_rpt2027_sains_80_sp_gap_appendix_staging
      - name: Build five Sains partial 2027 PDF drafts
        run: |
          python -m scripts.build_rpt_2027_sains_342_actual_source_staging
          python - <<'PY'
          import fitz
          from pathlib import Path
          p=Path('staging/rpt_2027_seragam_2026/sains_342_pdp_SEPARA_DRAF')
          pdfs=sorted(p.glob('*.pdf'))
          assert len(pdfs)==5
          pages=0
          for file in pdfs:
              with fitz.open(file) as d:
                  assert d.page_count>=2
                  pages+=d.page_count
                  for i,pg in enumerate(d):
                      assert pg.rect.width>pg.rect.height
                      assert chr(0) not in pg.get_text()
                      for b in pg.get_text('blocks'):
                          x0,y0,x1,y1=b[:4]
                          assert 0<=x0<=x1<=pg.rect.width and 0<=y0<=y1<=pg.rect.height,(file.name,i,b[:4])
                  d[0].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(
                      str(file.with_suffix('.cover.png')))
                  d[1].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(
                      str(file.with_suffix('.page2.png')))
          print('SAINS_342_PDF_QA_OK files',len(pdfs),'pages',pages)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RPT2027-SAINS-342-PDP-PROPOSAL-FIVE-COLUMN-PARTIAL-DRAF
          path: |
            staging/rpt_2027_seragam_2026/sains_342_pdp_SEPARA_DRAF/*.pdf
            staging/rpt_2027_seragam_2026/sains_342_pdp_SEPARA_DRAF/*.png
            staging/rpt_2027_seragam_2026/sains_verified_sp_coverage_gap_20261107_DRAF.json
            staging/rpt_2027_seragam_2026/sains_80_sp_not_covered_DSKP_REFERENCE_DRAF/*.pdf
          if-no-files-found: error
          retention-days: 14
