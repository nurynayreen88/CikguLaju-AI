name: KP2027 Tahun 1 RPT A/B Word PDF QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'rpt_2027/kp2027/year1_rpt_bm_math_alam_20261122.zip'
      - 'rpt_2027/kp2027/year1_rpt_bm_math_alam_20261122_umum.zip'
      - 'rpt_2027/kp2027/year1_rpt_bm_math_alam_gabungan_ab_20261122.zip'
      - 'rpt_2027/kp2027/year1_rpt_bm_math_alam_gabungan_ab_kulit_asal_20261122.zip'
      - 'web/kp2027_year1_rpt_combined.py'
      - 'web/kp2027_year1_rpt_personalize.py'
      - 'web/rpt_school_cover.py'
      - 'tests/test_kp2027_rpt_profile_cover_20261122.py'
      - 'tests/test_kp2027_rpt_ab_combined_20261122.py'
      - 'tests/test_rpt_word_paid_founder_gate_20261123.py'
      - 'web/kp2027_year1_rpt_bundle.py'
      - 'web/rpt_2027_all_http.py'
      - 'web_v1_static_preview/index.html'
      - 'tests/test_kp2027_rpt_year1_20261122.py'
      - '.github/workflows/kp2027-rpt-year1-20261122.yml'
permissions:
  contents: read
jobs:
  verify-rpt-word-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install profile cover test dependencies
        run: python -m pip install Flask python-docx PyMuPDF
      - name: Verify all 12 source SHA hashes, A/B and Web
        run: python -m unittest discover -s tests -p 'test_kp2027_rpt_year1_20261122.py' -v
      - name: Validate one combined RPT per subject
        run: python -m unittest discover -s tests -p 'test_kp2027_rpt_ab_combined_20261122.py' -v
      - name: Verify paid teacher profile school logo on Word/PDF; free unchanged
        run: python -m unittest discover -s tests -p 'test_kp2027_rpt_profile_cover_20261122.py' -v
      - name: Verify premium Word gate for founder, paid VIP and free/expired
        run: python -m unittest discover -s tests -p 'test_rpt_word_paid_founder_gate_20261123.py' -v
      - name: Python source syntax
        run: python -m py_compile web/kp2027_year1_rpt_bundle.py web/kp2027_year1_rpt_combined.py web/kp2027_year1_rpt_personalize.py web/rpt_2027_all_http.py
      - name: Browser JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require("node:fs"),vm=require("node:vm");
          const html=fs.readFileSync("web_v1_static_preview/index.html","utf8");
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          for(const match of scripts){
            if(match[1].trim().length>100) new vm.Script(match[1]);
          }
          console.log("All inline JavaScript parses");
          NODE
