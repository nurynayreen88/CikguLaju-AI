name: Secondary KSSM RPH staging QA
on:
  pull_request:
    paths:
      - 'secondary_2027/**'
      - '.github/workflows/secondary-kssm-staging-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secondary-rph-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 180 staged BM lesson plans
        run: python -m unittest discover -s secondary_2027/tests -p 'test_*quality.py' -v
