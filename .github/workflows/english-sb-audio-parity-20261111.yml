name: English selected Student Book and track parity
on:
  push:
    branches: [fix/telegram-english-web-materials-20261113, fix/english-sk-source-coverage-20261113, fix/english-y2-web-source-20261113]
    paths:
      - 'web/telegram_english_sb_audio_api_20261111.py'
      - 'tools/run_telegram_with_curriculum_api.py'
      - 'tests/test_english_sb_audio_parity_20261111.py'
      - '.github/workflows/english-sb-audio-parity-20261111.yml'
  pull_request:
    paths:
      - 'web/telegram_english_sb_audio_api_20261111.py'
      - 'tools/run_telegram_with_curriculum_api.py'
      - 'tests/test_english_sb_audio_parity_20261111.py'
      - '.github/workflows/english-sb-audio-parity-20261111.yml'
permissions:
  contents: read
jobs:
  lesson-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'flask==3.1.3' 'pypdf==5.1.0' 'requests==2.32.3'
      - run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_english_sb_audio_parity_20261111.py' -v
