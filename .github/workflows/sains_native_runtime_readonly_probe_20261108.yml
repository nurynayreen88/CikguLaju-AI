name: Sains native source runtime read-only probe

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/sains_native_runtime_readiness_probe_20261108.py"
      - "tests/test_sains_native_runtime_readiness_probe_20261108.py"
      - "tools/run_telegram_with_curriculum_api.py"
      - ".github/workflows/sains_native_runtime_readonly_probe_20261108.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sains-live-source-probe-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated native API test requirements
        run: python -m pip install flask==3.1.3 python-docx==1.1.2
      - name: Assert current Telegram DB read-only source probes do not change quotas or start downloads
        run: python -m unittest discover -s tests -p "test_sains_native_runtime_readiness_probe_20261108.py" -v
