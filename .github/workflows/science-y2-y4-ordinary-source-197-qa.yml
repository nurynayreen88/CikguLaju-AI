name: Science 197 pinned ordinary source field extraction QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/audit_science_y2_y4_ordinary_source_20261128.py'
      - '.github/workflows/science-y2-y4-ordinary-source-197-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        year: [2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 495d0b24d5ded8026f5e85cf4b39d45cbe2debb7
          path: native_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask requests python-docx reportlab pypdf pillow pymupdf fonttools
      - name: Extract only original curriculum fields in isolated local checkout
        run: python tools/audit_science_y2_y4_ordinary_source_20261128.py --native-root native_source --index audits/rph_5p_science_y2_y3_y4_consolidated_197_20261128.json --year ${{ matrix.year }} --out qa_original_science_y${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: science-y${{ matrix.year }}-pinned-ordinary-rph-curriculum-fields
          path: qa_original_science_y${{ matrix.year }}/
          retention-days: 7
