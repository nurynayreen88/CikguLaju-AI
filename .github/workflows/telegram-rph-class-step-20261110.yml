name: Telegram RPH direct class input (PR 322)
on:
  push:
    branches:
      - fix/telegram-rph-class-step-20261105
    paths:
      - app.py
      - tests/test_telegram_rph_class_step_20261110.py
      - .github/workflows/telegram-rph-class-step-20261110.yml
  pull_request:
    paths:
      - app.py
      - tests/test_telegram_rph_class_step_20261110.py
      - .github/workflows/telegram-rph-class-step-20261110.yml

permissions:
  contents: read

jobs:
  direct-class-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax and no-network class prompt regression
        run: python -m unittest discover -s tests -p 'test_telegram_rph_class_step_20261110.py' -v
