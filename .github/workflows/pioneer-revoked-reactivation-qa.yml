name: Revoked Rakan Pembangun reactivation QA
on:
  push:
    branches: [fix/pioneer-reactivation-audit-payment3-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests==2.32.3' 'flask==3.1.3'
      - name: Python syntax and imports
        run: python -m py_compile pioneer_supabase.py pioneer_telegram.py
      - name: Original and reactivated Rakan Pembangun approval paths
        run: |
          python -m unittest discover -s tests -p test_pioneer_supabase.py -v
          python -m unittest discover -s tests -p test_pioneer_approval_recovery.py -v
          python -m unittest discover -s tests -p test_pioneer_entitlements.py -v
          python -m unittest discover -s tests -p test_pioneer_paid_recovery.py -v
      - name: Existing payment and admin receipt controls
        run: |
          python -m unittest discover -s . -p test_payment_record_on_proof_runtime.py -v
          python -m unittest discover -s . -p test_payment_receipt_admin_runtime.py -v
