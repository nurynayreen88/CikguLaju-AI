name: KP2027 PJ combined RPT QA
on:
  pull_request:
    paths:
      - 'tools/kp2027_pj_rpt_combined_qa_20261124.py'
      - 'audits/kp2027_pj_t1_rpt_127_pdp_source_map_20261124.json'
      - 'audits/kp2027_pj_t1_127_rph_structured_candidates_20261124.json'
      - 'audits/kp2027_pj_t1_rpt_rph_sp_delta_20261124.json'
      - '.github/workflows/kp2027-pj-rpt-combined-qa.yml'
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-liberation
      - run: pip install python-docx pymupdf
      - run: python tools/kp2027_pj_rpt_combined_qa_20261124.py --pdf
      - name: Verify PDF landscape and all 127 PdP
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import pymupdf
          path = Path("qa-pj-rpt/QA_RPT_KP2027_PJ_T1_AB_2027.pdf")
          with pymupdf.open(path) as doc:
              texts = [p.get_text() for p in doc]
              assert all(abs(p.rect.width-841.89)<2 and abs(p.rect.height-595.28)<2 for p in doc)
              text = "\n".join(texts)
              assert re.findall(r"PdP\s+(\d{3})", text) == [f"{i:03}" for n in (64,63) for i in range(1,n+1)]
              assert "SALINAN SEMAKAN DALAMAN" in texts[0]
              flags = sum(len(re.findall(r"Semak\s+padanan\s+SP\s+calon\.", t)) for t in texts)
              assert flags == 107, f"Expected 107 review flags, found {flags}"
              for p in doc:
                  for x0,y0,x1,y1,*_ in p.get_text("blocks"):
                      assert 0 <= x0 < x1 <= p.rect.width+0.5, (p.number,x0,x1)
                      assert 0 <= y0 < y1 <= p.rect.height+0.5, (p.number,y0,y1)
              for i in (0,1,len(doc)-1):
                  doc[i].get_pixmap(matrix=pymupdf.Matrix(1.3,1.3)).save(str(path.parent / f"page-{i+1}.png"))
              print(f"QA PDF: {len(doc)} landscape pages, 127 PdP, 107 review flags")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kp2027-pj-rpt-review-only
          path: qa-pj-rpt/
          retention-days: 7
