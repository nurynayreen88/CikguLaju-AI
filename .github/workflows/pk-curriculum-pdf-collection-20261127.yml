rl\":\"https://asiemodel.net/wp-content/uploads/2022/08/025-DSKP-KSSR-PENDIDIKAN-KHAS-SEMAKAN-2017-MASALAH-PEMBELAJARAN-PENDIDIKAN-ISLAM-TAHUN-2.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":3,\"subject\":\"Pendidikan Islam\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/025-DSKP-KSSR-SEMAKAN-2017-MASALAH-PEMBELAJARAN-PENDIDIKAN-ISLAM-TAHUN-3.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":4,\"subject\":\"Pendidikan Islam\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/DSKP-KSSR-SEMAKAN-2017-PKHAS-MASALAH-PEMBELAJARAN-PENDIDIKAN-ISLAM-TAHUN-4.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":5,\"subject\":\"Pendidikan Islam\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/031_DSKP_KSSR_Semakan-2017_Masalah-Pembelajaran-PEND-ISLAM-Tahun-5-new-print.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":1,\"subject\":\"Pendidikan Moral\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/24-DSKP-KSSR-Pendidikan-Khas-Masalah-Pembelajaran-Tahun-1-Pendidikan-Moral-12122016.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":3,\"subject\":\"Pendidikan Moral\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/026-DSKP-KSSR-SEMAKAN-2017-MASALAH-PEMBELAJARAN-PENDIDIKAN-MORAL-TAHUN-3.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":5,\"subject\":\"Pendidikan Moral\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/032_DSKP-KSSR-MASALAH-PEMBELAJARAN-PEN.-MORAL-THN-5-30.01.2020-PRINT.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":2,\"subject\":\"Pendidikan Jasmani\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/027-DSKP-KSSR-PENDIDIKAN-KHAS-SEMAKAN-2017-MASALAH-PEMBELAJARAN-PENDIDIKAN-JASMANI-TAHUN-2.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":3,\"subject\":\"Pendidikan Jasmani\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/027-DSKP-KSSR-SEMAKAN-2017-MASALAH-PEMBELAJARAN-PENDIDIKAN-JASMANI-TAHUN-3.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":5,\"subject\":\"Pendidikan Jasmani dan Pendidikan Kesihatan\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/036_DSKP_KSSR_Semakan_2017_P_Khas_Masalah_Pembelajaran_PJ_dan_PK_Thn5-PRINT.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":4,\"subject\":\"Matematik\",\"url\":\"https://asiemodel.net/wp-content/uploads/2025/03/DSKP-KSSR-SEMAKAN-2017-PKHAS-MASALAH-PEMBELAJARAN-MATEMATIK-TAHUN-4.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":5,\"subject\":\"Matematik\",\"url\":\"https://asiemodel.net/wp-content/uploads/2025/03/035_DSKP-KSSR-MASALAH-PEMBELAJARAN-MATEMATIK-THN-5-29.01.2020-PRINT.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":2,\"subject\":\"Pendidikan Seni Kreatif\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/028-DSKP-KSSR-PENDIDIKAN-KHAS-SEMAKAN-2017-MASALAH-PEMBELAJARAN-PENDIDIKAN-SENI-KREATIF-TAHUN-2.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":4,\"subject\":\"Pendidikan Moral\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/DSKP-KSSR-SEMAKAN-2017-PKHAS-MASALAH-PEMBELAJARAN-PENDIDIKAN-MORAL-TAHUN-4.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":4,\"subject\":\"Bahasa Inggeris\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/DSKP-KSSR-SEMAKAN-2017-PKHAS-MASALAH-PEMBELAJARAN-BAHASA-INGGERIS-TAHUN-4.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":4,\"subject\":\"Kemahiran Hidup Asas\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/DSKP-KEMAHIRAN-HIDUP-ASAS-TAHUN-4_6-DEC-2019.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":6,\"subject\":\"Kemahiran Hidup Asas\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/30.-DSKP-KSSR-PKhas-MP-KEMAHIRAN-HIDUP-ASAS-Tahun-6_ISBN.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":6,\"subject\":\"Pendidikan Moral\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/26.-DSKP-KSSR-PKHAS-MP-PEND-MORAL-TAHUN-6_ISBN_.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":1,\"subject\":\"Pendidikan Jasmani\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/25-DSKP-KSSR-Pendidikan-Khas-Masalah-Pembelajaran-Tahun-1-Pendidikan-Jasmani-02122016.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":6,\"subject\":\"Pendidikan Muzik\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/31_DSKP-KSSR-SEMAKAN-2017_MASALAH-PEMBELAJARAN-PENDIDIKAN-MUZIK-TAHUN-6_ISBN.pdf\"},{\"stream\":\"masalah-pembelajaran\",\"year\":6,\"subject\":\"Pendidikan Jasmani dan Pendidikan Kesihatan\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/35.-DSKP-KSSR-SEMAKAN-2017-PKHAS-MP-PJPK-tahun-6_ISBN.pdf\"},{\"stream\":\"pendengaran\",\"year\":1,\"subject\":\"Bahasa Melayu (Suaian)\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/17-DSKP-KSSR-Pendidikan-Khas-Ketidakupayaan-Pendengaran-Tahun-1-Bahasa-Melayu-Suaian-08122016.pdf\"},{\"stream\":\"pendengaran\",\"year\":2,\"subject\":\"Bahasa Melayu (Suaian)\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/017-DSKP-KSSR-PENDIDIKAN-KHAS-SEMAKAN-2017-KETIDAKUPAYAAN-PENDENGARAN-BAHASA-MELAYU-SUAIAN-TAHUN-2.pdf\"},{\"stream\":\"pendengaran\",\"year\":3,\"subject\":\"Bahasa Melayu (Suaian)\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/017-DSKP-KSSR-SEMAKAN-2017-KETIDAKUPAYAAN-PENDENGARAN-BAHASA-MELAYU-SUAIAN-TAHUN-3.pdf\"},{\"stream\":\"pendengaran\",\"year\":4,\"subject\":\"Bahasa Melayu (Suaian)\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/DSKP-BM-SUAIAN-TAHUN-4-17.9.pdf\"},{\"stream\":\"pendengaran\",\"year\":5,\"subject\":\"Bahasa Melayu (Suaian)\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/024_DSKP_KSSR_Semakan_2017_P_Khas_Ketidakupayaan_Pendengaran_BM_Suaian_Thn5-print.pdf\"},{\"stream\":\"pendengaran\",\"year\":6,\"subject\":\"Bahasa Melayu (Suaian)\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/18.-DSKP-KSSR-SEMAKAN-2017_K_PENDENGARAN-B.-MELAYU-SUAIAN-TAHUN-6-_ISBN.pdf\"},{\"stream\":\"pendengaran\",\"year\":1,\"subject\":\"Pendidikan Islam\",\"url\":\"https://skpktaiping.home.blog/wp-content/uploads/2019/02/18-dskp-kssr-pendidikan-khas-ketidakupayaan-pendengaran-tahun-1-pendidikan-islam-06122016.pdf\"},{\"stream\":\"pendengaran\",\"year\":2,\"subject\":\"Pendidikan Islam (Suaian)\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/018-DSKP-KSSR-PENDIDIKAN-KHAS-SEMAKAN-2017-TUPENDENGARAN-PENDIDIKAN-ISLAM-SUAIAN-TAHUN-2.pdf\"},{\"stream\":\"pendengaran\",\"year\":4,\"subject\":\"Pendidikan Islam (Suaian)\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/DSKP-KSSR-SEMAKAN-2017-PKHAS-KETIDAKUPAYAAN-PENDENGARAN-PENDIDIKAN-ISLAM-SUAIAN-TAHUN-4.pdf\"},{\"stream\":\"pendengaran\",\"year\":1,\"subject\":\"Bahasa Inggeris\",\"url\":\"https://skpktaiping.home.blog/wp-content/uploads/2019/02/30-dskp-kssr-pendidikan-khas-ketidakupayaan-pendengaran-bahasa-inggeris-08122016.pdf\"},{\"stream\":\"pendengaran\",\"year\":1,\"subject\":\"Bahasa Isyarat Komunikasi\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/19-DSKP-KSSR-Pendidikan-Khas-Ketidakupayaan-Pendengaran-Tahun-1-Bahasa-Isyarat-Komunikasi-06122016.pdf\"},{\"stream\":\"pendengaran\",\"year\":2,\"subject\":\"Bahasa Isyarat Komunikasi\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/021-DSKP-KSSR-PENDIDIKAN-KHAS-SEMAKAN-2017-TU-PENDENGARAN-BAHASA-ISYARAT-KOMUNIKASI-TAHUN-2.pdf\"},{\"stream\":\"pendengaran\",\"year\":3,\"subject\":\"Bahasa Isyarat Komunikasi\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/021-DSKP-KSSR-SEMAKAN-2017-KETIDAKUPAYAAN-PENDENGARAN-BAHASA-ISYARAT-KOMUNIKASI-TAHUN-3.pdf\"},{\"stream\":\"penglihatan\",\"year\":3,\"subject\":\"Kemahiran Asas Individu Ketidakupayaan Penglihatan\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/022-DSKP-KSSR-SEMAKAN-2017-KETIDAKUPAYAAN-PENGLIHATAN-KEMAHIRAN-ASAS-INDIVIDU-KETIDAKUPAYAAN-PENGLIHATAN-TAHUN-3.pdf\"},{\"stream\":\"penglihatan\",\"year\":5,\"subject\":\"Kemahiran Asas Individu Ketidakupayaan Penglihatan\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/029_DSKP-KSSR-KETIDAKUPAYAAN-PENGLIHATAN-KEM-ASAS-INDV-KP-TAHUN-5-27022020-print.pdf\"},{\"stream\":\"penglihatan\",\"year\":6,\"subject\":\"Kemahiran Asas Individu Ketidakupayaan Penglihatan\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/23.-DSKP-KSSR-PKHAS-SEMAKAN-2017_k_PENGLIHATAN-KAIKuP-TAHUN-6_ISBN.pdf\"},{\"stream\":\"penglihatan\",\"year\":6,\"subject\":\"Pendidikan Jasmani (Suaian) dan Pendidikan Kesihatan\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/21.-DSKP-KSSR-PKhas-SEMAKAN-2017_K_PENGLIHATAN-PJSPK-TAHUN-6_ISBN.pdf\"},{\"stream\":\"penglihatan\",\"year\":2,\"subject\":\"Kemahiran Asas Individu Ketidakupayaan Penglihatan\",\"url\":\"https://asiemodel.net/wp-content/uploads/2022/08/022-DSKP-KSSR-PEND-KHAS-SEMAKAN-2017-TU-PENGLIHATAN-KEMAHIRAN-ASAS-INDIVIDU-TU-PENGLIHATAN-TAHUN-2.pdf\"}]")
          out=pathlib.Path("pk-verified");out.mkdir(exist_ok=True)
          def normalize(t):
              return re.sub(r"[^a-z0-9]+"," ",unicodedata.normalize("NFKD",t).lower()).strip()
          def get(d):
              stream=d["stream"];year=d["year"];subject=d["subject"]
              name=f"DSKP KSSRPK - {stream} - {subject} - Tahun {year}.pdf".replace("/","-")
              path=out/name
              try:
                  req=urllib.request.Request(d["url"],headers={"User-Agent":"Mozilla/5.0 (compatible; CikguLaju curriculum reference collection)"})
                  with urllib.request.urlopen(req,timeout=35) as response:
                      if urllib.parse.urlparse(response.geturl()).scheme!="https": raise ValueError("non-HTTPS redirect")
                      data=response.read(30*1024*1024+1)
                  if len(data)>30*1024*1024 or not data.startswith(b"%PDF-"): raise ValueError("invalid or oversized PDF")
                  path.write_bytes(data)
                  info=subprocess.run(["pdfinfo",str(path)],capture_output=True,text=True,timeout=20,check=True).stdout
                  cover=subprocess.run(["pdftotext","-f","1","-l","2","-layout",str(path),"-"],capture_output=True,text=True,timeout=20,check=True).stdout
                  norm=normalize(cover)
                  required={"masalah-pembelajaran":"masalah pembelajaran","pendengaran":"pendengaran","penglihatan":"penglihatan"}[stream]
                  words=normalize(subject)
                  year_words={1:"satu",2:"dua",3:"tiga",4:"empat",5:"lima",6:"enam"}
                  if required not in norm or not re.search(r"\btahun\s+(?:"+str(year)+"|"+year_words[year]+r")\b",norm) or words not in norm or not ("kurikulum" in norm and "pentaksiran" in norm):
                      raise ValueError("cover identity requires manual review")
                  return {**d,"status":"verified","filename":name,"sha256":hashlib.sha256(data).hexdigest(),"bytes":len(data),"pages":re.search(r"Pages:\s+(\d+)",info).group(1)}
              except Exception as e:
                  path.unlink(missing_ok=True)
                  return {**d,"status":"held","reason":str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              rows=list(pool.map(get,docs))
          (out/"manifest.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding="utf-8")
          for r in rows: print(r["status"],r["stream"],r["year"],r["subject"],r.get("reason",""))
          print("Verified:",sum(r["status"]=="verified" for r in rows),"/",len(rows))
          PY
      - name: Save collection and verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: pk-curriculum-verified-pdfs
          path: pk-verified/
          retention-days: 3
