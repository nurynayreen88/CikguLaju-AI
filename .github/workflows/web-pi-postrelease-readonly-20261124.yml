name: Web PI postrelease read-only smoke (no user credits)
on:
  pull_request:
    paths:
      - ".github/workflows/web-pi-postrelease-readonly-20261124.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-live-web-no-account:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Live Web health/readiness, unauthenticated PI RPH gates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from time import sleep

          WEB = "https://cikgulaju-web.onrender.com"

          def get(path):
              req = Request(WEB + path, headers={
                  "Accept": "application/json",
                  "User-Agent": "CikguLaju-ReadOnly-CI-20261124",
              }, method="GET")
              for attempt in range(3):
                  try:
                      with urlopen(req, timeout=20) as resp:
                          code, payload, headers = resp.status, resp.read(16000), resp.headers
                      return code, json.loads(payload), headers
                  except HTTPError as exc:
                      code, payload, headers = exc.code, exc.read(16000), exc.headers
                      return code, json.loads(payload), headers
                  except (URLError, TimeoutError) as exc:
                      if attempt == 2:
                          raise AssertionError("Web not reachable from external GitHub runner") from exc
                      sleep(5)

          code, health, headers = get("/healthz")
          assert code == 200 and health.get("service") == "cikgulaju-web" and health.get("live") is True, (code,health)
          print("PASS public /healthz: 200 live")

          code, ready, headers = get("/readyz")
          print("Readiness:",json.dumps({
              key:ready.get(key) for key in (
                  "service", "ready", "account_lookup_configured",
                  "authoritative_curriculum_configured",
                  "authoritative_curriculum_reachable",
              )
          }))
          assert code == 200 and ready.get("ready") is True, (code,ready)
          assert ready.get("account_lookup_configured") is True, ready
          assert ready.get("authoritative_curriculum_configured") is True, ready
          assert ready.get("authoritative_curriculum_reachable") is True, ready
          print("PASS readyz: Web can reach authoritative Telegram curriculum")

          for path in (
              "/api/auth/telegram/session",
              "/api/web/rph/availability?year=2&subject=PI",
              "/api/web/rph/word?year=2&subject=PI",
              "/api/web/rph/pdf?year=2&subject=PI",
          ):
              code, body, headers = get(path)
              assert code == 401, (path,code,body)
              print("PASS anonymous blocked:",path,code)
          print("READ_ONLY_WEB_PI_SMOKE_PASS: no cookies, no uploads, no credit debit, no RPH render")
          PY

      - name: Checkout exact Web production code
        uses: actions/checkout@v4
        with:
          ref: production/cikgulaju-web-20261105
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inspection dependencies (no external service calls)
        run: python -m pip install "python-docx>=1.1,<2" "lxml>=5,<7" "pymupdf>=1.24,<2"
      - name: Fetch audited Word/PDF generated by latest Telegram RPH runtime
        uses: actions/download-artifact@v4
        with:
          name: CIKGULAJU_SK_SP_PI_HEADER_20261124_REAL_SAMPLES
          run-id: 45284007385
          repository: nurynayreen88/CikguLaju-AI
          github-token: ${{ github.token }}
          path: /tmp/jawi-rph-real
      - name: Ensure Web postprocessors preserve PI source color, Jawi digits and reflection
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile
          from lxml import etree
          from web.rph_activity_heading_delivery import style_word_activity_titles
          from web.rph_kp2027_word_polish import polish_kssr_word
          from web.rph_reflection_universal import personalize_verified_document

          root=Path("/tmp/jawi-rph-real/rph-source-reflections")
          native_word=(root/"CIKGULAJU_PI_REFLEKSI_OBJ_AKTIF.docx").read_bytes()
          native_pdf=(root/"CIKGULAJU_PI_REFLEKSI_OBJ_PDF_NATIVE.pdf").read_bytes()
          w="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          def inspect_doc(blob):
              with ZipFile(BytesIO(blob)) as archive:
                  assert archive.testzip() is None
                  doc=etree.fromstring(archive.read("word/document.xml"))
              tokens=tuple(n.text or "" for n in doc.iter(w+"t"))
              fills=Counter(n.get(w+"fill") for n in doc.iter(w+"shd")
                            if n.get(w+"fill") not in (None, "auto"))
              return tokens,fills
          before,original_fills=inspect_doc(native_word)
          assert not any("0" <= c <= "9" for t in before for c in t)
          assert original_fills and set(original_fills)=={"ECE4F6"}, original_fills
          document=style_word_activity_titles(BytesIO(native_word))
          document=polish_kssr_word(document,"PI")
          document=personalize_verified_document(document,"word",{
              "source":"telegram-verified-rpt-master","subject":"PI","teacher":{"reflection":""}
          })
          after,new_fills=inspect_doc(document.getvalue())
          assert before==after, "Web display processing altered approved Jawi words or numbers"
          assert original_fills==new_fills, (
              "Web processing altered approved uniform PI lilac palette",original_fills,new_fills
          )
          result=personalize_verified_document(BytesIO(native_pdf),"pdf",{
              "source":"telegram-verified-rpt-master","subject":"PI","teacher":{"reflection":""}
          })
          assert result.getvalue()==native_pdf, "Web changed native PI PDF"
          print("WEB_PI_REAL_NATIVE_DOC_PASS: all Word tokens unchanged, 0 ASCII digits, lilac boxes exact, native PDF unchanged")
          PY
