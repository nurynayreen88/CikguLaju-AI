name: Build five integrated English compact free PDFs
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - '.github/workflows/rpt-english-five-compact-pdf-20261126.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rpt-english-five-compact-pdf-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - name: Generate five unpersonalized PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from hashlib import sha256
          import json
          import fitz
          from tools.build_english_rpt_merged_week_word_pdf_20261126 import render,source_identity
          root=Path("rpt_2027")
          output=root/"compact_english_pdf_2027"
          output.mkdir(parents=True,exist_ok=True)
          lock=json.loads((root/"web_2027_pdfs"/"original_cover_layout_verified.json").read_text())
          entries={}
          with TemporaryDirectory() as temp:
              for year in range(2,7):
                  key=f"english:{year}"
                  original,digest=source_identity(year)
                  assert digest==lock["english_integrated"]["source_sha256_by_subject_year"][key]
                  report=render(year,Path(temp))
                  candidate=Path(temp)/f"RPT_English_SK_2027_Year_{year}_A_B.pdf"
                  data=candidate.read_bytes()
                  assert sha256(data).hexdigest()==report["pdf_sha256"]
                  with fitz.open(original) as a,fitz.open(candidate) as b:
                      assert a[0].get_pixmap().samples==b[0].get_pixmap().samples
                      assert len(b)==report["pdf_pages"]
                      for page in b:
                          assert page.get_text().strip() and page.get_pixmap(matrix=fitz.Matrix(.5,.5),alpha=False).width>0
                      entry={"path":f"english/tahun_{year}.pdf","source_sha256":digest,
                             "sha256":report["pdf_sha256"],"bytes":len(data),"pages":len(b),"source_pages":len(a),
                             "lessons":160,"sessions":142}
                  dest=output/entry["path"]
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(data)
                  entries[key]=entry
          assert len(entries)==5 and len(list(output.rglob("*.pdf")))==5
          assert not list(output.rglob("*.docx"))
          (output/"manifest.json").write_text(json.dumps({"version":1,"status":"LAYOUT_QA_CANDIDATE","count":5,"files":entries},indent=2)+"\n")
          PY
      - name: Commit only public free PDF candidates on isolated review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rpt_2027/compact_english_pdf_2027
          git diff --cached --name-only | python -c 'import sys; p=sys.stdin.read().splitlines(); assert len(p)==6 and all(s.startswith("rpt_2027/compact_english_pdf_2027/") and (s.endswith(".pdf") or s.endswith("/manifest.json")) for s in p)'
          git commit -m "build(rpt): five English compact free PDF candidates"
          git push origin HEAD:refs/heads/feat/rpt-english-five-compact-pdf-20261126
