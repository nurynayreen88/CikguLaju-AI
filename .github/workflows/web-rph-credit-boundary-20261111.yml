name: Web RPH download and trial credit safety gate
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - web/unified_rph_web.py
      - web/rph_delivery_quota.py
      - web/native_telegram_rph_client.py
      - web/special_activities_web.py
      - web_v1_telegram_auth_routes.py
      - tests/test_web_rph_download_credit_boundary_20261111.py
      - tests/test_web_rph_availability.py
      - tests/test_web_special_activities_20261106.py
      - .github/workflows/web-rph-credit-boundary-20261111.yml
  push:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - web/unified_rph_web.py
      - web/rph_delivery_quota.py
      - web/native_telegram_rph_client.py
      - web/special_activities_web.py
      - tests/test_web_rph_download_credit_boundary_20261111.py
      - .github/workflows/web-rph-credit-boundary-20261111.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-real-debits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install 'Flask==3.1.3' 'python-docx==1.2.0' 'lxml==5.4.0'
      - name: Confirm Python module syntax
        run: python -m py_compile web/unified_rph_web.py web/rph_delivery_quota.py web/native_telegram_rph_client.py web/special_activities_web.py tests/test_web_rph_download_credit_boundary_20261111.py
      - name: Verify Web Word PDF render-then-charge and failure protections
        run: |
          python -m unittest discover -s tests -p 'test_web_rph_download_credit_boundary_20261111.py' -v
          python -m unittest discover -s tests -p 'test_web_rph_availability.py' -v
          python -m unittest discover -s tests -p 'test_web_special_activities_20261106.py' -v
