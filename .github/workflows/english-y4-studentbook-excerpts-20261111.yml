name: Year4 English Student Book exact-page export staging
on:
  push:
    branches:
      - staging/telegram-english-y4-studentbook-extract-20261111
      - staging/english-y4-studentbook-web-parity-20261111
    paths:
      - 'web/telegram_english_studentbook_api_20261111.py'
      - 'tools/run_telegram_with_curriculum_api.py'
      - 'tests/test_english_y4_studentbook_excerpt_20261111.py'
      - '.github/workflows/english-y4-studentbook-excerpts-20261111.yml'
  pull_request:
    paths:
      - 'web/telegram_english_studentbook_api_20261111.py'
      - 'tools/run_telegram_with_curriculum_api.py'
      - 'tests/test_english_y4_studentbook_excerpt_20261111.py'
permissions:
  contents: read
jobs:
  exact-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'flask==3.1.3' 'pypdf==5.1.0' 'python-docx==1.2.0'
      - run: PYTHONPATH=tests:. python -m unittest -v tests.test_english_y4_studentbook_excerpt_20261111
