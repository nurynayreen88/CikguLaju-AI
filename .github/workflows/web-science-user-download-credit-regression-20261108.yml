name: Web Sains teacher-facing Word PDF trial and paid download QA

on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - "tests/test_web_science_user_download_credit_contract_20261108.py"
      - "web/unified_rph_web.py"
      - "web/native_telegram_sequence_rph_client.py"
      - "web/rph_delivery_quota.py"
      - ".github/workflows/web-science-user-download-credit-regression-20261108.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science-real-web-user-handler-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real Word/PDF local document QA dependencies
        run: python -m pip install "flask==3.1.3" "python-docx==1.1.2" "reportlab==4.2.5" "pypdf==5.1.0"
      - name: Validate Science Web user-facing routes, source identity and trial/paid quota isolation
        run: python -m unittest discover -s tests -p "test_web_science_user_download_credit_contract_20261108.py" -v
      - name: Keep existing shared 10-RPH trial contract intact
        run: python -m unittest discover -s tests -p "test_web_shared_ten_rph_trial.py" -v
      - name: Keep native Telegram unit and PdP source handling intact
        run: python -m unittest discover -s tests -p "test_web_native_sequence_rph_bridge.py" -v
