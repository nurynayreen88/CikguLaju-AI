name: Native Telegram RPH pupil count QA
on:
  push:
    branches: [feature/telegram-native-rph-students-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'flask==3.1.3' 'requests==2.32.3' 'python-docx==1.2.0' 'lxml==6.0.2'
      - run: python -m py_compile web/native_rph_telegram_api.py
      - run: python -m unittest discover -s tests -p test_native_telegram_rph_api.py -v
