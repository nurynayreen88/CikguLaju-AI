name: Web English Y4 real PDF partner-PR WSGI contract (staging)
on:
  pull_request:
    paths:
      - 'web/native_telegram_extra_materials_20261106.py'
      - 'web/unified_rph_web.py'
      - 'tests/test_web_english_y4_partner_contract_20261111.py'
      - '.github/workflows/web-english-y4-cross-pr-contract-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-pr-real-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout Web PR code
        uses: actions/checkout@v4
      - name: Checkout pinned Telegram PR 558 code separately
        uses: actions/checkout@v4
        with:
          repository: nurynayreen88/CikguLaju-AI
          ref: c0fb43edb4384869fd49c918c0b8afa0020aee93
          path: .partner-telegram
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only offline test dependencies
        run: pip install 'flask==3.1.3' 'python-docx==1.2.0' 'lxml==5.4.0' 'pypdf==5.1.0'
      - name: Verify Web and Telegram PR contract with real source PDFs
        env:
          CIKGULAJU_PR558_DIR: .partner-telegram
        run: python -m unittest -v tests.test_web_english_y4_partner_contract_20261111
