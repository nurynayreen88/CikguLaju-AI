name: RPT DLP Year 2 Telegram
on:
  pull_request:
    branches: [main]
    paths:
      - 'rpt_2027/dlp/**'
      - 'dlp_year2_rph.py'
      - 'staging/dlp/year2/**'
      - 'rpt_2027/english/telegram_downloads.py'
      - 'tests/test_curriculum_version_dlp_download.py'
      - 'tests/test_english_rpt_2027_telegram_downloads.py'
      - '.github/workflows/rpt-dlp-year2-telegram.yml'
permissions:
  contents: read
jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_english_rpt_2027_telegram_downloads
      - run: pip install flask==3.1.3 python-docx==1.2.0 reportlab==4.2.5 pypdf==5.1.0
      - run: python -m unittest tests.test_curriculum_version_dlp_download
