name: SJKC upper mathematics RPT draft layout QA
on:
  pull_request:
    paths:
      - 'audits/rpt_2027_matematik_sjkc_t4_t6_layout_input_20261127.json'
      - 'tools/build_sjkc_upper_math_rpt_qa_20261127.py'
      - '.github/workflows/sjkc-upper-math-rpt-draft-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk
          pip install python-docx pymupdf
      - name: Generate private draft candidates and page images
        run: python tools/build_sjkc_upper_math_rpt_qa_20261127.py --out "$RUNNER_TEMP/sjkc-draft"
      - name: Upload review-only artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sjkc-upper-math-rpt-draft-layout
          path: ${{ runner.temp }}/sjkc-draft/
          if-no-files-found: error
          retention-days: 7
