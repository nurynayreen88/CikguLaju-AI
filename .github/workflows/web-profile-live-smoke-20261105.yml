name: CikguLaju Teacher Profile Live Public Smoke
on:
  push:
    branches:
      - ci/web-profile-live-smoke-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify published teacher profile UI and privacy
        run: |
          python - <<'PY'
          import time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          base="https://cikgulaju-web.onrender.com"
          def req(path,method="GET"):
            for i in range(4):
              try:
                with urlopen(Request(base+path,method=method,headers={"User-Agent":"CikguLaju-Profile-CI/1"}),timeout=25) as r:
                  return r.status,r.headers.get("Content-Type",""),r.read(70000)
              except HTTPError as e:
                return e.code,e.headers.get("Content-Type",""),e.read(5000)
              except (TimeoutError,URLError):
                if i==3:
                  raise
                time.sleep(5)
          checks=[
            ("/","GET",200),
            ("/assets/teacher-profile.js","GET",200),
            ("/api/web/teacher/profile","GET",401),
            ("/api/web/teacher/profile","PUT",401),
            ("/api/web/teacher/timetable","PUT",401),
          ]
          for path,method,expected in checks:
            code,mime,body=req(path,method)
            print(f"{method} {path}: HTTP {code} (expected {expected})")
            assert code==expected,(path,code)
            if path=="/":
              for fragment in (b'id="profile-name"',b'id="profile-school"',b'id="profile-classes"',b'id="timetable-rows"'):
                assert fragment in body,fragment
            if path=="/assets/teacher-profile.js":
              assert "javascript" in mime.lower(),mime
              assert b"loadTeacherProfile" in body
          print("PUBLIC_PROFILE_SMOKE_PASS")
          PY
