name: RPT approved SK Science Y5 Y6 native layout private QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/build_rpt_science_approved_word_20261126.py'
      - 'web/rpt_native_word_batch.py'
      - 'web/rpt_2027_all_http.py'
      - 'tests/test_rpt_native_word_batch.py'
      - 'web_v1_static_preview/index.html'
      - '.github/workflows/rpt-science-approved-native-word-20261126.yml'
permissions:
  contents: read
jobs:
  science:
    strategy:
      fail-fast: false
      matrix:
        year: [5,6]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - run: python -m tools.build_rpt_science_approved_word_20261126 --year ${{ matrix.year }} --out "$RUNNER_TEMP/rpt-private"
      - if: always()
        run: rm -rf "$RUNNER_TEMP/rpt-private"
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: python -m unittest discover -s tests -p 'test_rpt_native_word_batch.py' -v
