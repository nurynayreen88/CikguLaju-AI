name: Build 31 compact free RPT PDFs on isolated release branch
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - '.github/workflows/rpt-compact-free-pdf-release-20261126.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rpt-compact-free-pdf-release-31-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - name: Generate only unpersonalized free PDF candidates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import fitz
          from tools.build_kssr_rpt_merged_week_batch_20261126 import render,ROOT
          from web.rpt_native_word_batch import PINS
          source_manifest=json.loads((ROOT/"manifest.json").read_text())
          cover_lock=json.loads((ROOT/"original_cover_layout_verified.json").read_text())
          output=Path("rpt_2027/compact_free_pdf_2027")
          output.mkdir(parents=True,exist_ok=True)
          entries={}
          with TemporaryDirectory() as temp:
              for key,digest in sorted(PINS.items()):
                  subject,year=key.split(":")
                  assert source_manifest["files"][key]["sha256"]==digest
                  report=render(subject,int(year),Path(temp),source_manifest,cover_lock)
                  candidate=Path(temp)/f"RPT_{subject}_tahun_{year}_2027.pdf"
                  data=candidate.read_bytes()
                  assert sha256(data).hexdigest()==report["pdf_sha256"]
                  with fitz.open(candidate) as pdf:
                      assert len(pdf)==report["pages_after"]
                      assert 2<=len(pdf)<=300
                      assert all(p.get_text().strip() for p in list(pdf)[1:])
                      # Render every page, ensuring all pages are readable by the PDF engine.
                      for p in pdf:
                          pix=p.get_pixmap(matrix=fitz.Matrix(.5,.5),alpha=False)
                          assert pix.width>0 and pix.height>0
                  dest=output/subject/f"tahun_{year}.pdf"
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(data)
                  entries[key]={"path":f"{subject}/tahun_{year}.pdf","source_sha256":digest,
                                "sha256":sha256(data).hexdigest(),"bytes":len(data),
                                "pages":report["pages_after"],"source_pages":report["pages_before"],
                                "lessons":report["lessons"]}
          assert len(entries)==31
          (output/"manifest.json").write_text(json.dumps({"version":1,"status":"LAYOUT_QA_CANDIDATE",
              "count":31,"files":entries},indent=2)+"\n")
          assert not list(output.rglob("*.docx"))
          assert len(list(output.rglob("*.pdf")))==31
          print("31 free PDF candidates generated; source and cover retained, no Word or profile files")
          PY
      - name: Commit free PDF candidates only to isolated review branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rpt_2027/compact_free_pdf_2027
          git diff --cached --name-only | python -c 'import sys; p=sys.stdin.read().splitlines(); assert len(p)==32 and all(s.startswith("rpt_2027/compact_free_pdf_2027/") and (s.endswith(".pdf") or s.endswith("/manifest.json")) for s in p)'
          git commit -m "build(rpt): 31 free compact PDF candidates and source manifest"
          git push origin HEAD:refs/heads/feat/rpt-compact-free-pdf-release-31-20261126
