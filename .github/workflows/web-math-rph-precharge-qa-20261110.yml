name: Web Matematik actual RPH Word/PDF quality gate before trial debit

on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - "web/math_rph_delivery_quality_20261110.py"
      - "web/unified_rph_web.py"
      - "tests/test_web_math_rph_delivery_quality_20261110.py"
      - ".github/workflows/web-math-rph-precharge-qa-20261110.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math-user-output-and-credit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local Word PDF test runtime
        run: python -m pip install "flask==3.1.3" "python-docx==1.1.2" "reportlab==4.2.5" "pypdf==5.1.0"
      - name: Verify proven Math objective, duplicate SK and 65 versus 60 minute defects
        run: python -m unittest discover -s tests -p "test_web_math_rph_delivery_quality_20261110.py" -v
      - name: Regression: Sains Word/PDF trial and paid access remain untouched
        run: python -m unittest discover -s tests -p "test_web_science_user_download_credit_contract_20261108.py" -v
      - name: Regression: shared 10 RPH free-trial contract
        run: python -m unittest discover -s tests -p "test_web_shared_ten_rph_trial.py" -v
