name: English 2–6 native PDF core and Year4 audio conflict evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/audit_english_native_pdf_core_20261104.py'
      - 'audits/english_y4_l030_audio_source_evidence_20261104.json'
      - 'tests/test_english_y4_l030_audio_evidence.py'
      - '.github/workflows/english-native-pdf-audio-evidence-20261104.yml'
  push:
    branches: [main]
    paths:
      - 'tools/audit_english_native_pdf_core_20261104.py'
      - 'audits/english_y4_l030_audio_source_evidence_20261104.json'
      - 'tests/test_english_y4_l030_audio_evidence.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audio-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -p 'test_english_y4_l030_audio_evidence.py' -v
  native-pdf-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        year: [2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install reportlab==4.2.5 pypdf==5.1.0
      - name: Execute native production ReportLab RPH PDF core in isolated process
        run: python tools/audit_english_native_pdf_core_20261104.py --year ${{ matrix.year }}
      - name: Save per-year A4 and native PDF QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-native-pdf-core-y${{ matrix.year }}-20261104
          path: output/english_native_pdf_core_audit_20261104/year${{ matrix.year }}/report.json
          retention-days: 14
