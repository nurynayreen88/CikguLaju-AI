name: English Year 5 2027 RPH gated Telegram integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'rph_standalone/english/year5/**'
      - 'web/english_y5_standalone_runtime.py'
      - 'tools/run_telegram_with_curriculum_api.py'
      - 'tests/test_english_y5_rph_runtime.py'
      - 'tests/test_english_y5_l029_l030_source_timing_20261104.py'
      - '.github/workflows/english-y5-rph-runtime.yml'
  push:
    branches: [feat/english-y5-standalone-telegram-20261103]
permissions: {contents: read}
jobs:
  qa-gated-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'Flask>=3,<4'
      - run: python -m unittest discover -s tests -p 'test_english_y5_rph_runtime.py' -v
      - run: python -m unittest discover -s tests -p 'test_english_y5_l029_l030_source_timing_20261104.py' -v
      - run: python -m unittest discover -s tests -p 'test_english_y6_rph_runtime.py' -v
      - run: python -m unittest discover -s tests -p 'test_telegram_optional_wsgi.py' -v
