name: PSV Tahun 2–6 — full 210 Word A4 pagination staging QA
on:
  push:
    branches:
      - psv-y2-y6-rpt-rph-2027-staging-20261104
    paths:
      - 'tools/verify_psv_word_a4.py'
      - 'rph_standalone/psv/preview_a4.py'
      - 'rph_standalone/psv/year*/lesson_*.md'
      - '.github/workflows/psv-staging-full-word-a4.yml'

permissions:
  contents: read

concurrency:
  group: psv-word-a4-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paginate:
    name: Render 210 Word RPH to PDF and verify A4 page counts
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private QA dependencies only
        run: |
          python -m pip install --disable-pip-version-check python-docx==1.1.2 reportlab==4.2.5 pypdf==5.1.0
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer >/dev/null
          fi
      - name: Compile read-only staging Word validator
        run: python -m py_compile tools/verify_psv_word_a4.py rph_standalone/psv/preview_a4.py
      - name: Inspect 210 generated Word RPH, actual LibreOffice pagination
        run: python tools/verify_psv_word_a4.py --batch-size 25
      - name: Retain only QA counts, never user files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psv-staging-210-word-a4-report
          path: output/psv_word_a4_20261105/report.json
          if-no-files-found: ignore
          retention-days: 7
