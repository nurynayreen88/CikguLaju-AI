name: Affiliate claims database and Telegram
on:
  pull_request:
    paths:
      - 'supabase/migrations/*affiliate*'
      - 'referral_points_telegram.py'
      - 'web/private_referral_menu_runtime.py'
      - 'web/private_referral_admin_runtime.py'
      - 'test_private_referral_*.py'
      - 'tests/test_affiliate_claims.mjs'
      - '.github/workflows/affiliate-claims.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'requests==2.32.3'
      - run: python -m unittest -v test_private_referral_points test_private_referral_menu test_private_referral_admin
      - run: npm install --no-save --no-package-lock @electric-sql/pglite@0.5.16
      - run: node tests/test_affiliate_claims.mjs
