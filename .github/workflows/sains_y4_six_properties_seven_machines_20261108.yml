name: Sains Tahun4 six properties seven simple machines quality HOLD

on:
  pull_request:
    branches: [main]
    paths:
      - "web/sains_y4_79_activity_bank_draf_20261107.py"
      - "tests/test_sains_y4_six_material_seven_machines_20261108.py"
      - "audits/sains_y4_two_dskp_material_machine_corrections_20261108.md"
      - ".github/workflows/sains_y4_six_properties_seven_machines_20261108.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  y4-dskp-content-rph-render-print-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local DRAF Word/PDF tools
        run: |
          python -m pip install 'python-docx==1.1.2' 'reportlab==4.2.5' 'pypdf==5.1.0'
      - name: Build existing v25.82 Science source indices without database writes
        run: python -m tools.render_sains_rpt_2027_ab_review_20261106
      - name: Verify six DSKP material properties seven machines and original 79 HOLD
        run: python -m unittest discover -s tests -p 'test_sains_y4_six_material_seven_machines_20261108.py' -v
      - name: Verify source-specific 79 activities and fixed KPS/teacher-PBD mapping
        run: python -m unittest discover -s tests -p 'test_sains_y4_79_bank_quality_20261107.py' -v
      - name: Render all original 79 Year4 DRAF RPH in Word/PDF one-page A4
        run: python -m tools.render_sains_y4_79_rph_draf_20261107
      - name: Confirm full KPM SP sentence appears in all 79 actual Word and PDF
        run: python -m unittest discover -s tests -p 'test_sains_y4_79_full_dskp_sp_20261108.py' -v
      - name: LibreOffice actual Word pagination check for 79 original Year4 RPH
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-dejavu-core
          python -m tools.check_sains_y4_79_word_a4_20261107
      - name: Confirm two corrected SP remain in review copies and 79 academic HOLD
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from pypdf import PdfReader
          from tools.render_sains_y4_79_rph_draf_20261107 import OUT,get_y4_records
          records=get_y4_records()
          assert len(records)==79
          for sp,keywords in {
              '8.2.1':('penembusan cahaya','mengalirkan arus elektrik','kekenyalan'),
              '10.2.1':('baji','skru','roda dan gandar'),
          }.items():
              r=next(x for x in records if x['sp']==sp)
              stem=f"SAINS_T4_PDP_{int(r['pdp_number']):03d}_DRAF"
              word=Document(str(OUT/(stem+'.docx')))
              wordtext=' '.join(c.text for tb in word.tables for row in tb.rows for c in row.cells).lower()
              pdf=PdfReader(str(OUT/(stem+'.pdf')))
              pdftext=pdf.pages[0].extract_text().lower()
              for k in keywords:
                  assert k in wordtext,(sp,'word',k)
                  assert k in pdftext,(sp,'pdf',k)
              assert 'draf' in pdftext
              assert r['textbook_pages'] is None and r['status']=='DRAF_HOLD'
          print('79 Word/PDF DRAF and both six/seven DSKP corrections verified')
          PY
      - name: Retain review-only files in private CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SAINS_Y4_79_SIX_PROPERTIES_SEVEN_MACHINES_DRAF_HOLD
          if-no-files-found: warn
          path: |
            build/sains_y4_79_rph_DRAF_20261107/*.docx
            build/sains_y4_79_rph_DRAF_20261107/*.pdf
            build/sains_y4_79_rph_DRAF_20261107/*.csv
            build/sains_y4_79_rph_DRAF_20261107/*.json
