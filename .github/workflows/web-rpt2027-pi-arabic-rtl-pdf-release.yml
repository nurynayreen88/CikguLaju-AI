name: Web RPT2027 release PI + Bahasa Arab RTL PDFs ONLY
on:
  pull_request:
    branches:
      - 'production/cikgulaju-web-20261105'
    paths:
      - '.github/workflows/web-rpt2027-pi-arabic-rtl-pdf-release.yml'
      - 'scripts/install_rpt2027_pi_arabic_rtl_web.py'
permissions:
  contents: write
  actions: read
  pull-requests: read
jobs:
  install_ten_verified_rtl:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/web-rpt2027-pi-arabic-rtl-20261108' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 56 source PDF baseline, teacher cover and paid download API
        run: |
          python -m pip install 'Flask==3.1.3' 'PyMuPDF==1.24.14'
          python -m unittest tests.test_web_rpt2027_56_release_catalog tests.test_web_rpt_original_cover_layout -v
          sha256sum -c web_v1_static_preview/pdf-lib.min.js.sha256
      - name: Verify exact approved-to-publish-as-DRAF Github QA run and download artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC_RUN=42428324522
          SRC_SHA=f90f5e97ce7dce3408e592071b76fd7e9cc26622
          test "$(gh run view "$SRC_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" = "success"
          test "$(gh run view "$SRC_RUN" -R "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')" = "$SRC_SHA"
          mkdir -p "$RUNNER_TEMP/rpt-rtl-20"
          gh run download "$SRC_RUN" -R "$GITHUB_REPOSITORY" \
            -n 'RPT2027-20-BM-PI-ARAB-MUZIK-Seragam-DRAF' \
            -D "$RUNNER_TEMP/rpt-rtl-20"
      - name: Replace ten RTL PDFs only with full source inventory, link, page count and SHA audits
        shell: bash
        run: |
          set -euo pipefail
          python scripts/install_rpt2027_pi_arabic_rtl_web.py \
            --sources "$RUNNER_TEMP/rpt-rtl-20" --assets rpt_2027/web_2027_pdfs
          python -m unittest tests.test_web_rpt2027_56_release_catalog tests.test_web_rpt_original_cover_layout -v
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('rpt_2027/web_2027_pdfs')
          manifest=json.loads((root/'manifest.json').read_text('utf-8'))
          audit=json.loads((root/'RTL_PI_ARABIC_20261108_DRAF_AUDIT.json').read_text('utf-8'))
          assert manifest['count']==len(manifest['files'])==56
          assert audit['rtl_updated_count']==10
          assert audit['remaining_other_subject_pdfs_sha_unchanged']==46
          assert all(manifest['files'][key]['sha256'] == info['after_sha256']
                     for key,info in audit['entries'].items())
          print('RTL_PDF_WEB_INSTALL_VERIFIED',manifest['pages'])
          PY
      - name: Commit 10 reflowed PDFs, two manifests and audit to isolated Web feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/web-rpt2027-pi-arabic-rtl-20261108'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rpt_2027/web_2027_pdfs/pendidikan_islam/tahun_*.pdf \
                    rpt_2027/web_2027_pdfs/bahasa_arab/tahun_*.pdf \
                    rpt_2027/web_2027_pdfs/manifest.json \
                    rpt_2027/web_2027_pdfs/original_cover_layout_verified.json \
                    rpt_2027/web_2027_pdfs/RTL_PI_ARABIC_20261108_DRAF_AUDIT.json
          if git diff --cached --quiet; then
            echo 'Ten RTL sources already matched exactly: no changes.'
          else
            git commit -m 'assets(web): deploy ten QA-verified DRAF RTL RPT PDFs for PI and Arabic only'
            git push origin HEAD:fix/web-rpt2027-pi-arabic-rtl-20261108
          fi
