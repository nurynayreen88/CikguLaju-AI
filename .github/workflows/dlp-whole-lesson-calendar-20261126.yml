name: DLP whole-lesson RPT Word PDF calendar QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/dlp_whole_lesson_calendar_20261126.py'
      - 'tools/build_rpt_dlp_full_standards_20261126.py'
      - '.github/workflows/dlp-whole-lesson-calendar-20261126.yml'
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        subject: [mathematics_dlp, science_dlp]
        year: [2,3,4,5,6]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-writer fonts-liberation2
      - run: python -m tools.build_rpt_dlp_full_standards_20261126 --whole-weeks --subject ${{ matrix.subject }} --year ${{ matrix.year }} --out /tmp/dlp-rpt
      - uses: actions/upload-artifact@v4
        with:
          name: dlp-rpt-${{ matrix.subject }}-${{ matrix.year }}
          path: /tmp/dlp-rpt/
