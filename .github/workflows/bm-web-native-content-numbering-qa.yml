name: Telegram BM Web native content and numbering QA
on:
  push:
    branches: [main, fix/bm-web-activity-source-and-linebreaks-20261106]
    paths:
      - 'web/bm_web_rph_refinement.py'
      - 'web/telegram_native_bm_sequence_rph_bridge.py'
      - 'tests/test_bm_web_rph_refinement_20261106.py'
      - '.github/workflows/bm-web-native-content-numbering-qa.yml'
  pull_request:
    paths:
      - 'web/bm_web_rph_refinement.py'
      - 'web/telegram_native_bm_sequence_rph_bridge.py'
      - 'tests/test_bm_web_rph_refinement_20261106.py'
      - '.github/workflows/bm-web-native-content-numbering-qa.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native RPH test requirements
        run: pip install Flask==3.1.3 python-docx==1.2.0 lxml==5.4.0
      - name: Compile source
        run: python -m py_compile web/bm_web_rph_refinement.py web/telegram_native_bm_sequence_rph_bridge.py
      - name: Verify BM-specific activities and numbering
        run: python -m unittest -v tests.test_bm_web_rph_refinement_20261106
      - name: Preserve original Telegram BM source identity and Word route
        run: python -m unittest discover -s tests -p test_telegram_native_bm_sequence_rph.py -v
