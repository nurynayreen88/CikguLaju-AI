name: Arabic Music Draft Catalog and Native Document QA
on:
  push:
    branches: [feature/arabic-music-source-only-review-20261106]
    paths:
      - 'web/telegram_provisional_arab_music_api.py'
      - 'tools/other_draft_actual_smoke_20261106.py'
      - '.github/workflows/arabic-music-provisional-source-qa-20261106.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native RPH runtime dependencies
        run: pip install Flask==3.1.3 requests==2.32.3 python-docx==1.2.0 reportlab==4.2.5 pypdf==5.1.0 Pillow==11.3.0 lxml==5.4.0
      - name: Real source catalog count and Word/PDF native smoke
        run: python -m tools.other_draft_actual_smoke_20261106
