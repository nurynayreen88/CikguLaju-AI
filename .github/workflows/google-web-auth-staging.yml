name: Google Web Auth staging-only unit tests

on:
  pull_request:
    paths:
      - 'web_google_identity_sessions.py'
      - 'web/google_auth_staging_routes.py'
      - 'web/google_account_store.py'
      - 'web/provider_neutral_payment.py'
      - 'tests/test_web_provider_neutral_payment.py'
      - 'tests/test_web_google_auth_staging.py'
      - 'tools/run_web_v1_preview.py'
      - '.github/workflows/google-web-auth-staging.yml'
  push:
    branches:
      - 'feature/web-google-auth-staging-445'

jobs:
  test-google-oauth-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependency
        run: python -m pip install 'Flask==3.1.3'
      - name: Compile changed Python sources
        run: python -m py_compile web_google_identity_sessions.py web/google_auth_staging_routes.py web/google_account_store.py tests/test_web_google_auth_staging.py web/provider_neutral_payment.py tests/test_web_provider_neutral_payment.py
      - name: Run Google staging authentication tests
        run: |
          python -m unittest discover -s tests -p 'test_web_google_auth_staging.py' -v
          python -m unittest discover -s tests -p 'test_web_provider_neutral_payment.py' -v
