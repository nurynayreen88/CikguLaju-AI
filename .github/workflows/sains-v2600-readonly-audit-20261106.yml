name: Sains v26.00 read-only source inventory

on:
  pull_request:
    paths:
      - "tools/audit_sains_v26_readonly_20261106.py"
      - "tools/audit_sains_all_runtime_sources_20261106.py"
      - "tools/audit_sains_v2582_unit_grouping_20261106.py"
      - "web/sains_canonical_unit_preview_20261106.py"
      - "web/sains_y3_rph_activity_preview_20261106.py"
      - "tests/test_sains_y3_45_activity_preview_20261106.py"
      - "tests/test_sains_canonical_unit_preview_20261106.py"
      - "tools/audit_sains_local_rph_ast_20261106.py"
      - "tools/audit_sains_rph_generator_20261106.py"
      - "tools/audit_sains_25_82_delta_20261106.py"
      - "tools/audit_sains_v2582_y3_actual_20261106.py"
      - "tools/simulate_sains_v2582_12_title_fix_20261106.py"
      - "audits/sains_y3_v2582_12_dskp_title_corrections_20261106.json"
      - "audits/sains_y3_v2582_45_textbook_page_candidates_20261106.json"
      - "tests/test_sains_y3_v2582_source_pages_20261106.py"
      - "tools/audit_sains_native_reader_ast_20261106.py"
      - "tools/simulate_sains_y3_5_title_repair_20261106.py"
      - "tests/test_sains_v26_source_inventory_20261106.py"
      - "tests/test_sains_y3_23_source_ledger_20261106.py"
      - "tests/test_sains_y3_dskp_crosswalk_20261106.py"
      - "audits/sains_y3_dskp_sp_crosswalk_20261106.json"
      - "rpt_2027/sains/tahun3_unit_order_source_candidate_20261106.json"
      - "tests/test_sains_y3_rpt_unit_index_20261106.py"
      - "audits/sains_y3_23_source_candidate_ledger_20261106.json"
      - ".github/workflows/sains-v2600-readonly-audit-20261106.yml"
      - "v26_00_manifest.json"
      - "v26_00_part*.bin"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-not-final-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test no-write source contract
        run: |
          python -m py_compile tools/audit_sains_v26_readonly_20261106.py
          python -m unittest discover -s tests -p 'test_sains_v26_source_inventory_20261106.py' -v
          python -m unittest discover -s tests -p 'test_sains_y3_23_source_ledger_20261106.py' -v
          python -m unittest discover -s tests -p 'test_sains_y3_dskp_crosswalk_20261106.py' -v
          python -m unittest discover -s tests -p 'test_sains_y3_rpt_unit_index_20261106.py' -v
          python -m unittest discover -s tests -p 'test_sains_y3_v2582_source_pages_20261106.py' -v
          python -m unittest discover -s tests -p 'test_sains_canonical_unit_preview_20261106.py' -v
          python -m unittest discover -s tests -p 'test_sains_y3_45_activity_preview_20261106.py' -v
      - name: Inventory actual Sains grouped PdP from hashed master
        run: python tools/audit_sains_v26_readonly_20261106.py
      - name: Simulate 5 title replacements on temporary historical DB and rollback
        run: python tools/simulate_sains_y3_5_title_repair_20261106.py
      - name: Verify twelve source-based title repair candidates on v25.82 then rollback
        run: python tools/simulate_sains_v2582_12_title_fix_20261106.py
      - name: Verify actual v25.82 Year3 identities before title repair
        run: python tools/audit_sains_v2582_y3_actual_20261106.py
      - name: Compare science v25.68 versus v25.82 record-level delta
        run: python tools/audit_sains_25_82_delta_20261106.py
      - name: Audit duplicate Sains units and numbered PdP on latest 385 records
        run: python tools/audit_sains_v2582_unit_grouping_20261106.py
      - name: Inspect each Telegram RPH text generator source branch
        run: python tools/audit_sains_rph_generator_20261106.py
      - name: Audit actual Telegram RPH text and Word/PDF definitions
        run: python tools/audit_sains_local_rph_ast_20261106.py
      - name: Compare all shipped science DB checkpoints without writes
        run: python tools/audit_sains_all_runtime_sources_20261106.py
      - name: Inspect Telegram native reader without importing bot
        run: python tools/audit_sains_native_reader_ast_20261106.py
