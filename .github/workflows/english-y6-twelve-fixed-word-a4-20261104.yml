name: English Year6 twelve corrected fixed-SOW Word A4 QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/verify_english_y4_y6_a4_20261104.py'
      - '.github/workflows/english-y6-twelve-fixed-word-a4-20261104.yml'
      - 'rph_standalone/english/year6/**'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-twelve-word:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Word parsing and LibreOffice QA dependency
        run: |
          python -m pip install python-docx==1.1.2 pypdf==5.1.0
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer >/dev/null
          fi
      - name: Audit only latest twelve Year6 SOW-corrected Word documents
        run: python tools/verify_english_y4_y6_a4_20261104.py --year 6 --lessons 1,2,3,4,6,7,8,9,11,12,13,14
      - name: Verify source Word text preservation and 12 one-page A4 files
        run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("output/english_y4_y6_word_a4_20261104/year6/report.json").read_text())
          expected={1,2,3,4,6,7,8,9,11,12,13,14}
          assert r['lesson_total']==12,r
          assert {x['lesson'] for x in r['lessons']}==expected
          assert r['compact_one_page_a4']==12,r
          for x in r['lessons']:
              assert x['compact']['pages']==1 and x['compact']['a4'],x
              assert x['raw']['source_text']==x['compact']['source_text'],x
          print("Year6 corrected fixed-SOW Word: 12/12 one-page A4, all document text preserved")
          PY
      - name: Archive only test-generated Word QA measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-y6-twelve-fixed-sow-word-a4-report
          path: output/english_y4_y6_word_a4_20261104/year6/report.json
          retention-days: 14
