name: KP2027 Alam Tahun 1 private RPH download - login quota QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'web/kp2027_alam_canary_web.py'
      - 'web/kp2027_alam_v10_catalog.json'
      - 'tests/test_kp2027_alam_canary_web.py'
      - 'tools/run_web_production.py'
      - '.github/workflows/kp2027-alam-private-pilot-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alam-auth-quota:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flask test framework only, no production secrets
        run: python -m pip install 'Flask>=3.1,<4'
      - name: Compile isolated Alam route and production launcher
        run: python -m py_compile web/kp2027_alam_canary_web.py tests/test_kp2027_alam_canary_web.py tools/run_web_production.py
      - name: Verify exact catalog and no private blobs in Git
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          code=Path('web/kp2027_alam_canary_web.py').read_text()
          source=json.loads(Path('web/kp2027_alam_v10_catalog.json').read_text())
          assert source['source_archive_sha256']=='b1ae8dcab0894bacc894d7fb310ff5ece27a1077e84846a64a86a61235d3a8ef'
          assert len(source['A'])==len(source['B'])==64
          assert sum(len(x['codes'])==2 for x in source['A'].values())==19
          assert source['A']['3']['codes']==['1.1.3','1.1.4']
          assert all(source['A'][str(i)]['word']==source['B'][str(i)]['word'] for i in range(1,65))
          assert 'CIKGULAJU_KP2027_ALAM_CANARY_ENABLED' in code
          assert 'CANARY_APPROVED' in code and 'Origin' in code
          assert 'authorize_rendered_document(' in code
          assert 'content_base64=' not in code
          assert '/api/kp2027/sk/tahun-1/alam-dan-manusia/available' in code
          assert 'eq.ALAM' in code
          print('ALAM_CANARY_SOURCE_AND_SECURITY_GUARD_PASS')
          PY
      - name: Check login, origin, download integrity and shared quota mocks
        run: python -m unittest discover -s tests -p 'test_kp2027_alam_canary_web.py' -v
