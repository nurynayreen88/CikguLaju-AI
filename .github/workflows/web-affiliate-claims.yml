name: Web affiliate claim and admin access
on:
  pull_request:
    paths:
      - 'web/web_referral_routes.py'
      - 'web_v1_static_preview/web-referral.js'
      - 'tests/test_web_referral_bridge.py'
      - '.github/workflows/web-affiliate-claims.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'flask==3.1.3'
      - run: python -m unittest discover -s tests -p 'test_web_referral_bridge.py' -v
      - run: node --check web_v1_static_preview/web-referral.js
