name: English Year 6 2027 RPH inventory audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'rph_standalone/english/year6/**'
      - 'audits/audit_160_rph.csv'
      - 'tests/test_english_y6_rph_2027_files.py'
      - 'tests/test_english_y6_selected_155_158_skill_phases_20261104.py'
      - 'tests/test_english_y6_choice_review_96_112_128_144_20261104.py'
      - 'tests/test_english_y6_choice_projects_80_160_20261104.py'
      - 'tests/test_english_y6_six_fixed_sow_task_refinements_20261104.py'
      - 'tests/test_english_y6_six_more_fixed_sow_task_refinements_20261104.py'
      - 'tests/test_english_y6_life_past_source_017_024_20261104.py'
      - 'tests/test_english_y6_sow_027_034_source_fidelity_20261104.py'
      - 'tests/test_english_y6_adventure_cooljobs_035_050_20261104.py'
      - 'tests/test_english_y6_source_22_largebatch_051_078_20261104.py'
      - '.github/workflows/english-y6-rph-2027-checks.yml'
  push:
    branches:
      - feat/english-year6-160-rph-rpt2027-20261103
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_english_y6_rph_2027_files.py' -v
      - run: python -m unittest discover -s tests -p 'test_english_y6_selected_155_158_skill_phases_20261104.py' -v
      - run: python -m unittest discover -s tests -p 'test_english_y6_choice_review_96_112_128_144_20261104.py' -v
      - run: python -m unittest discover -s tests -p 'test_english_y6_choice_projects_80_160_20261104.py' -v
      - run: python -m unittest discover -s tests -p 'test_english_y6_six_fixed_sow_task_refinements_20261104.py' -v
      - run: python -m unittest discover -s tests -p 'test_english_y6_six_more_fixed_sow_task_refinements_20261104.py' -v
      - run: python -m unittest discover -s tests -p 'test_english_y6_life_past_source_017_024_20261104.py' -v
      - run: python -m unittest discover -s tests -p 'test_english_y6_sow_027_034_source_fidelity_20261104.py' -v
      - run: python -m unittest discover -s tests -p 'test_english_y6_adventure_cooljobs_035_050_20261104.py' -v
      - run: python -m unittest discover -s tests -p 'test_english_y6_source_22_largebatch_051_078_20261104.py' -v

  native-rph-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install actual PDF layout audit requirements
        run: python -m pip install reportlab==4.2.5 pypdf==5.1.0
      - name: Render native ReportLab RPH PDF on 59 amended lessons
        run: python tools/verify_english_800_native_pdf_contract_20261104.py --year 6 --lessons 1,2,3,4,6,7,8,9,11,12,13,14,17,18,19,20,22,23,24,27,28,29,30,33,34,35,36,38,39,40,41,43,44,45,46,49,50,51,52,54,55,56,57,59,60,61,62,65,66,67,68,70,71,72,73,75,76,77,78
      - name: Require 59 one-page A4 PDF layouts
        run: |
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('output/english_2_6_native_pdf_smoke_20261104/year6/native_pdf_report.json')
          report=json.loads(path.read_text(encoding='utf-8'))
          rows=report['results']
          assert {r['lesson'] for r in rows}=={1,2,3,4,6,7,8,9,11,12,13,14,17,18,19,20,22,23,24,27,28,29,30,33,34,35,36,38,39,40,41,43,44,45,46,49,50,51,52,54,55,56,57,59,60,61,62,65,66,67,68,70,71,72,73,75,76,77,78}
          assert all(r.get('pages')==1 and r.get('a4') and not r.get('error') for r in rows),rows
          print('Fifty-nine Year6 KPM SOW refinements: 59/59 native PDF layouts are one page A4')
          PY
      - name: Archive PDF source scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-y6-six-fixed-sow-native-pdf
          path: output/english_2_6_native_pdf_smoke_20261104/year6/native_pdf_report.json
          retention-days: 14

  source-word-a4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: a
            lessons: "51,52,54,55,56,57,59,60,61,62,65"
            expected: 11
          - part: b
            lessons: "66,67,68,70,71,72,73,75,76,77,78"
            expected: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install isolated Word and LibreOffice quality audit requirements
        run: |
          python -m pip install python-docx==1.1.2 pypdf==5.1.0
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer >/dev/null
          fi
      - name: Render source-backed native Word only for this batch
        env:
          LESSONS: ${{ matrix.lessons }}
        run: python tools/verify_english_y4_y6_a4_20261104.py --year 6 --lessons "$LESSONS"
      - name: Check eleven exact Word files A4 and all original document text
        env:
          LESSONS: ${{ matrix.lessons }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path('output/english_y4_y6_word_a4_20261104/year6/report.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          selected={int(v) for v in os.environ['LESSONS'].split(',')}
          expected=int(os.environ['EXPECTED'])
          assert len(selected)==expected
          assert r['lesson_total']==expected,r
          assert {x['lesson'] for x in r['lessons']}==selected
          assert r['compact_one_page_a4']==expected,r
          for x in r['lessons']:
              assert x['raw']['source_text']==x['compact']['source_text'],x
              assert x['compact']['pages']==1 and x['compact']['a4'],x
          print('English Year6 large batch:',expected,'of',expected,'native Word files one-page A4, preserved text')
          PY
      - name: Archive test measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-y6-source-batch22-word-${{ matrix.part }}
          path: output/english_y4_y6_word_a4_20261104/year6/report.json
          retention-days: 14
