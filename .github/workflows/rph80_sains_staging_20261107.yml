            build/sains_y2_2_alternative_sp_pbd_DRAF_20261107/*.docx
            build/sains_y2_2_alternative_sp_pbd_DRAF_20261107/*.pdf
            build/sains_y2_2_alternative_sp_pbd_DRAF_20261107/*.csv
            build/sains_y2_2_alternative_sp_pbd_DRAF_20261107/*.json
            build/sains_y2_unit3_3_supplementary_sp_pbd_DRAF_20261107/*.docx
            build/sains_y2_unit3_3_supplementary_sp_pbd_DRAF_20261107/*.pdf
            build/sains_y2_unit3_3_supplementary_sp_pbd_DRAF_20261107/*.csv
            build/sains_y2_unit3_3_supplementary_sp_pbd_DRAF_20261107/*.json
            build/sains_y3_45_rph_REVIEW_ONLY_20261106/*.docx
            build/sains_y3_45_rph_REVIEW_ONLY_20261106/*.pdf
            build/sains_y3_45_rph_REVIEW_ONLY_20261106/*.csv
