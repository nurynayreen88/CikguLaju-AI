name: English Year5 160-Lesson original SOW printed page audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'rph_standalone/english/year5/**'
      - 'audits/english_y5_sow_160_original_printed_pages_20261105.json'
      - 'tools/audit_english_y5_sow_printed_page_citations_20261105.py'
      - '.github/workflows/english-y5-sow-printed-page-audit-20261105.yml'
permissions: {contents: read}
jobs:
  report-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Audit all Year5 Lesson SOW printed pages from original source
        run: python tools/audit_english_y5_sow_printed_page_citations_20261105.py
