name: Web private admin analytics and verified login event audit
on:
  push:
    branches:
      - fix/web-login-events-verified-20261110
  pull_request:
    branches:
      - production/cikgulaju-web-20261105
    paths:
      - web/web_login_analytics.py
      - web/admin_usage_web.py
      - web_v1_telegram_auth_routes.py
      - web_v1_static_preview/admin-usage.js
      - web_v1_static_preview/index.html
      - tools/run_web_production.py
      - tests/test_web_login_event_capture.py
      - tests/test_web_admin_usage.py
      - .github/workflows/web-login-event-audit-20261110.yml
jobs:
  private-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production-matching Flask for isolated route tests
        run: python -m pip install "Flask==3.1.3"
      - name: Verify trusted login ledger and admin authorization tests
        run: |
          python -m unittest discover -s tests -p 'test_web_login_event_capture.py' -v
          python -m unittest discover -s tests -p 'test_web_admin_usage.py' -v
      - name: Compile all touched Python modules
        run: |
          python -m py_compile web_v1_telegram_auth_routes.py web/web_login_analytics.py web/admin_usage_web.py tools/run_web_production.py
      - name: Check administrator browser JavaScript syntax
        run: node --check web_v1_static_preview/admin-usage.js
      - name: Check secure dashboard wiring and exact anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("web_v1_static_preview/index.html").read_text()
          entry = Path("tools/run_web_production.py").read_text()
          for text in ('id="web-admin-tab"', 'data-web-view="admin"',
                       'id="view-admin"', 'id="web-admin-status"',
                       'window.cikgulajuAdminInit?.();',
                       '/assets/admin-usage.js?v=20261111'):
              assert html.count(text) == 1, (text, html.count(text))
          assert 'app.register_blueprint(admin_usage_bp)' in entry
          assert '@app.get("/assets/admin-usage.js")' in entry
          assert 'id="web-admin-tab" class="sidebar-tab" data-web-view="admin" aria-controls="view-admin" hidden' in html
          PY
