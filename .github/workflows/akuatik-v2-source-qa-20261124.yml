name: Akuatik V2 Tahun 1-6 source QA
on:
  pull_request:
    paths:
      - 'rph_standalone/pjpk/akuatik_v2_darat_t1_t6_20261124.json'
      - 'tests/test_akuatik_v2_darat_20261124.py'
      - '.github/workflows/akuatik-v2-source-qa-20261124.yml'
      - 'web/akuatik_v2_rph.py'
      - 'web/native_rph_telegram_api.py'
      - 'web/rph_unified_engine.py'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-docx reportlab pymupdf flask
      - run: python -m unittest discover -s tests -p test_akuatik_v2_darat_20261124.py
