name: PSV 210 RPH publication candidate — source and A4 QA
on:
  push:
    branches:
      - staging/psv-y2-y6-publish-candidate-20261105
    paths:
      - 'rph_standalone/psv/**'
      - 'rpt_2027/psv/**'
      - 'tests/test_psv_*.py'
      - 'tools/verify_psv_word_a4.py'
      - 'web/psv_2027_rph_release_bridge.py'
      - 'tools/psv_candidate_staging_entrypoint.py'
      - '.github/workflows/psv-publication-candidate-qa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'rph_standalone/psv/**'
      - 'rpt_2027/psv/**'
      - 'tests/test_psv_*.py'
      - 'tools/verify_psv_word_a4.py'
      - 'web/psv_2027_rph_release_bridge.py'
      - 'tools/psv_candidate_staging_entrypoint.py'
      - '.github/workflows/psv-publication-candidate-qa.yml'
permissions:
  contents: read
concurrency:
  group: psv-publication-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Audit PSV staging 210 RPH without modifying main or databases
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline QA packages
        run: |
          python -m pip install --disable-pip-version-check python-docx==1.1.2 reportlab==4.2.5 pypdf==5.1.0
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer >/dev/null
          fi
      - name: Compile PSV QA code
        run: python -m py_compile rph_standalone/psv/preview_a4.py web/psv_2027_rph_release_bridge.py tools/psv_candidate_staging_entrypoint.py tools/verify_psv_word_a4.py tests/test_psv_rpt_rph_source_order.py tests/test_psv_preview_a4.py tests/test_psv_runtime_bridge_candidate.py tests/test_psv_84_individual_textbook_semantics_20261105.py
      - name: Source, DSKP semantic and 210 PDF preview checks
        run: python -m unittest -v tests.test_psv_rpt_rph_source_order tests.test_psv_preview_a4 tests.test_psv_runtime_bridge_candidate tests.test_psv_84_individual_textbook_semantics_20261105
      - name: Convert all 210 Word RPH with LibreOffice and count A4 pages
        run: python tools/verify_psv_word_a4.py --batch-size 25
      - name: Upload summary counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psv-clean-candidate-210-word-a4-qa
          path: output/psv_word_a4_20261105/report.json
          if-no-files-found: ignore
          retention-days: 7
