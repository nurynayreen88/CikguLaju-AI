name: KP2027 selector release checks
on:
  push:
    branches: [release/kp2027-selector-20261023]
  pull_request:
    branches: [main]
    paths:
      - 'curriculum_version_selector.py'
      - 'curriculum_version_telegram.py'
      - 'tests/test_curriculum_version_*.py'
      - 'app.py'
      - '.github/workflows/kp2027-selector-checks.yml'
permissions:
  contents: read
jobs:
  selector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile curriculum_version_selector.py curriculum_version_telegram.py app.py
      - run: python -m unittest tests.test_curriculum_version_selector tests.test_curriculum_version_telegram
