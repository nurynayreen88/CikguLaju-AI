name: Moral source-only 480 review snapshot
on:
  push:
    branches:
      - staging/moral-480-final-source-gate-20261105
    paths:
      - '.github/workflows/moral-480-source-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package only curriculum and teaching-source files (no user database or secrets)
        run: |
          tar -czf "$RUNNER_TEMP/moral-480-source-review.tar.gz" \
            rph_standalone/pendidikan_moral \
            materials/pendidikan_moral \
            rpt_2027/pendidikan_moral \
            audits/pendidikan_moral* \
            web/pendidikan_moral_80_runtime.py \
            scripts/audit_moral_480_individual_evidence.py \
            scripts/check_moral_official_dskp_350sp.py \
            scripts/check_moral_y6_kssr2017_edition_20261105.py
          tar -tzf "$RUNNER_TEMP/moral-480-source-review.tar.gz" | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: moral-source-only-480-review
          path: ${{ runner.temp }}/moral-480-source-review.tar.gz
          if-no-files-found: error
          retention-days: 7
