name: DLP session-first calendar and source coverage QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/build_dlp_session_first_candidate_20261126.py'
      - 'tools/map_dlp_session_activities_20261126.py'
      - '.github/workflows/dlp-session-first-candidate-20261126.yml'
permissions:
  contents: read
jobs:
  session-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3' 'requests>=2'
      - run: python -m tools.build_dlp_session_first_candidate_20261126
      - uses: actions/checkout@v4
        with:
          ref: '4570559b46325b765402f1883345d53b68c71710'
          path: rph-source
          persist-credentials: false
      - name: Map exact source activities for every planned session
        run: |
          cp tools/map_dlp_session_activities_20261126.py rph-source/tools/
          cd rph-source
          python -m tools.map_dlp_session_activities_20261126 ../dlp_session_first_candidate.json ../dlp_session_activity_review.json
      - uses: actions/upload-artifact@v4
        with:
          name: dlp-session-first-private-candidate
          path: |
            dlp_session_first_candidate.json
            dlp_session_activity_review.json
