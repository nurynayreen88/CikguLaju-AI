name: RPT2027 Arabic Year2 19 sourced SP - production PDF branch QA
on:
  pull_request:
    branches:
      - production/cikgulaju-web-20261105
    paths:
      - '.github/workflows/rpt2027-arabic-y2-19-sp-pdf-web-release-20261110.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  isolated-pdf-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Web release branch
        uses: actions/checkout@v4
        with:
          ref: release/rpt2027-arabic-y2-19-sp-source-pdf-20261110
          path: web_release
          persist-credentials: true
      - name: Checkout exact tested Arabic source revision
        uses: actions/checkout@v4
        with:
          ref: bf85649e6a1f6533b78697dda8006ebe0d4966d2
          path: rpt_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact PDF authoring toolchain and Amiri
        run: |
          python -m pip install 'PyMuPDF==1.24.14' 'reportlab==4.2.5' 'pypdf==5.1.0' 'beautifulsoup4==4.12.3' 'arabic-reshaper==3.0.0' 'python-bidi==0.6.3'
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-hosny-amiri
      - name: Validate Arabic source statements, no false curriculum release
        run: |
          cd rpt_source
          python -m unittest tests.test_bahasa_arab_rpt2027_source_page_audit tests.test_rpt2027_owner_week1_distribution_20261110 -v
      - name: Build 20 PDFs and select Year2 Arabic, 60 sourced PdP
        run: |
          cd rpt_source
          python - <<'PY'
          import fitz,hashlib,json,re
          from pathlib import Path
          from scripts.build_rpt_2027_remaining_four_subjects_staging import build_all,arabic_records,week1_proposed_records
          src=arabic_records(6)
          assert len(src)==60 and len({row['sp'] for row in src})==19
          assert all(row['source_sp_dskp_text_signoff'] is False for row in src)
          assert all('القدرة' in row['sp_display'] for row in src)
          assert all('Pernyataan penuh' not in row['sp_display'] for row in src)
          rows=week1_proposed_records('bahasa_arab',6,arabic_records)
          assert rows[0]['week']=='M01'
          docs=build_all(Path('../arabic_candidate/all_20'))
          choices=[Path(path) for subject,year,count,path in docs
                   if subject=='bahasa_arab' and year==6 and count==60]
          if len(choices)!=1:raise SystemExit('Arabic Year2 PDF absent')
          candidate=choices[0].resolve()
          with fitz.open(candidate) as doc:
              if len(doc)<5 or any(p.rect.width<=p.rect.height for p in doc):
                  raise SystemExit('Not landscape 5-column PDF')
              cover=doc[0].get_text()
              if 'NAMA GURU' not in cover or 'NAMA SEKOLAH' not in cover:
                  raise SystemExit('Missing personalized cover slots')
              table='\n'.join(p.get_text() for p in list(doc)[1:])
              if 'M01' not in table or 'PdP 001' not in table:
                  raise SystemExit('M01/first lesson missing from rendered PDF')
              if 'Pernyataan penuh' in table or 'BELUM DIPADANKAN' in table:
                  raise SystemExit('Source placeholder leaked into teacher PDF')
              arabic_chars=len(re.findall(r'[\u0600-\u08FF\uFB50-\uFEFF]',table))
              if arabic_chars<100:
                  raise SystemExit('Arabic SP wording absent or font broken')
              pages=len(doc)
          raw=candidate.read_bytes()
          info={'pdf':str(candidate),'sha256':hashlib.sha256(raw).hexdigest(),
                'bytes':len(raw),'pages':pages,'year':6,'pdp':60,'sp_codes':19,
                'academic_final_approved':False}
          meta=Path('../arabic_candidate/arabic_y2_source_review.json')
          meta.parent.mkdir(parents=True,exist_ok=True)
          meta.write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n','utf-8')
          print('ARABIC_YEAR6_60_PDP_19_SP_PDF_OK',json.dumps(info,ensure_ascii=False),flush=True)
          PY
      - name: Replace just Arabic Year2 PDF + SHA manifest on isolated branch
        run: |
          python - <<'PY'
          import fitz,hashlib,json,shutil
          from pathlib import Path
          root=Path('web_release/rpt_2027/web_2027_pdfs')
          mf=root/'manifest.json'
          old=json.loads(mf.read_text('utf-8'))
          x=json.loads(Path('arabic_candidate/arabic_y2_source_review.json').read_text('utf-8'))
          if old.get('count')!=56 or old.get('academic_final_approved') is not False or x['academic_final_approved'] is not False:
              raise SystemExit('Incorrect release status/manifest count')
          old_copy={k:dict(v) for k,v in old['files'].items()}
          key='bahasa_arab:6'
          entry=old['files'][key]
          original=(root/entry['path']).read_bytes()
          if hashlib.sha256(original).hexdigest()!=entry['sha256'] or len(original)!=entry['bytes']:
              raise SystemExit('Existing Arabic Year2 PDF checksum drift')
          src=Path(x['pdf'])
          new=src.read_bytes()
          if hashlib.sha256(new).hexdigest()!=x['sha256']:
              raise SystemExit('New source PDF checksum drift')
          shutil.copyfile(src,root/entry['path'])
          for f in ('sha256','bytes','pages'):entry[f]=x[f]
          for k,value in old['files'].items():
              data=(root/value['path']).read_bytes()
              if hashlib.sha256(data).hexdigest()!=value['sha256'] or len(data)!=value['bytes']:
                  raise SystemExit('Unexpected PDF SHA mismatch '+k)
              with fitz.open(root/value['path']) as d:
                  if len(d)!=value['pages']:raise SystemExit('Page count mismatch '+k)
              if k!=key and value!=old_copy[k]:
                  raise SystemExit('Changed other 55 subjects')
          if sum(old['files'][k]!=old_copy[k] for k in old_copy)!=1 or old['files'][key]['status']!=old_copy[key]['status']:
              raise SystemExit('Unexpected changed metadata or academic release status')
          old['source_projection']='RPT2027_ARABIC_YEAR6_25_ORIGINAL_DSKP_SP_ADDED_ACADEMIC_HOLD'
          old['pages']=sum(x['pages'] for x in old['files'].values())
          old['academic_final_approved']=False
          mf.write_text(json.dumps(old,ensure_ascii=False,indent=2)+'\n','utf-8')
          print('ARABIC_Y2_WEB_CANDIDATE_OK 1 replaced 55 unchanged academic_approved_false')
          PY
      - name: Commit exactly one improved Arabic RPT and manifest
        run: |
          cd web_release
          git config user.name 'cikgulaju-rpt-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rpt_2027/web_2027_pdfs
          git diff --cached --name-only > ../arabic_web_diff.txt
          python - <<'PY'
          from pathlib import Path
          changed=set(Path('../arabic_web_diff.txt').read_text().splitlines())
          expected={'rpt_2027/web_2027_pdfs/bahasa_arab/tahun_6.pdf','rpt_2027/web_2027_pdfs/manifest.json'}
          if changed!=expected:raise SystemExit('Unexpected Arabic Web diff '+repr(changed))
          print('ARABIC_WEB_TWO_FILES_ONLY')
          PY
          git commit -m 'rpt2027(web): use original 19 Arabic SP statements for Year2, preserve academic hold'
          git push origin HEAD:refs/heads/release/rpt2027-arabic-y2-19-sp-source-pdf-20261110
      - name: Reviewer PDF and release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpt2027-arabic-year2-60-pdp-25-source-sp-review
          path: |
            arabic_candidate/arabic_y2_source_review.json
            arabic_web_diff.txt
            arabic_candidate/all_20/**/*BAHASA_ARAB*Tahun*6*.pdf
          retention-days: 30
          if-no-files-found: warn
