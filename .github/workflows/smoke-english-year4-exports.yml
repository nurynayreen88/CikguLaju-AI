name: Smoke English Year 4 draft exports

on:
  push:
    branches:
      - staging/english-year4-standalone-20261030
    paths:
      - 'rph_standalone/english/year4/**'
      - 'scripts/smoke_english_year4_exports.py'
      - '.github/workflows/smoke-english-year4-exports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated document dependencies
        run: python -m pip install python-docx reportlab
      - name: Test sample lesson exports
        run: |
          python scripts/smoke_english_year4_exports.py --lesson 1 --output-dir /tmp/year4-smoke
          python scripts/smoke_english_year4_exports.py --lesson 80 --output-dir /tmp/year4-smoke
          python scripts/smoke_english_year4_exports.py --lesson 160 --output-dir /tmp/year4-smoke
      - name: Check outputs can be reopened
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from reportlab.pdfbase.pdfdoc import PDFCatalog
          import zipfile
          for n in (1, 80, 160):
              docx = Path(f'/tmp/year4-smoke/year4_lesson_{n:03d}_SMOKE.docx')
              pdf = Path(f'/tmp/year4-smoke/year4_lesson_{n:03d}_SMOKE.pdf')
              assert zipfile.is_zipfile(docx), docx
              assert Document(docx).paragraphs, docx
              assert pdf.read_bytes().startswith(b'%PDF-'), pdf
          print('PASS: 3 DOCX and 3 PDF sample files structurally readable')
          PY
