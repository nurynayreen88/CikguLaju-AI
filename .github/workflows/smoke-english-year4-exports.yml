name: Smoke English Year 4 draft exports

on:
  push:
    branches:
      - staging/english-year4-standalone-20261030
    paths:
      - 'rph_standalone/english/year4/**'
      - 'scripts/smoke_english_year4_exports.py'
      - 'scripts/batch_smoke_english_year4_exports.py'
      - 'scripts/test_english_year4_classroom_export.py'
      - 'scripts/report_english_year4_pdf_pages.py'
      - '.github/workflows/smoke-english-year4-exports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated document dependencies
        run: python -m pip install python-docx reportlab pypdf
      - name: Test sample lesson exports
        run: |
          python scripts/smoke_english_year4_exports.py --lesson 1 --output-dir /tmp/year4-smoke
          python scripts/smoke_english_year4_exports.py --lesson 80 --output-dir /tmp/year4-smoke
          python scripts/smoke_english_year4_exports.py --lesson 160 --output-dir /tmp/year4-smoke
      - name: Validate 160 classroom export filters
        run: python scripts/test_english_year4_classroom_export.py
      - name: Batch smoke all lessons
        run: python scripts/batch_smoke_english_year4_exports.py --output-dir /tmp/year4-all
      - name: Report PDF page counts for all lessons
        run: python scripts/report_english_year4_pdf_pages.py --input-dir /tmp/year4-all --report /tmp/year4-page-report.csv
      - name: Check outputs can be reopened
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from pypdf import PdfReader
          import zipfile
          for n in (1, 80, 160):
              docx = Path(f'/tmp/year4-smoke/year4_lesson_{n:03d}_SMOKE.docx')
              pdf = Path(f'/tmp/year4-smoke/year4_lesson_{n:03d}_SMOKE.pdf')
              assert zipfile.is_zipfile(docx), docx
              assert Document(docx).paragraphs, docx
              assert pdf.read_bytes().startswith(b'%PDF-'), pdf
              pages = PdfReader(str(pdf)).pages
              assert len(pages) > 0, pdf
              pdf_text = '\\n'.join(page.extract_text() or '' for page in pages)
              assert 'English Year 4' in pdf_text, pdf
              print(f'Lesson {n:03d}: {len(pages)} PDF pages; one-page layout not yet verified')
          for n in range(1, 161):
              docx = Path(f'/tmp/year4-all/year4_{n:03d}_SMOKE.docx')
              pdf = Path(f'/tmp/year4-all/year4_{n:03d}_SMOKE.pdf')
              assert zipfile.is_zipfile(docx), docx
              assert len(PdfReader(str(pdf)).pages) > 0, pdf
          print('PASS: 160 draft DOCX and 160 draft PDF files structurally readable')
          PY

      - name: Upload pagination audit and representative previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: year4-draft-layout-audit
          path: |
            /tmp/year4-page-report.csv
            /tmp/year4-smoke/*.pdf
            /tmp/year4-smoke/*.docx
          if-no-files-found: warn
          retention-days: 7

      - name: Upload all 160 Word and PDF draft previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: year4-all-160-draft-docx-pdf
          path: /tmp/year4-all/
          if-no-files-found: warn
          retention-days: 7
