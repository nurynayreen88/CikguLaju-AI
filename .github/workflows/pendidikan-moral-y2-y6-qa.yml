name: Pendidikan Moral Tahun 2-6 draft QA
on:
  push:
    branches:
      - staging/pendidikan-moral-y2-y6-20261104
      - staging/moral-96h-coverage-plan-20261104
      - staging/moral-unit4-book-12-20261104
    paths:
      - 'rph_standalone/pendidikan_moral/**'
      - 'materials/pendidikan_moral/**'
      - 'rpt_2027/pendidikan_moral/**'
      - 'scripts/check_pendidikan_moral_y2_y6.py'
      - 'scripts/check_moral_verified_activity_batch.py'
      - 'scripts/check_moral_unit4_12_visual.py'
      - 'scripts/check_moral_visual21_20261105.py'
      - 'scripts/check_moral_visual27_y2_20261105.py'
      - 'scripts/check_moral_visual27_y3_20261105.py'
      - 'scripts/check_moral_visual30_y4_20261105.py'
      - 'scripts/check_moral_visual30_y5_20261105.py'
      - 'audits/pendidikan_moral_visual30_y5_u05_u14_20261105.json'
      - 'audits/pendidikan_moral_visual30_y4_u05_u14_20261105.json'
      - 'audits/pendidikan_moral_visual27_y3_u06_u14_20261105.json'
      - 'audits/pendidikan_moral_visual27_y2_u06_u14_20261105.json'
      - 'audits/pendidikan_moral_visual21_unit1_unit5_20261105.json'
      - 'scripts/check_moral_96h_planning.py'
      - 'scripts/check_moral_official_dskp_350sp.py'
      - 'scripts/audit_moral_480_individual_evidence.py'
      - 'scripts/check_moral_210_source_and_270_supplement.py'
      - 'scripts/build_moral_word_a4_review_artifact.py'
      - 'scripts/check_moral_y6_visual24_20261105.py'
      - 'audits/pendidikan_moral_y6_visual24_units05_13_20261105.json'
      - 'audits/pendidikan_moral_official_dskp_350sp_fingerprints_20261105.json'
      - 'scripts/check_moral_96_downloads.py'
      - 'scripts/check_pm_v2600_stage_parity.py'
      - 'scripts/check_pendidikan_moral_release_readiness.py'
      - 'scripts/check_pm_80_beta.py'
      - 'web/pendidikan_moral_80_runtime.py'
      - 'rpt_2027/english/telegram_downloads.py'
      - 'rpt_2027/pendidikan_moral/complete_96_downloads.py'
      - 'tools/run_telegram_with_curriculum_api.py'
      - 'scripts/preview_pm_y2_sp44_v2600_safe_patch.py'
      - '.github/workflows/pendidikan-moral-y2-y6-qa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'rph_standalone/pendidikan_moral/**'
      - 'materials/pendidikan_moral/**'
      - 'rpt_2027/pendidikan_moral/**'
      - 'scripts/check_pendidikan_moral_y2_y6.py'
      - 'scripts/check_moral_verified_activity_batch.py'
      - 'scripts/check_moral_unit4_12_visual.py'
      - 'scripts/check_moral_visual21_20261105.py'
      - 'scripts/check_moral_visual27_y2_20261105.py'
      - 'scripts/check_moral_visual27_y3_20261105.py'
      - 'scripts/check_moral_visual30_y4_20261105.py'
      - 'scripts/check_moral_visual30_y5_20261105.py'
      - 'audits/pendidikan_moral_visual30_y5_u05_u14_20261105.json'
      - 'audits/pendidikan_moral_visual30_y4_u05_u14_20261105.json'
      - 'audits/pendidikan_moral_visual27_y3_u06_u14_20261105.json'
      - 'audits/pendidikan_moral_visual27_y2_u06_u14_20261105.json'
      - 'audits/pendidikan_moral_visual21_unit1_unit5_20261105.json'
      - 'scripts/check_moral_96h_planning.py'
      - 'scripts/check_moral_official_dskp_350sp.py'
      - 'scripts/audit_moral_480_individual_evidence.py'
      - 'scripts/check_moral_210_source_and_270_supplement.py'
      - 'scripts/build_moral_word_a4_review_artifact.py'
      - 'scripts/check_moral_y6_visual24_20261105.py'
      - 'audits/pendidikan_moral_y6_visual24_units05_13_20261105.json'
      - 'audits/pendidikan_moral_official_dskp_350sp_fingerprints_20261105.json'
      - 'scripts/check_moral_96_downloads.py'
      - 'scripts/check_pm_v2600_stage_parity.py'
      - 'scripts/check_pendidikan_moral_release_readiness.py'
      - 'scripts/preview_pm_y2_sp44_v2600_safe_patch.py'
      - '.github/workflows/pendidikan-moral-y2-y6-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pendidikan-moral-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Read-only curriculum link and PBD verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile validator
        run: python -m py_compile scripts/check_pendidikan_moral_y2_y6.py
      - name: Validate all RPH/BBM/RPT drafts without modifying database
        run: python scripts/check_pendidikan_moral_y2_y6.py
      - name: Compile v26.00 curriculum parity validator
        run: python -m py_compile scripts/check_pm_v2600_stage_parity.py
      - name: Preview verified DB SP 4.4 correction in disposable copy only
        run: python scripts/preview_pm_y2_sp44_v2600_safe_patch.py
      - name: Cross-check all staged Moral SP against current v26.00 master without DB changes
        run: python scripts/check_pm_v2600_stage_parity.py
      - name: Install provisional PDF QA dependencies
        run: python -m pip install reportlab==4.2.5 pypdf==5.1.0 python-docx==1.1.2
      - name: Compile provisional Moral runtime, PDF delivery and beta tests
        run: python -m py_compile web/pendidikan_moral_80_runtime.py rpt_2027/pendidikan_moral/telegram_downloads.py scripts/check_pm_80_beta.py
      - name: Validate 80 percent beta - 210 native RPH plus five paid RPT PDFs
        run: python scripts/check_pm_80_beta.py
      - name: Verify 33 visual-book-source Moral RPH against DSKP and page ledger
        run: python scripts/check_moral_verified_activity_batch.py
      - name: Verify 12 book-aligned Unit4 Moral RPH and Year6 source hold
        run: python scripts/check_moral_unit4_12_visual.py
      - name: Verify 21 newly sighted source-book Moral RPH and SP-matched tasks
        run: python scripts/check_moral_visual21_20261105.py
      - name: Verify all 27 Year2 Unit6-14 RPH textbook activity pages and teacher-pupil tasks
        run: python scripts/check_moral_visual27_y2_20261105.py
      - name: Verify 27 Year3 source-book matched Moral RPH against real scanned activity pages
        run: python scripts/check_moral_visual27_y3_20261105.py
      - name: Verify 30 Moral Year4 book-linked RPH against original scanned activities
        run: python scripts/check_moral_visual30_y4_20261105.py
      - name: Check 30 Year5 RPH against original scanned book activities and DSKP SP
        run: python scripts/check_moral_visual30_y5_20261105.py
      - name: Validate 24 Year6 RPH individually against scanned book tasks and DSKP SP
        run: python scripts/check_moral_y6_visual24_20261105.py
      - name: Verify 350 SP against five original KPM DSKP PDFs and 70 book-opening headings
        run: python scripts/check_moral_official_dskp_350sp.py
      - name: Verify 96-hour planning slots without treating extra sessions as READY
        run: python scripts/check_moral_96h_planning.py
      - name: Compile complete Moral 96-session RPT and 54-RPH PDF/Word download modules
        run: python -m py_compile rpt_2027/pendidikan_moral/complete_96_downloads.py scripts/check_moral_96_downloads.py
      - name: Verify 10 RPT PDFs, 270 supplementary RPH pages, editable Word and paid Telegram callbacks
        run: python scripts/check_moral_96_downloads.py
      - name: Audit each of 480 Moral sessions and produce traceable evidence report
        run: python scripts/audit_moral_480_individual_evidence.py --output "$RUNNER_TEMP/moral_480_individual_evidence.csv"
      - name: Archive all 480 individual session decisions
        uses: actions/upload-artifact@v4
        with:
          name: moral-480-individual-evidence
          path: ${{ runner.temp }}/moral_480_individual_evidence.csv
          if-no-files-found: error
      - name: Verify academic source classification for 204 book RPH, 6 DSKP only, 270 supplemental
        run: python scripts/check_moral_210_source_and_270_supplement.py
      - name: Export 270 supplementary Word RPH for independent A4 pagination audit
        run: python scripts/build_moral_word_a4_review_artifact.py --outdir "$RUNNER_TEMP/moral-word-review"
      - name: Archive five 54-RPH Word packs for A4 physical page audit
        uses: actions/upload-artifact@v4
        with:
          name: moral-270-word-a4-review
          path: ${{ runner.temp }}/moral-word-review/*.docx
          if-no-files-found: error
      - name: Full-release gate - informational only for explicitly provisional beta
        if: always()
        continue-on-error: true
        run: python scripts/check_pendidikan_moral_release_readiness.py
