name: Web-Telegram Same RPH Source QA
on:
  push:
    branches: [feature/web-rph-telegram-source-parity-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flask==3.1.3 python-docx==1.2.0 Pillow==11.3.0
      - name: Web RPH identity and actual Telegram renderer regressions
        run: |
          python -m py_compile web/rph_shared_source_identity.py web/unified_rph_web.py web/native_telegram_rph_client.py
          python -m unittest discover -s tests -p test_web_native_telegram_rph_download.py -v
          python -m unittest discover -s tests -p test_web_rph_availability.py -v
          python -m unittest discover -s tests -p test_web_unified_rph_preview.py -v
          python -m unittest discover -s tests -p test_web_sidebar_navigation.py -v
          python -m unittest discover -s tests -p test_web_production_inventory.py -v
