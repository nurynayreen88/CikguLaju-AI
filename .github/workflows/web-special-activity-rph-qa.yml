name: Web 59 RPH Aktiviti Khas source and trial QA
on:
  pull_request:
    paths:
      - 'web/special_activities_web.py'
      - 'web_v1_static_preview/special-activities.js'
      - 'web_v1_static_preview/index.html'
      - 'tools/run_web_production.py'
      - 'tests/test_web_special_activities_20261106.py'
      - '.github/workflows/web-special-activity-rph-qa.yml'
  push:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'web/special_activities_web.py'
      - 'web_v1_static_preview/special-activities.js'
      - 'web_v1_static_preview/index.html'
      - 'tools/run_web_production.py'
      - 'tests/test_web_special_activities_20261106.py'
      - '.github/workflows/web-special-activity-rph-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install flask==3.1.3 python-docx==1.2.0 reportlab==4.2.5 pypdf==5.1.0
      - run: python -m py_compile web/special_activities_web.py tests/test_web_special_activities_20261106.py tools/run_web_production.py
      - run: python -m unittest tests.test_web_special_activities_20261106 tests.test_web_sidebar_navigation tests.test_web_teacher_profile_timetable -v
      - run: node --check web_v1_static_preview/special-activities.js
      - name: Validate existing inline dashboard JS without altering live menus
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("web_v1_static_preview/index.html").read_text("utf-8")
          prefix='<script>\n"use strict";'
          assert src.count(prefix)==1
          Path("/tmp/cikgulaju-web-inline.js").write_text('"use strict";'+src.split(prefix,1)[1].split("</script>",1)[0])
          PY
          node --check /tmp/cikgulaju-web-inline.js
