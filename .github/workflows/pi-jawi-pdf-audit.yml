name: PI Jawi PDF structural audit

on:
  pull_request:
    paths:
      - 'tools/audit_pi_jawi_pdf.py'
      - 'tests/test_audit_pi_jawi_pdf.py'
      - '.github/workflows/pi-jawi-pdf-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-audit-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated audit dependency
        run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Compile audit and regression tests
        run: python -m py_compile tools/audit_pi_jawi_pdf.py tests/test_audit_pi_jawi_pdf.py
      - name: Run PDF structure regression
        run: python -m unittest discover -s tests -p 'test_audit_pi_jawi_pdf.py' -v
