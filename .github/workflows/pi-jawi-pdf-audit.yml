name: PI Jawi PDF structural audit

on:
  pull_request:
    paths:
      - 'app.py'
      - 'tools/audit_pi_jawi_pdf.py'
      - 'tests/test_audit_pi_jawi_pdf.py'
      - 'tests/test_pi_jawi_raqm_smoke.py'
      - 'requirements.txt'
      - '.github/workflows/pi-jawi-pdf-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-audit-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Noto Arabic font and PDF smoke dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
          python -m pip install 'PyMuPDF>=1.24,<2' 'Pillow>=10' 'fonttools>=4.50,<5' 'reportlab==4.2.5'
      - name: Compile production app, audit and regression tests
        run: python -m py_compile app.py tools/audit_pi_jawi_pdf.py tests/test_audit_pi_jawi_pdf.py
      - name: Run real Jawi RAQM-to-PDF smoke test
        run: python -m unittest discover -s tests -p 'test_pi_jawi_raqm_smoke.py' -v
      - name: Run PDF structure regression
        run: python -m unittest discover -s tests -p 'test_audit_pi_jawi_pdf.py' -v
