name: Verify live Telegram to Web curriculum connection
on:
  push:
    branches: [staging/cikgulaju-web-v1]
    paths:
      - '.github/workflows/web-real-source-smoke.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify live source health and no anonymous private access
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          base="https://cikgulaju-web-v1-api-test.onrender.com"
          def get(path):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,headers={"User-Agent":"CikguLaju-Web-Source-Release-Check/1.0"}),timeout=20) as r:
                      return r.status,r.read(24000).decode()
              except urllib.error.HTTPError as e:
                  return e.code,e.read(12000).decode()
          code,body=get("/api/source/status")
          print("Live source HTTP",code)
          d=json.loads(body)
          print("Provenance",json.dumps({k:d.get(k) for k in ("curriculum_mode","shared_source_verified","catalog_parity_verified","telegram_parity_verified","reason")}))
          assert code==200 and d["curriculum_mode"]=="telegram-api" and d["shared_source_verified"] is True
          assert d["telegram_parity_verified"] is False, "RPH full parity must not be invented"
          for path in ("/api/web/rph/preview?year=4&subject=ENGLISH&unit=x&lesson=e-4-001",
                       "/api/web/rph/word?year=4&subject=ENGLISH&unit=x&lesson=e-4-001",
                       "/api/options?kind=subjects&year=4",
                       "/api/rpt/2027/catalog"):
              c,_=get(path)
              assert c==401,(path,c)
          print("PASS: Telegram live source + user access protection")
          PY
