name: Web RPH class time pupils QA
on:
  push:
    branches: [feature/web-rph-class-time-students-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Web and mobile-browser test dependencies
        run: |
          pip install 'flask==3.1.3' 'python-docx==1.2.0' 'lxml==6.0.2' 'requests==2.32.3' 'reportlab==4.4.9' 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - run: python -m py_compile web/unified_rph_web.py web/telegram_rph_parity.py
      - run: python -m unittest discover -s tests -p test_web_rph_class_time_students.py -v
      - run: python -m unittest discover -s tests -p test_web_saved_classes.py -v
      - run: python -m unittest discover -s tests -p test_web_rph_meta_browser.py -v
      - run: python -m unittest discover -s tests -p test_web_rph_availability.py -v
      - run: python -m unittest discover -s tests -p test_web_native_telegram_rph_download.py -v
