name: PJPK release-gate regression

on:
  push:
    branches:
      - 'staging/pjpk-*'
  pull_request:
    paths:
      - 'scripts/pjpk_release_gate.py'
      - 'tests/test_pjpk_release_gate.py'
      - 'scripts/pjpk_t5_evidence_overlay.py'
      - 'tests/test_pjpk_t5_evidence_overlay.py'
      - 'tests/test_pjpk_adapter_smoke.py'
      - 'tests/test_pjpk_t5_rph_editorial.py'
      - 'tests/test_pjpk_t5_complete_rph.py'
      - 'tests/test_pjpk_t5_rph_preview.py'
      - 'scripts/pjpk_t5_rph_preview.py'
      - 'scripts/pjpk_prepared_rph_lookup.py'
      - 'tests/test_pjpk_prepared_rph_lookup.py'
      - 'scripts/pjpk_t5_complete_rph_audit.py'
      - 'docs/pjpk/T5_PK_3_COMPLETE_RPH_STAGING_20261024.json'
      - 'docs/pjpk/T5_PK_3_RPH_EDITORIAL_DRAFTS_20261024.md'
      - 'scripts/pjpk_v26_16_adapter.py'
      - 'scripts/activate_pjpk_v26_16.py'
      - 'docs/pjpk/T5_PK_3_VERIFIED_EVIDENCE_OVERLAY_20261024.csv'
      - 'scripts/pjpk_t2_pk_evidence_queue.py'
      - 'tests/test_pjpk_t2_pk_evidence_queue.py'
      - 'scripts/pjpk_t2_pk_preview.py'
      - 'tests/test_pjpk_t2_pk_preview.py'
      - 'scripts/pjpk_t2_pk_batch_audit.py'
      - 'tests/test_pjpk_t2_pk_batch_audit.py'
      - 'tests/test_pjpk_t2_pk_evidence_identity.py'
      - 'docs/pjpk/T2_PK_7_COMPLETE_RPH_EDITORIAL_STAGING_20261024.json'
      - 'docs/pjpk/T2_PK_11_REMAINING_EDITORIAL_STAGING_20261024.json'
      - '.github/workflows/pjpk-release-gate.yml'
      - 'tests/test_pjpk_t5_release_checklist.py'
      - 'tests/test_pjpk_t5_source_queue_consistency.py'
      - 'tests/test_pjpk_t5_three_views_consistency.py'
      - 'tests/test_pjpk_t5_final_release_gate.py'
      - 'scripts/pjpk_t5_final_release_gate.py'
      - 'docs/pjpk/T5_PK_PRIORITY_3_SOURCE_QUEUE_20261024.csv'
      - 'docs/pjpk/T5_PK_3_REMAINING_RELEASE_CHECKLIST_20261024.csv'
  workflow_dispatch:

jobs:
  source-gate-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source-gate regression tests
        run: python -m unittest discover -s tests -p 'test_pjpk_release_gate.py' -v
      - name: Check T2 PK editorial identities and prevent unsupported promotion
        run: python -m unittest discover -s tests -p 'test_pjpk_t2_pk_evidence_identity.py' -v
      - name: Audit all eighteen T2 PK editorial RPH
        run: python -m unittest discover -s tests -p 'test_pjpk_t2_pk_batch_audit.py' -v
      - name: Test all eighteen T2 PK previews
        run: python -m unittest discover -s tests -p 'test_pjpk_t2_pk_preview.py' -v
      - name: Verify and export eighteen blocked T2 PK evidence tasks
        run: |
          python -m unittest discover -s tests -p 'test_pjpk_t2_pk_evidence_queue.py' -v
          python -m scripts.pjpk_t2_pk_evidence_queue /tmp/pjpk-t2-pk-evidence-workqueue.csv
      - name: Upload T2 PK evidence workqueue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pjpk-t2-pk-18-evidence-workqueue
          path: /tmp/pjpk-t2-pk-evidence-workqueue.csv
          if-no-files-found: warn
      - name: Assert final T5 release gate blocks missing evidence
        run: python -m unittest discover -s tests -p 'test_pjpk_t5_final_release_gate.py' -v
      - name: Cross-check all three T5 release tracking views
        run: python -m unittest discover -s tests -p 'test_pjpk_t5_three_views_consistency.py' -v
      - name: Verify T5 source queue is consistent with evidence overlay
        run: python -m unittest discover -s tests -p 'test_pjpk_t5_source_queue_consistency.py' -v
      - name: Verify T5 release checklist agrees with source evidence
        run: python -m unittest discover -s tests -p 'test_pjpk_t5_release_checklist.py' -v
      - name: Run T5 evidence-overlay regression tests
        run: python -m unittest discover -s tests -p 'test_pjpk_t5_evidence_overlay.py' -v
      - name: Run PJPK runtime adapter isolation tests
        run: python -m unittest discover -s tests -p 'test_pjpk_adapter_smoke.py' -v
      - name: Check T5 complete editorial RPH content
        run: python -m unittest discover -s tests -p 'test_pjpk_t5_rph_editorial.py' -v
      - name: Check complete structured T5 RPH against evidence
        run: |
          python -m unittest discover -s tests -p 'test_pjpk_t5_complete_rph.py' -v
          python scripts/pjpk_t5_complete_rph_audit.py
      - name: Test stored-content A4 HTML previews
        run: python -m unittest discover -s tests -p 'test_pjpk_t5_rph_preview.py' -v
      - name: Ensure incomplete prepared RPH cannot be served
        run: python -m unittest discover -s tests -p 'test_pjpk_prepared_rph_lookup.py' -v
      - name: Render and inspect three A4 PDF previews
        run: |
          python -m pip install --disable-pip-version-check weasyprint pypdf
          python -m scripts.pjpk_t5_rph_preview /tmp/pjpk-t5-preview
          python - <<'PY'
          from pathlib import Path
          from weasyprint import HTML
          from pypdf import PdfReader
          source = Path('/tmp/pjpk-t5-preview')
          output = Path('/tmp/pjpk-t5-pdf')
          output.mkdir(exist_ok=True)
          for path in sorted(source.glob('*.html')):
              pdf = output / (path.stem + '.pdf')
              HTML(filename=str(path)).write_pdf(str(pdf))
              pages = PdfReader(str(pdf)).pages
              assert len(pages) == 1, f'{path.name}: expected one A4 page, got {len(pages)}'
              box = pages[0].mediabox
              width, height = float(box.width), float(box.height)
              assert abs(width - 595.28) < 2 and abs(height - 841.89) < 2, (path.name, width, height)
              extracted = pages[0].extract_text()
              for required in ('RANCANGAN PENGAJARAN HARIAN', 'Objektif:', 'BBM:',
                               'Pentaksiran:', 'Set Induksi', 'Aktiviti 1',
                               'Aktiviti 2', 'Pengukuhan / Penilaian',
                               'Penutup', 'Rujukan:', 'Refleksi'):
                  assert required in extracted, f'{path.name}: missing {required}'
              assert 'BELUM DILULUSKAN UNTUK PRODUKSI' in extracted, path.name
              assert len(extracted.strip()) > 1100, f'{path.name}: unexpectedly short PDF text'
              print(f'{pdf.name}: A4, one page, both activities present')
          assert len(list(output.glob('*.pdf'))) == 3
          PY
      - name: Render and inspect eighteen T2 PK A4 PDF previews
        run: |
          python -m scripts.pjpk_t2_pk_preview /tmp/pjpk-t2-html
          python - <<'PY'
          from pathlib import Path
          from weasyprint import HTML
          from pypdf import PdfReader
          import json
          records = {}
          for name in ('T2_PK_7_COMPLETE_RPH_EDITORIAL_STAGING_20261024.json',
                       'T2_PK_11_REMAINING_EDITORIAL_STAGING_20261024.json'):
              for item in json.loads((Path('docs/pjpk') / name).read_text(encoding='utf-8'))['records']:
                  assert item['id'] not in records
                  records[item['id']] = item
          assert len(records) == 18
          out = Path('/tmp/pjpk-t2-pdf')
          out.mkdir(exist_ok=True)
          inputs = sorted(Path('/tmp/pjpk-t2-html').glob('*.html'))
          assert len(inputs) == 18
          for source in inputs:
              dest = out / (source.stem + '.pdf')
              HTML(filename=str(source)).write_pdf(str(dest))
              pages = PdfReader(str(dest)).pages
              assert len(pages) == 1, f'{source.name}: {len(pages)} pages'
              box = pages[0].mediabox
              assert abs(float(box.width)-595.28)<2 and abs(float(box.height)-841.89)<2
              extracted = pages[0].extract_text()
              ident = int(source.stem.split('_')[-1])
              assert ident in records, source.name
              normalized = ' '.join(extracted.split())
              assert records[ident]['topic'] in source.read_text(encoding='utf-8'), source.name
              for phrase in ('BELUM DILULUSKAN UNTUK PRODUKSI','Aktiviti 1','Aktiviti 2','Refleksi:', 'Slot RPT / Halaman buku teks:', 'Belum disahkan', str(ident)):
                  assert ' '.join(phrase.split()) in normalized, (source.name, phrase)
              # Exact title identity is asserted against the canonical HTML above.
              # PDF text extraction is not reliable for Malay word glyph matching.
              assert len(extracted.strip()) > 850, f'{source.name}: unexpectedly short content'
              print(dest.name, 'A4 one page, ID and pending evidence present')
          assert len(list(out.glob('*.pdf'))) == 18
          PY
      - name: Upload eighteen T2 PK editorial PDF previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pjpk-t2-pk-18-editorial-a4-previews
          path: /tmp/pjpk-t2-pdf/*.pdf
          if-no-files-found: warn
      - name: Upload editorial PDF previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pjpk-t5-editorial-a4-previews
          path: /tmp/pjpk-t5-pdf/*.pdf
          if-no-files-found: warn
      - name: Validate T5 evidence-overlay integrity (pending readiness is expected)
        run: |
          set +e
          python scripts/pjpk_t5_evidence_overlay.py docs/pjpk/T5_PK_3_VERIFIED_EVIDENCE_OVERLAY_20261024.csv
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "Expected pending release status 2, received $status"
            exit 1
          fi
