name: PJPK release-gate regression

on:
  push:
    branches:
      - 'staging/pjpk-*'
  pull_request:
    paths:
      - 'scripts/pjpk_release_gate.py'
      - 'tests/test_pjpk_release_gate.py'
      - 'scripts/pjpk_t5_evidence_overlay.py'
      - 'tests/test_pjpk_t5_evidence_overlay.py'
      - 'tests/test_pjpk_adapter_smoke.py'
      - 'tests/test_pjpk_t5_rph_editorial.py'
      - 'tests/test_pjpk_t5_complete_rph.py'
      - 'scripts/pjpk_t5_complete_rph_audit.py'
      - 'docs/pjpk/T5_PK_3_COMPLETE_RPH_STAGING_20261024.json'
      - 'docs/pjpk/T5_PK_3_RPH_EDITORIAL_DRAFTS_20261024.md'
      - 'scripts/pjpk_v26_16_adapter.py'
      - 'docs/pjpk/T5_PK_3_VERIFIED_EVIDENCE_OVERLAY_20261024.csv'
      - '.github/workflows/pjpk-release-gate.yml'
  workflow_dispatch:

jobs:
  source-gate-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source-gate regression tests
        run: python -m unittest discover -s tests -p 'test_pjpk_release_gate.py' -v
      - name: Run T5 evidence-overlay regression tests
        run: python -m unittest discover -s tests -p 'test_pjpk_t5_evidence_overlay.py' -v
      - name: Run PJPK runtime adapter isolation tests
        run: python -m unittest discover -s tests -p 'test_pjpk_adapter_smoke.py' -v
      - name: Check T5 complete editorial RPH content
        run: python -m unittest discover -s tests -p 'test_pjpk_t5_rph_editorial.py' -v
      - name: Check complete structured T5 RPH against evidence
        run: |
          python -m unittest discover -s tests -p 'test_pjpk_t5_complete_rph.py' -v
          python scripts/pjpk_t5_complete_rph_audit.py
      - name: Validate T5 evidence-overlay integrity (pending readiness is expected)
        run: |
          set +e
          python scripts/pjpk_t5_evidence_overlay.py docs/pjpk/T5_PK_3_VERIFIED_EVIDENCE_OVERLAY_20261024.csv
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "Expected pending release status 2, received $status"
            exit 1
          fi
