name: Smoke Native Telegram RPH Private Gate
on:
  push:
    branches: [feature/web-direct-rph-telegram-engine-20261105]
    paths: [.github/workflows/smoke-native-rph-private-20261105.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check installed native endpoint rejects unauthenticated callers
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          from time import sleep
          url="https://cikgulaju-ai.onrender.com/internal/rph/v1/render"
          for i in range(12):
            request=Request(url,data=b"{}",method="POST",headers={
              "Content-Type":"application/json","Accept":"application/json"})
            try:
              with urlopen(request,timeout=25) as result:
                status=result.status
            except HTTPError as exc:
              status=exc.code
            except (OSError,URLError):
              status=0
            print(f"probe={i+1}: HTTP {status}",flush=True)
            if status==401:
              print("NATIVE_TELEGRAM_RPH_PRIVATE_GATE_LIVE",flush=True)
              break
            if i==11:
              raise SystemExit("Native endpoint unavailable or insecure")
            sleep(12)
          PY
