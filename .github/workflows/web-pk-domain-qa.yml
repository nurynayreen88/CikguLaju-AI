name: Web PK grouped DSKP domain and PJ isolation QA
on:
  push:
    branches: [production/cikgulaju-web-20261105, fix/web-pk-domain-dedup-20261106]
    paths:
      - 'web/unified_rph_web.py'
      - 'tests/test_web_pk_domain_navigation_20261106.py'
      - '.github/workflows/web-pk-domain-qa.yml'
  pull_request:
    paths:
      - 'web/unified_rph_web.py'
      - 'tests/test_web_pk_domain_navigation_20261106.py'
      - '.github/workflows/web-pk-domain-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'flask==3.1.3' 'python-docx==1.2.0' 'lxml==5.4.0'
      - run: PYTHONPATH=tests:. python -m unittest -v tests.test_web_pk_domain_navigation_20261106 tests.test_web_pj_unit_navigation_20261106 tests.test_web_unified_rph_preview
