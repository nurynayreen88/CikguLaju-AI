name: Audit exact remaining BM RTL KP2027 SJK RPT downloads
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/audit_remaining_rpt_layout_20261126.py'
      - '.github/workflows/rpt-remaining-layout-audit-20261126.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: python -m tools.audit_remaining_rpt_layout_20261126
