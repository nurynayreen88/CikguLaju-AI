# QA retrigger: sample RPH from current main generator, 2026-11-23 (non-production).
name: Native KSSR RPH — source-specific reflection and A4 QA
on:
  pull_request:
    paths:
      - "web/rph_objective_linked_reflection_20261123.py"
      - "tests/test_rph_objective_linked_reflection_20261123.py"
      - "tools/audit_source_reflection_a4_20261123.py"
      - "tools/run_telegram_with_curriculum_api.py"
      - ".github/workflows/rph-objective-reflection-a4-20261123.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  active-reflection:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fast manual/source/style regression before expensive rendering
        run: |
          python -m unittest discover -s tests -p 'test_rph_objective_linked_reflection_20261123.py' -v
          python -m py_compile web/rph_objective_linked_reflection_20261123.py tools/audit_source_reflection_a4_20261123.py
      - name: Install one-page LibreOffice A4 renderer and Jawi font
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libreoffice-writer fonts-noto-core
      - name: Prepare exact existing native verified RPT runtime
        run: bash build_jawi.sh
      - name: Validate real PI and BM Word/PDF one-page A4 with objective reflection
        run: python -m tools.audit_source_reflection_a4_20261123
      - name: Publish audit-only source-backed PI/BM Word/PDF examples
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CIKGULAJU_RPH_REFLEKSI_OBJ_AKTIF_PI_BM_20261123
          path: qa/rph-source-reflections/*
          if-no-files-found: error
          retention-days: 7
