name: English Y2-Y6 A4 layout diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/audit_english_rph_word_a4_layout.py'
      - '.github/workflows/english-y2-y6-a4-layout.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install local rendering dependencies
        run: |
          python -m pip install python-docx==1.1.2 pypdf==5.1.0
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer >/dev/null
          fi
      - name: Render 30 RPH source samples on an isolated A4 Word layout
        run: python tools/audit_english_rph_word_a4_layout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-y2-y6-a4-layout-audit
          path: output/english_a4_layout_audit/
          retention-days: 7
