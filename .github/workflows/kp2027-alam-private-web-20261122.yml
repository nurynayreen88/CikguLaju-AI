name: KP2027 Alam Tahun 1 private Word PDF login QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'web/kp2027_alam_private_web.py'
      - 'web/kp2027_alam_v10_catalog.json'
      - 'tests/test_kp2027_alam_private_web.py'
      - 'tools/run_web_production.py'
      - '.github/workflows/kp2027-alam-private-web-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  curriculum-and-access:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flask test dependency only
        run: python -m pip install 'Flask>=3.1,<4'
      - name: Compile private route and launcher
        run: python -m py_compile web/kp2027_alam_private_web.py tests/test_kp2027_alam_private_web.py tools/run_web_production.py
      - name: Test catalog, source digest, auth, Origin and shared quota
        run: python -m unittest discover -s tests -p 'test_kp2027_alam_private_web.py' -v
      - name: Require 64 verified source Lessons and private access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('web/kp2027_alam_private_web.py').read_text()
          m=json.loads(Path('web/kp2027_alam_v10_catalog.json').read_text())
          assert len(m['items'])==64
          assert sum(len(x['codes'])==2 for x in m['items'].values())==19
          assert m['source_archive_sha256']=='b1ae8dcab0894bacc894d7fb310ff5ece27a1077e84846a64a86a61235d3a8ef'
          assert 'CIKGULAJU_KP2027_ALAM_CANARY_ENABLED' in p
          assert "'approval_status':'eq.CANARY_APPROVED'" in p
          assert 'authorize_rendered_document(' in p
          assert 'Origin' in p
          assert 'content_base64=' not in p
          print('ALAM_PRIVATE_CODE_GATE_PASS (not E2E teacher proof)')
          PY
