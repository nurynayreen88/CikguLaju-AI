name: Telegram main-menu Web encouragement QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'tests/test_telegram_web_main_menu_notice_20261108.py'
      - '.github/workflows/telegram-main-menu-web-cta-20261113.yml'
permissions:
  contents: read
jobs:
  verify-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm Python syntax of Telegram runtime
        run: python -m py_compile app.py
      - name: Test main menu content and user/admin buttons without real Telegram
        run: python -m unittest discover -s tests -p 'test_telegram_web_main_menu_notice_20261108.py' -v
      - name: Ensure RPH Hari Ini menu state remains unaffected
        run: python -m unittest discover -s tests -p 'test_rph_hari_ini_pause_20261105.py' -v
