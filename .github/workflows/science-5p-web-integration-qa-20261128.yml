name: Science 5P isolated Web integration QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/science_5p_*_20261128.py'
      - 'tools/audit_science_5p_personalized_downloads_20261128.py'
      - 'tests/test_science_5p_web_integration_qa_20261128.py'
      - 'tools/audit_science_native_5p_documents_20261128.py'
      - 'tools/audit_science_5p_native_pdf_20261128.py'
      - 'web/rph_delivery_quota.py'
      - 'web/rph_5p_v5_layout.py'
      - 'audits/rph_5p_science_y*_native_*_20261128.json'
      - 'audits/rph_5p_science_y*_support_*_20261128.json'
      - '.github/workflows/science-5p-web-integration-qa-20261128.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  personalized-205:
    strategy:
      fail-fast: false
      matrix:
        year: [5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask python-docx pymupdf
      - name: Test every draft download with auto and manual reflection
        run: PYTHONPATH=. python tools/audit_science_5p_personalized_downloads_20261128.py --year ${{ matrix.year }} --out qa_personalized_${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: science-5p-personalized-y${{ matrix.year }}-report
          path: qa_personalized_${{ matrix.year }}/report.json
          retention-days: 7
  isolated-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask python-docx pymupdf
      - name: Mocked native catalogue and quota integration checks
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_science_5p_web_integration_qa_20261128.py -v
