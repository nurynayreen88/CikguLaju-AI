name: Arabic 82 supplementary RPH and 380 RPT schedule QA
on:
  pull_request:
    paths:
      - 'rph_standalone/bahasa_arab/proposed_2027/**'
      - 'audits/arabic_rpt2027_380_aligned_ab_schedule_20261125.csv'
      - 'audits/arabic_rpt2027_year*_extra_textbook_visual_20261126.json'
      - 'tools/qa_arabic_82_extra_word_20261125.py'
      - '.github/workflows/arabic-82-extra-qa-20261125.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx pymupdf
      - run: python -m tools.qa_arabic_82_extra_word_20261125
      - name: Validate and export 10 A/B schedules
        run: |
          python - <<'PY'
          import csv,json
          from collections import Counter
          from pathlib import Path
          out=Path("qa-arabic-82")
          with open("audits/arabic_rpt2027_380_aligned_ab_schedule_20261125.csv",encoding="utf8") as f: rows=list(csv.DictReader(f))
          assert len(rows)==380
          extra=[r for r in rows if r["status"]=="EXTRA_REVIEW"]
          assert len(extra)==82 and all(r["textbook_pages"] for r in extra)
          assert Counter(r["textbook_evidence"] for r in extra)=={"DIRECT":55,"CONTEXT":27}
          assert Counter(r["status"] for r in rows)=={"EXTRA_REVIEW":82,"ORIGINAL_DURATION_REVIEW":298}
          for y in range(2,7):
              rs=[r for r in rows if int(r["year"])==y]
              assert [int(r["new_pdp"]) for r in rs]==list(range(1,77))
              weeks={}
              for r in rs: weeks.setdefault(r["week"],[]).append(int(r["minutes"]))
              assert len(weeks)==38 and all(x==[60,30] for x in weeks.values())
              original=[int(r["old_pdp"]) for r in rs if r["old_pdp"]]
              assert original==list(range(1,59 if y==4 else 61))
              for g in "AB":
                  with (out/f"RPT_T{y}_{g}.csv").open("w",encoding="utf-8-sig",newline="") as f:
                      w=csv.writer(f);w.writerow(["pdp","week","start","end","minutes","unit","original_pdp","sk","sp","status","textbook_pages","textbook_evidence"])
                      for r in rs:w.writerow([r["new_pdp"],r["week"],r[g+"_start"],r[g+"_end"],r["minutes"],r["unit"],r["old_pdp"],r["sk"],r["sp"],r["status"],r["textbook_pages"],r["textbook_evidence"]])
          print("380 slots verified, 10 A/B schedule files")
          PY
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-hosny-amiri
      - name: Convert all supplementary RPH to PDF and check A4
        run: |
          python - <<'PY'
          import subprocess,fitz
          from pathlib import Path
          out=Path("qa-arabic-82").resolve()
          pdf=out/"pdf";pdf.mkdir()
          fs=sorted(out.glob("*.docx"));assert len(fs)==82
          for n in range(0,len(fs),20):
              subprocess.run(["libreoffice","-env:UserInstallation="+(out/f"lo-{n}").as_uri(),"--headless","--convert-to","pdf","--outdir",str(pdf),*map(str,fs[n:n+20])],check=True,timeout=180)
          errors=[]
          for f in fs:
              with fitz.open(pdf/(f.stem+".pdf")) as d:
                  if len(d)!=1 or abs(d[0].rect.width-595.28)>2 or abs(d[0].rect.height-841.89)>2 or not d[0].get_text().strip(): errors.append(f.name)
          print("A4 PDF",82-len(errors),"/82",errors)
          assert not errors
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arabic-82-supplementary-rph-and-rpt-review
          path: |
            qa-arabic-82/*.docx
            qa-arabic-82/*.csv
            qa-arabic-82/pdf/*.pdf
          retention-days: 7
