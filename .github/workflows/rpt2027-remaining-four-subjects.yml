name: RPT2027 remaining BM PI Arabic Music 20-PDF format QA
on:
  pull_request:
    paths:
      - 'scripts/build_rpt_2027_remaining_four_subjects_staging.py'
      - 'tests/test_rpt_2027_remaining_four_subjects_staging.py'
      - 'rpt_2027/common/format_2026_layout_preview.py'
      - 'rpt_2027/bahasa_melayu/*Format_2026_DRAF.html'
      - 'rpt_2027/bahasa_arab/*DRAF.csv'
      - 'staging/pendidikan_muzik/rpt_rph_2027/year*/RPT_MUZIK*DRAF.csv'
      - 'rph_standalone/pendidikan_islam_draf_2027/year*.json'
      - '.github/workflows/rpt2027-remaining-four-subjects.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview_20:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'reportlab==4.2.5' 'pypdf==5.1.0' 'PyMuPDF==1.24.14' 'beautifulsoup4==4.12.3' 'arabic-reshaper==3.0.0' 'python-bidi==0.6.3'
      - run: python -m py_compile scripts/build_rpt_2027_remaining_four_subjects_staging.py rpt_2027/common/format_2026_layout_preview.py
      - name: 20 source-faithful five-column RPT audits
        run: python -m unittest tests.test_rpt_2027_remaining_four_subjects_staging -v
      - name: Build 20 PDFs and visual QA
        run: |
          python -m scripts.build_rpt_2027_remaining_four_subjects_staging
          python - <<'PY'
          import fitz
          from pathlib import Path
          root=Path('staging/rpt_2027_seragam_2026/baki_4_subjek_DRAF')
          allpdf=sorted(root.glob('*.pdf'))
          assert len(allpdf)==20, len(allpdf)
          for file in allpdf:
              with fitz.open(file) as pdf:
                  assert pdf.page_count>=2, file
                  for i,pg in enumerate(pdf):
                      assert pg.rect.width>pg.rect.height, (file,i,'not landscape')
                      for b in pg.get_text('blocks'):
                          x0,y0,x1,y1=b[:4]
                          assert 0<=x0<=x1<=pg.rect.width and 0<=y0<=y1<=pg.rect.height, (file,i,b[:4])
                      assert '\\x00' not in pg.get_text(), (file,i,'NUL chars')
                  page1=pdf[0]
                  for t in ('LOGO SEKOLAH','NAMA SEKOLAH','NAMA GURU'):
                      assert t in page1.get_text(),(file,t)
                  page1.get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(
                      str(file.with_suffix('.cover.png')))
                  pdf[1].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(
                      str(file.with_suffix('.page2.png')))
          print('SUCCESS: 20 PDF, 40 PNG previews, landscape bounded text')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RPT2027-20-BM-PI-ARAB-MUZIK-Seragam-DRAF
          path: |
            staging/rpt_2027_seragam_2026/baki_4_subjek_DRAF/*.pdf
            staging/rpt_2027_seragam_2026/baki_4_subjek_DRAF/*.png
          if-no-files-found: error
          retention-days: 14
