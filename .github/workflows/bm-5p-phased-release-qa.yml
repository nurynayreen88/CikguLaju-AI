name: BM 5P phased release QA
on:
  pull_request:
    paths:
      - 'web/kp2027_bm_5p*.py'
      - 'web/kp2027_bm_rph_web.py'
      - 'web_v1_static_preview/index.html'
      - 'audits/rph_5p_bm_kp2027_batch01_content_release_review_20261128.json'
      - 'tests/test_bm*5p*.py'
      - '.github/workflows/bm-5p-phased-release-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-docx pymupdf
      - run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_bm*5p*.py' -v
