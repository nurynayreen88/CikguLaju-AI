17-PKHAS-KETIDAKUPAYAAN-PENDENGARAN-PENDIDIKAN-ISLAM-SUAIAN-TAHUN-4.pdf","title":"DSKP Pendidikan Islam (Suaian) Tahun 4"},{"stream":"pendengaran","year":"1","subject":"Bahasa Inggeris","url":"https://skpktaiping.home.blog/wp-content/uploads/2019/02/30-dskp-kssr-pendidikan-khas-ketidakupayaan-pendengaran-bahasa-inggeris-08122016.pdf","title":"DSKP Bahasa Inggeris Tahun 1"},{"stream":"pendengaran","year":"1","subject":"Bahasa Isyarat Komunikasi","url":"https://asiemodel.net/wp-content/uploads/2022/08/19-DSKP-KSSR-Pendidikan-Khas-Ketidakupayaan-Pendengaran-Tahun-1-Bahasa-Isyarat-Komunikasi-06122016.pdf","title":"DSKP Bahasa Isyarat Komunikasi Tahun 1"},{"stream":"pendengaran","year":"2","subject":"Bahasa Isyarat Komunikasi","url":"https://asiemodel.net/wp-content/uploads/2022/08/021-DSKP-KSSR-PENDIDIKAN-KHAS-SEMAKAN-2017-TU-PENDENGARAN-BAHASA-ISYARAT-KOMUNIKASI-TAHUN-2.pdf","title":"DSKP Bahasa Isyarat Komunikasi Tahun 2"},{"stream":"pendengaran","year":"3","subject":"Bahasa Isyarat Komunikasi","url":"https://asiemodel.net/wp-content/uploads/2022/08/021-DSKP-KSSR-SEMAKAN-2017-KETIDAKUPAYAAN-PENDENGARAN-BAHASA-ISYARAT-KOMUNIKASI-TAHUN-3.pdf","title":"DSKP Bahasa Isyarat Komunikasi Tahun 3"},{"stream":"penglihatan","year":"3","subject":"Kemahiran Asas Individu Ketidakupayaan Penglihatan","url":"https://asiemodel.net/wp-content/uploads/2022/08/022-DSKP-KSSR-SEMAKAN-2017-KETIDAKUPAYAAN-PENGLIHATAN-KEMAHIRAN-ASAS-INDIVIDU-KETIDAKUPAYAAN-PENGLIHATAN-TAHUN-3.pdf","title":"DSKP Kemahiran Asas Individu Ketidakupayaan Penglihatan Tahun 3"},{"stream":"penglihatan","year":"5","subject":"Kemahiran Asas Individu Ketidakupayaan Penglihatan","url":"https://asiemodel.net/wp-content/uploads/2022/08/029_DSKP-KSSR-KETIDAKUPAYAAN-PENGLIHATAN-KEM-ASAS-INDV-KP-TAHUN-5-27022020-print.pdf","title":"DSKP Kemahiran Asas Individu Ketidakupayaan Penglihatan Tahun 5"},{"stream":"penglihatan","year":"6","subject":"Kemahiran Asas Individu Ketidakupayaan Penglihatan","url":"https://asiemodel.net/wp-content/uploads/2022/08/23.-DSKP-KSSR-PKHAS-SEMAKAN-2017_k_PENGLIHATAN-KAIKuP-TAHUN-6_ISBN.pdf","title":"DSKP Kemahiran Asas Individu Ketidakupayaan Penglihatan Tahun 6"},{"stream":"penglihatan","year":"6","subject":"Pendidikan Jasmani (Suaian) dan Pendidikan Kesihatan","url":"https://asiemodel.net/wp-content/uploads/2022/08/21.-DSKP-KSSR-PKhas-SEMAKAN-2017_K_PENGLIHATAN-PJSPK-TAHUN-6_ISBN.pdf","title":"DSKP Pendidikan Jasmani (Suaian) dan Pendidikan Kesihatan Tahun 6"},{"stream":"penglihatan","year":"2","subject":"Kemahiran Asas Individu Ketidakupayaan Penglihatan","url":"https://asiemodel.net/wp-content/uploads/2022/08/022-DSKP-KSSR-PEND-KHAS-SEMAKAN-2017-TU-PENGLIHATAN-KEMAHIRAN-ASAS-INDIVIDU-TU-PENGLIHATAN-TAHUN-2.pdf","title":"DSKP Kemahiran Asas Individu Ketidakupayaan Penglihatan Tahun 2"}]''')
          out=pathlib.Path("pk-originals")
          out.mkdir(exist_ok=True)
          allowed={"asiemodel.net","kemahiranbelajarsite.wordpress.com","skpktaiping.home.blog"}
          def norm(s):
              return re.sub(r"[^a-z0-9]+"," ",unicodedata.normalize("NFKC",s).lower()).strip()
          def collect(row):
              result=dict(row)
              try:
                  with requests.get(row["url"],stream=True,timeout=(15,45),headers={"User-Agent":"CikguLaju curriculum source verification"}) as response:
                      response.raise_for_status()
                      if urlsplit(response.url).scheme!="https" or urlsplit(response.url).hostname not in allowed:
                          raise ValueError("Unexpected redirect")
                      data=bytearray()
                      for chunk in response.iter_content(131072):
                          data.extend(chunk)
                          if len(data)>60*1024*1024:
                              raise ValueError("File exceeds 60 MiB limit")
                  if not data.startswith(b"%PDF-"):
                      raise ValueError("Not a PDF")
                  doc=fitz.open(stream=bytes(data),filetype="pdf")
                  if doc.page_count<5 or doc.needs_pass:
                      raise ValueError("Incomplete or protected PDF")
                  cover=norm(" ".join(doc[i].get_text() for i in range(min(4,doc.page_count))))
                  stream=row["stream"]
                  stream_terms={"masalah-pembelajaran":"masalah pembelajaran","pendengaran":"pendengaran","penglihatan":"penglihatan"}
                  roman={"1":"satu","2":"dua","3":"tiga","4":"empat","5":"lima","6":"enam"}
                  subject=norm(row["subject"])
                  year=row["year"]
                  if stream_terms[stream] not in cover or not any(v in cover for v in ("tahun "+year,"tahun "+roman[year])) or subject not in cover:
                      raise ValueError("Cover text mismatch or unavailable; requires manual review")
                  if not any(v in cover for v in ("standard kurikulum","kssr","kurikulum standard sekolah rendah")):
                      raise ValueError("Not identified as curriculum document")
                  filename="DSKP KSSRPK - "+stream+" - "+row["subject"]+" - Tahun "+year+".pdf"
                  (out/filename).write_bytes(data)
                  result.update(status="verified",filename=filename,pages=doc.page_count,bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              except Exception as exc:
                  result.update(status="hold",reason=str(exc)[:350])
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              report=list(pool.map(collect,rows))
          (out/"manifest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          for row in report:
              print(row["status"],row["stream"],row["title"],row.get("reason",""))
          print("VERIFIED",sum(row["status"]=="verified" for row in report),"OF",len(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pk-original-pdfs-verified
          path: pk-originals/
          retention-days: 7
          if-no-files-found: error
