name: Web logo and English RPH A4 table QA
on:
  push:
    branches:
      - feature/web-logo-table-rph-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-web-table-rph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask==3.1.3 python-docx==1.2.0 Pillow==11.3.0
      - name: Verify transparent logo and A4 Word tables using real English lesson files
        run: |
          python -m py_compile web/rph_table_layout.py web/unified_rph_web.py tools/run_web_production.py
          python -m unittest discover -s tests -p test_web_logo_and_tables.py -v
          python -m unittest discover -s tests -p test_web_unified_rph_preview.py -v
          python -m unittest discover -s tests -p test_web_v1_quick_preview.py -v
          python -m unittest discover -s tests -p test_web_production_inventory.py -v
      - name: Check browser RPH preview script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('web_v1_static_preview/index.html').read_text(encoding='utf8')
          scripts=re.findall(r'<script>\s*(.*?)\s*</script>',html,flags=re.S)
          assert len(scripts)==1
          Path('/tmp/rph-table-preview.js').write_text(scripts[0],encoding='utf8')
          PY
          node --check /tmp/rph-table-preview.js
