name: Web RPH Hari Ini selection progress (safe UI only)

on:
  pull_request:
    paths:
      - "web_v1_static_preview/rph-today.js"
      - "tests/test_rph_today_selection_progress_20261111.cjs"
      - ".github/workflows/web-rph-today-selection-progress-20261111.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progress-ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: node --check web_v1_static_preview/rph-today.js
      - name: Verify batch selection progress and no API/credit behavior changes
        run: node tests/test_rph_today_selection_progress_20261111.cjs
