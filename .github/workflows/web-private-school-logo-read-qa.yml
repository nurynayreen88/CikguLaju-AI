name: Private school logo read path QA
on:
  push:
    branches: [feature/web-private-school-logo-read-route-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'flask==3.1.3' 'Pillow==11.3.0' 'pypdf==5.1.0' 'reportlab==4.2.5' 'python-docx==1.2.0'
      - run: python -m py_compile web/school_logo_store.py web/teacher_profile_routes.py web/rpt_school_cover.py
      - run: python -m unittest discover -s tests -p test_web_school_rpt_branding.py -v
      - run: python -m unittest discover -s tests -p test_web_rpt_native_proxy_stdlib.py -v
      - run: python -m unittest discover -s tests -p test_web_shared_teacher_profile.py -v
