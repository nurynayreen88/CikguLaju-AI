name: Telegram SK RPH 2027 menu and delivery
on:
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'dlp_year2_rph.py'
      - 'fonts/rph/**'
      - 'web/rph_document_style.py'
      - 'curriculum_version_telegram.py'
      - 'tests/test_curriculum_version_telegram.py'
      - 'web/telegram_sk_rph_2027.py'
      - 'web/telegram_rph_entry_choices_20261110.py'
      - 'staging/sains/tahun5/**'
      - 'staging/dlp/year6/**'
      - 'staging/matematik/**'
      - 'rpt_2027/matematik/**'
      - 'tests/test_math_rpt_2027_telegram_downloads.py'
      - 'tests/test_telegram_sk_rph_2027_menu.py'
      - '.github/workflows/telegram-sk-rph-2027-menu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menu-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask==3.1.3 python-docx==1.2.0 reportlab==4.2.5 pypdf==5.1.0
      - run: python -m unittest discover -s tests -p 'test_curriculum_version_telegram.py' -v
      - run: python -m unittest discover -s tests -p 'test_telegram_sk_rph_2027_menu.py' -v
      - run: python -m unittest discover -s tests -p 'test_telegram_rph_entry_choices_20261110.py' -v
      - run: python -m unittest discover -s tests -p 'test_math_rpt_2027_telegram_downloads.py' -v
