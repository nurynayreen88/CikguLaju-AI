name: Audit DLP weekly teaching allocation
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/audit_dlp_correct_weekly_allocation_20261126.py'
      - '.github/workflows/audit-dlp-weekly-allocation-20261126.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3' 'requests>=2'
      - run: python -m tools.audit_dlp_correct_weekly_allocation_20261126
