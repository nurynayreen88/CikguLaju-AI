name: RPT2027 Math Y2-6 585-Lesson five-column staging QA
on:
  pull_request:
    paths:
      - 'scripts/audit_rpt2027_teacher_text_leaks_20261108.py'
      - 'tests/test_rpt2027_teacher_text_leak_scan.py'
      - 'scripts/build_rpt_2027_mathematics_pdf_reflow_staging.py'
      - 'tests/test_rpt_2027_mathematics_reflow_staging.py'
      - '.github/workflows/rpt2027-math-five-column-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'PyMuPDF==1.24.14' 'reportlab==4.2.5' 'pypdf==5.1.0' 'beautifulsoup4==4.12.3'
      - run: python -m py_compile scripts/build_rpt_2027_mathematics_pdf_reflow_staging.py
      - name: Test Maths source 117 Lessons each and new PDF
        run: python -m unittest tests.test_rpt_2027_mathematics_reflow_staging -v
      - name: Build 5 Maths RPT and check each page
        run: |
          python -m scripts.build_rpt_2027_mathematics_pdf_reflow_staging
          python - <<'PY'
          from pathlib import Path
          import fitz
          files=list(Path('staging/rpt_2027_seragam_2026/matematik_reflow_DRAF').glob('*.pdf'))
          assert len(files)==5,len(files)
          for file in files:
              with fitz.open(file) as d:
                  for p in d:
                      assert p.rect.width>p.rect.height
                      assert chr(0) not in p.get_text()
                      for b in p.get_text('blocks'):
                          x0,y0,x1,y1=b[:4]
                          assert 0<=x0<=x1<=p.rect.width and 0<=y0<=y1<=p.rect.height
                  d[0].get_pixmap(matrix=fitz.Matrix(1.4,1.4),alpha=False).save(str(file.with_suffix('.cover.png')))
                  d[1].get_pixmap(matrix=fitz.Matrix(1.4,1.4),alpha=False).save(str(file.with_suffix('.page2.png')))
          PY
      - name: Audit RPT developer-note leakage in MATEMATIK output (read-only)
        run: |
          python -m unittest tests.test_rpt2027_teacher_text_leak_scan -v
          python -m scripts.audit_rpt2027_teacher_text_leaks_20261108 \
            --teacher-output-only \
            --fail-on-findings \
            --output staging/rpt_2027_seragam_2026/teacher_text_leak_MATEMATIK.json \
            staging/rpt_2027_seragam_2026/matematik_reflow_DRAF
      - uses: actions/upload-artifact@v4
        with:
          name: RPT2027-MATH-585-LESSON-5-LIMA-LAJUR-DRAF
          path: |
            staging/rpt_2027_seragam_2026/teacher_text_leak_MATEMATIK.json
            staging/rpt_2027_seragam_2026/matematik_reflow_DRAF/*.pdf
            staging/rpt_2027_seragam_2026/matematik_reflow_DRAF/*.png
          if-no-files-found: error
          retention-days: 14
