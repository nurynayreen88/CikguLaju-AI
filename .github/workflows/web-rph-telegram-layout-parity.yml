name: Web RPH Telegram Layout Parity QA
on:
  push:
    branches:
      - feature/web-rph-telegram-format-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask==3.1.3 python-docx==1.2.0 Pillow==11.3.0
      - name: Validate Word / Web PDF print structural parity with Telegram
        run: |
          python -m py_compile web/telegram_rph_parity.py web/rph_table_layout.py web/unified_rph_web.py
          python -m unittest discover -s tests -p test_web_logo_and_tables.py -v
          python -m unittest discover -s tests -p test_web_unified_rph_preview.py -v
          python -m unittest discover -s tests -p test_web_v1_quick_preview.py -v
          python -m unittest discover -s tests -p test_web_sidebar_navigation.py -v
          python -m unittest discover -s tests -p test_web_shared_teacher_profile.py -v
      - name: Validate browser JS syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("web_v1_static_preview/index.html").read_text("utf8")
          scripts=re.findall(r'<script>\s*(.*?)\s*</script>',html,flags=re.S)
          assert len(scripts)==1
          Path("/tmp/cikgulaju-rph-parity.js").write_text(scripts[0],encoding="utf8")
          PY
          node --check /tmp/cikgulaju-rph-parity.js
