name: Web Supabase school profile selector and legacy safety
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - web/teacher_profile_store.py
      - web/teacher_profile_routes.py
      - web/school_directory_store.py
      - web_v1_static_preview/teacher-profile.js
      - web_v1_static_preview/index.html
      - tests/test_web_school_directory_20261111.py
      - .github/workflows/web-school-directory-qa-20261111.yml
  push:
    branches: [feature/web-supabase-school-picker-20261111, production/cikgulaju-web-20261105]
    paths:
      - web/teacher_profile_store.py
      - web/teacher_profile_routes.py
      - web/school_directory_store.py
      - web_v1_static_preview/teacher-profile.js
      - web_v1_static_preview/index.html
      - tests/test_web_school_directory_20261111.py
      - .github/workflows/web-school-directory-qa-20261111.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  school-picker-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated profile test dependency
        run: python -m pip install 'Flask==3.1.3'
      - name: Compile school directory and Web profile routes
        run: python -m py_compile web/school_directory_store.py web/teacher_profile_store.py web/teacher_profile_routes.py tests/test_web_school_directory_20261111.py
      - name: Run new school directory and existing shared-profile regressions
        run: |
          python -m unittest discover -s tests -p 'test_web_school_directory_20261111.py' -v
          python -m unittest discover -s tests -p 'test_web_shared_teacher_profile.py' -v
          python -m unittest discover -s tests -p 'test_web_teacher_profile_timetable.py' -v
          python -m unittest discover -s tests -p 'test_web_saved_classes.py' -v
          python -m unittest discover -s tests -p 'test_web_sidebar_navigation.py' -v
      - name: Check browser JavaScript syntax
        run: |
          node --check web_v1_static_preview/teacher-profile.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('web_v1_static_preview/index.html').read_text(encoding='utf8')
          inline=re.findall(r'<script>\s*(.*?)\s*</script>',html,flags=re.S)
          assert len(inline)==1
          Path('/tmp/cikgulaju-school-ui.js').write_text(inline[0],encoding='utf8')
          PY
          node --check /tmp/cikgulaju-school-ui.js
