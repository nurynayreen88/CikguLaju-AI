name: Audit active PI orphan numbered step
on:
  pull_request:
    paths:
      - "tools/audit_pi_orphan_number_20261123.py"
      - "tools/audit_pi_live_render_steps_20261123.py"
      - "web/pi_rpt_orphan_step_guard_20261123.py"
      - "tests/test_pi_rpt_orphan_step_guard_20261123.py"
      - "tools/run_telegram_with_curriculum_api.py"
      - ".github/workflows/pi-rpt-orphan-step-20261123.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect exact active 809 verified RPT source
        run: python -m tools.audit_pi_orphan_number_20261123
      - name: Install actual native RPH engine dependencies
        run: bash build_jawi.sh
      - name: Test exact PI source recovery and scope guards
        run: python -m unittest discover -s tests -p 'test_pi_verified_rpt_activity_restore_20261123.py' -v
      - name: Inspect source to runtime rendering boundaries
        run: python -m tools.audit_pi_live_render_steps_20261123
      - name: Upload genuine native Word and PDF (protected QA only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CIKGULAJU_PI_809_AKTIF_4_LANGKAH_DIPULIHKAN
          path: qa/pi-source-steps-fixed/*
          if-no-files-found: error
          retention-days: 7
