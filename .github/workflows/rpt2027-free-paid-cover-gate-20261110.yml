name: RPT 2027 free download and paid-profile print gate
on:
  pull_request:
    branches:
      - production/cikgulaju-web-20261105
    paths:
      - 'web/rpt_2027_all_http.py'
      - 'web/english_rpt_2027_http.py'
      - 'web_v1_static_preview/index.html'
      - 'web_v1_static_preview/rpt-personalize.js'
      - 'web_v1_static_preview/teacher-profile.js'
      - 'rpt_2027/web_2027_pdfs/original_cover_layout_verified.json'
      - 'tests/test_web_rpt*.py'
      - '.github/workflows/rpt2027-free-paid-cover-gate-20261110.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access-and-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'flask==3.1.3' 'PyMuPDF==1.24.14' 'pillow==11.3.0'
      - name: Verify client script parses
        run: node --check web_v1_static_preview/rpt-personalize.js
      - name: Verify account gate, exact source PDF, expired access, and cover source hashes
        run: |
          for suite in \
            tests/test_web_rpt_2027_all.py \
            tests/test_web_rpt2027_56_release_catalog.py \
            tests/test_web_rpt2027_free_paid_expiry_20261110.py \
            tests/test_web_rpt_original_cover_layout.py \
            tests/test_rpt2027_catalog_teacher_labels_20261110.py
          do
            PYTHONPATH=. python "$suite"
          done
  phone-personalization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'flask==3.1.3' 'PyMuPDF==1.24.14' 'playwright==1.55.0'
      - run: python -m playwright install --with-deps chromium
      - name: Browser E2E paid cover vs free/expired raw PDF
        run: |
          PYTHONPATH=. python tests/test_web_rpt_mobile_profile_end_to_end.py
          PYTHONPATH=. python tests/test_web_mobile_rpt_download_browser.py
