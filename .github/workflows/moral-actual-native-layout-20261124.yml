name: Moral actual native Word PDF premium layout
on:
  pull_request:
    paths:
      - 'tools/audit_moral_actual_native_layout_20261124.py'
      - '.github/workflows/moral-actual-native-layout-20261124.yml'
      - 'web/pendidikan_moral_80_runtime.py'
      - 'web/rph_reference_style_20261121.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash build_jawi.sh
      - run: sudo apt-get update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq libreoffice-writer
      - run: python -m tools.audit_moral_actual_native_layout_20261124
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MORAL_REAL_NATIVE_WORD_PDF_20261124
          path: qa/moral-real-native/
          retention-days: 7
