name: Unified RPH Word-PDF format and PI v2 catalog QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'web/pi_696_catalog_20261121.py'
      - 'web/rph_delivery_presentation_20261121.py'
      - 'web/rph_reference_style_20261121.py'
      - 'web/rph_reference_pdf_style_20261121.py'
      - 'web/rph_premium_header_20261121.py'
      - 'web/rph_equal_width_20261121.py'
      - 'web/unified_rph_web.py'
      - 'tools/run_web_v1_preview.py'
      - 'tests/test_pi_696_catalog_20261121.py'
      - 'tests/test_rph_delivery_presentation_20261121.py'
      - '.github/workflows/web-rph-format-unified-20261121.yml'
  push:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'web/pi_696_catalog_20261121.py'
      - 'web/rph_delivery_presentation_20261121.py'
      - 'web/unified_rph_web.py'
      - 'tools/run_web_v1_preview.py'
      - '.github/workflows/web-rph-format-unified-20261121.yml'
permissions:
  contents: read
jobs:
  native-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production document layout dependencies
        run: pip install 'python-docx==1.1.2' 'PyMuPDF>=1.24.0,<1.27' 'lxml>=5,<7'
      - name: Check source-backed 696 PI menus and no duplicate Premium unit
        run: python -m unittest discover -s tests -p 'test_pi_696_catalog_20261121.py' -v
      - name: Check Word geometry, activity text, content parity and specialty exclusions
        run: python -m unittest discover -s tests -p 'test_rph_delivery_presentation_20261121.py' -v
      - name: Existing PI source and template regressions
        run: python -m unittest discover -s tests -p 'test_pi_696*20261121.py' -v
