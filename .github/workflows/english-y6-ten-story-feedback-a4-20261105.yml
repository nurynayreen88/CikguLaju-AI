name: English Y6 original SOW ten story and feedback A4 QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'rph_standalone/english/year6/lesson_1[12][0-9].md'
      - 'tests/test_english_y6_story_review_113_124_20261105.py'
      - '.github/workflows/english-y6-ten-story-feedback-a4-20261105.yml'
      - 'tools/verify_english_800_native_pdf_contract_20261104.py'
      - 'tools/verify_english_y4_y6_a4_20261104.py'
permissions: {contents: read}
jobs:
  source-pdf-a4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LESSONS: '113,114,115,116,118,119,120,121,123,124'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check 10 KPM fixed-SOW source tasks and preserved cross-lesson drafts
        run: python -m unittest discover -s tests -p 'test_english_y6_story_review_113_124_20261105.py' -v
      - name: Install native ReportLab renderer test dependencies
        run: python -m pip install reportlab==4.2.5 pypdf==5.1.0
      - name: Build 10 source-linked native PDF documents
        run: python tools/verify_english_800_native_pdf_contract_20261104.py --year 6 --lessons "$LESSONS"
      - name: Check 10 one-page A4 native PDF layouts
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('output/english_2_6_native_pdf_smoke_20261104/year6/native_pdf_report.json')
          d=json.loads(p.read_text())
          ids={int(x) for x in os.environ['LESSONS'].split(',')}
          rows=d['results']
          assert len(rows)==10 and {x['lesson'] for x in rows}==ids,rows
          assert all(x['pages']==1 and x['a4'] and not x.get('error') for x in rows),rows
          print('KPM SOW ten story native PDF RPH: 10/10 one-page A4')
          PY
      - name: Save PDF test measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-y6-ten-story-native-pdf-report
          path: output/english_2_6_native_pdf_smoke_20261104/year6/native_pdf_report.json
          retention-days: 14
  source-word-a4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LESSONS: '113,114,115,116,118,119,120,121,123,124'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Word source QA packages and bounded LibreOffice dependency
        run: |
          python -m pip install python-docx==1.1.2 pypdf==5.1.0
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo timeout 120s apt-get update -qq
            sudo timeout 180s apt-get install -y --no-install-recommends libreoffice-writer
          fi
      - name: Build original source-locked Word documents (10 lessons)
        run: python tools/verify_english_y4_y6_a4_20261104.py --year 6 --lessons "$LESSONS"
      - name: Check ten one-page A4 Word documents with no lost text
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('output/english_y4_y6_word_a4_20261104/year6/report.json')
          d=json.loads(p.read_text())
          ids={int(x) for x in os.environ['LESSONS'].split(',')}
          rows=d['lessons']
          assert len(rows)==10 and {x['lesson'] for x in rows}==ids
          assert d['lesson_total']==10 and d['compact_one_page_a4']==10,d
          for x in rows:
              assert x['compact']['pages']==1 and x['compact']['a4'],x
              assert x['raw']['source_text']==x['compact']['source_text'],x
          print('KPM SOW ten story native Word RPH: 10/10 one-page A4 and preserved source')
          PY
      - name: Save Word test measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-y6-ten-story-native-word-report
          path: output/english_y4_y6_word_a4_20261104/year6/report.json
          retention-days: 14
