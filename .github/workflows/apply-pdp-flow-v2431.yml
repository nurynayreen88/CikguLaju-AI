name: Apply CikguLaju flow updates

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-pdp-flow-v2431.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply audited flow patches
        run: |
          python tools/patch_pdp_flow_v2431.py app.py
          python tools/patch_hierarchical_curriculum_flow_v2432.py app.py
          python tools/patch_global_month_calendar_v2433.py app.py
          python tools/patch_manual_class_fallback_v2434.py app.py
          python tools/patch_button_time_range_v2435.py app.py
          python tools/patch_lesson_only_flow_v2436.py app.py
          python tools/patch_calendar_force_v2437.py app.py
          python tools/patch_replace_legacy_date_picker_v2438.py app.py
          python tools/patch_restore_class_time_continuation_v2439.py app.py
          python tools/patch_remove_page_step_v2440.py app.py
          python -m py_compile app.py
          python - <<'PY'
          import ast, pathlib, re
          s=pathlib.Path('app.py').read_text(encoding='utf-8'); ast.parse(s)
          for v in ('v24.31 PDP FLOW STATE AUDIT GUARD','v24.32 HIERARCHICAL CURRICULUM FLOW','v24.33 GLOBAL MONTH CALENDAR','v24.34 MANUAL CLASS FALLBACK','v24.35 BUTTON TIME RANGE SELECTOR','v24.36 LESSON ONLY FLOW','v24.37 FORCE MONTHLY CALENDAR','v24.38 LEGACY DATE PICKER REPLACED','v24.39 CLASS + TIME CONTINUATION REPAIR','v24.40 REMOVE PAGE SELECTION STEP'):
              assert s.count(v)==1, v
          assert "['Ah','Is','Se','Ra','Kh','Ju','Sa']" in s
          assert 'cal37_pick_' in s and 'cal37_month_' in s
          assert "ss['_pdp_context_ready_v2393']=True" in s
          assert "'✏️ Masukkan Kelas Manual'" in s
          assert "return _lesson_to_class_v2439(cid)" in s
          assert "return _lesson_entry_v2440(cid)" in s
          assert not re.search(r'(?s)def _pdp_pick_date_v2393\(cid\):.*?dates=\[today\+timedelta\(days=i\) for i in range\((?:7|14)\)\]',s)
          print('QA PASS',len(s.encode('utf-8')))
          PY
      - name: Commit patched app.py
        run: |
          if git diff --quiet -- app.py; then echo 'app.py already patched'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Remove separate textbook page selection step'
          git push origin HEAD:main

# Trigger v24.31-v24.40 audited flow updates.
