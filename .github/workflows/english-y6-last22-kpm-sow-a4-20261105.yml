name: English Y6 last 22 fixed-SOW source and A4 document audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'rph_standalone/english/year6/lesson_1[2-5][0-9].md'
      - 'tests/test_english_y6_last22_sow_tasks_20261105.py'
      - '.github/workflows/english-y6-last22-kpm-sow-a4-20261105.yml'
permissions: {contents: read}
jobs:
  source-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      LESSONS: '125,126,129,130,131,132,134,135,136,137,139,140,141,142,145,146,147,148,150,151,152,153'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test 22 original KPM SOW source fixes and draft boundaries
        run: python -m unittest discover -s tests -p 'test_english_y6_last22_sow_tasks_20261105.py' -v
      - name: Install source-locked ReportLab test dependencies
        run: python -m pip install reportlab==4.2.5 pypdf==5.1.0
      - name: Build 22 source-backed native PDFs
        run: python tools/verify_english_800_native_pdf_contract_20261104.py --year 6 --lessons "$LESSONS"
      - name: Require every PDF to be exactly one page A4
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('output/english_2_6_native_pdf_smoke_20261104/year6/native_pdf_report.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          nums={int(n) for n in os.environ['LESSONS'].split(',')}
          rows=r['results']
          assert len(rows)==22 and {x['lesson'] for x in rows}==nums,rows
          assert all(x.get('pages')==1 and x.get('a4') and not x.get('error') for x in rows),rows
          print('22/22 fixed-SOW English Year6 source PDF documents: one-page A4')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-y6-last22-source-pdf-a4
          path: output/english_2_6_native_pdf_smoke_20261104/year6/native_pdf_report.json
          retention-days: 14
  source-word:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: a
            lessons: '125,126,129,130,131,132,134,135,136,137,139'
          - part: b
            lessons: '140,141,142,145,146,147,148,150,151,152,153'
    env:
      LESSONS: ${{ matrix.lessons }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install isolated Word conversion requirements
        run: |
          python -m pip install python-docx==1.1.2 pypdf==5.1.0
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo timeout 120s apt-get update -qq
            sudo timeout 180s apt-get install -y --no-install-recommends libreoffice-writer
          fi
      - name: Generate original native Word documents for exactly eleven lessons
        run: python tools/verify_english_y4_y6_a4_20261104.py --year 6 --lessons "$LESSONS"
      - name: Require eleven one-page A4 Word files with exact source text preservation
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('output/english_y4_y6_word_a4_20261104/year6/report.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          expected={int(n) for n in os.environ['LESSONS'].split(',')}
          rows=r['lessons']
          assert len(expected)==11 and len(rows)==11 and r['compact_one_page_a4']==11,r
          assert {x['lesson'] for x in rows}==expected
          for x in rows:
              assert x['compact']['pages']==1 and x['compact']['a4'],x
              assert x['raw']['source_text']==x['compact']['source_text'],x
          print('English Year6 11/11 native Word A4: content preserved')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-y6-last22-word-${{ matrix.part }}
          path: output/english_y4_y6_word_a4_20261104/year6/report.json
          retention-days: 14
