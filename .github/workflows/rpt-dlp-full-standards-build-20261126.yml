name: Build ten DLP unified cover and full statements free PDFs
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - '.github/workflows/rpt-dlp-full-standards-build-20261126.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rpt-dlp-unified-cover-full-standards-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - name: Generate ten free RPT PDF release candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from hashlib import sha256
          from concurrent.futures import ThreadPoolExecutor
          import json,fitz
          from tools.build_rpt_dlp_full_standards_20261126 import render,PINS,SUBJECTS,document_path,ROOT
          root=Path(ROOT)
          output=root/"full_standards_dlp_pdf_2027"
          output.mkdir(parents=True,exist_ok=True)
          def build(key,digest):
              subject,y=key.split(":");year=int(y)
              old=document_path(subject,year,root=root/"dlp")
              assert sha256(old.read_bytes()).hexdigest()==digest
              with TemporaryDirectory() as temp:
                  render(subject,year,Path(temp))
                  candidate=Path(temp)/f"RPT_{subject}_Year_{year}_2027.pdf"
                  data=candidate.read_bytes()
                  with fitz.open(candidate) as b:
                      cover=b[0].get_text()
                      assert "LOGO SEKOLAH" in cover and "NAMA SEKOLAH" in cover and "NAMA GURU" in cover
                      assert "Main school breaks" not in cover and "Main school breaks" in b[-1].get_text()
                      entry={"path":f"{subject}/tahun_{year}.pdf","source_sha256":digest,
                             "sha256":sha256(data).hexdigest(),"bytes":len(data),"pages":len(b)}
                      dest=output/entry["path"];dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
                  return key,entry
          with ThreadPoolExecutor(max_workers=2) as pool:
              entries=dict(f.result() for f in [pool.submit(build,k,v) for k,v in PINS.items()])
          assert len(entries)==10 and len(list(output.rglob("*.pdf")))==10 and not list(output.rglob("*.docx"))
          (output/"manifest.json").write_text(json.dumps({"version":1,"status":"LAYOUT_QA_CANDIDATE","count":10,"files":entries},indent=2)+"\n")
          PY
      - name: Commit only free unpersonalized PDFs to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rpt_2027/full_standards_dlp_pdf_2027
          git diff --cached --name-only | python -c 'import sys; p=sys.stdin.read().splitlines(); assert len(p)==11 and all(s.startswith("rpt_2027/full_standards_dlp_pdf_2027/") and (s.endswith(".pdf") or s.endswith("/manifest.json")) for s in p)'
          git commit -m "build(rpt): ten unified DLP full-standard free PDF candidates"
          git push origin HEAD:refs/heads/feat/rpt-dlp-unified-cover-full-standards-20261126
