name: English Y6 eight KPM SOW music and film Word/PDF QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'rph_standalone/english/year6/lesson_10[2-9].md'
      - 'rph_standalone/english/year6/lesson_110.md'
      - 'tests/test_english_y6_8_music_film_source_102_110_20261105.py'
      - '.github/workflows/english-y6-8-music-film-a4-20261105.yml'
      - 'tools/verify_english_800_native_pdf_contract_20261104.py'
      - 'tools/verify_english_y4_y6_a4_20261104.py'
permissions: {contents: read}
jobs:
  eight-sow-source-a4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LESSONS: '102,103,104,105,107,108,109,110'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run official 8-Lesson source and non-release regression
        run: python -m unittest discover -s tests -p 'test_english_y6_8_music_film_source_102_110_20261105.py' -v
      - name: Install isolated PDF and Word QA dependencies
        run: |
          python -m pip install reportlab==4.2.5 python-docx==1.1.2 pypdf==5.1.0
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer >/dev/null
          fi
      - name: Render native ReportLab RPH PDF for precisely 8 new lessons
        run: python tools/verify_english_800_native_pdf_contract_20261104.py --year 6 --lessons "$LESSONS"
      - name: Require 8 actual one-page A4 native PDF files
        run: |
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path('output/english_2_6_native_pdf_smoke_20261104/year6/native_pdf_report.json')
          report=json.loads(p.read_text(encoding='utf-8'))
          rows=report['results']
          ids={int(v) for v in os.environ['LESSONS'].split(',')}
          assert len(rows)==8 and {x['lesson'] for x in rows}==ids,rows
          assert all(x.get('pages')==1 and x.get('a4') and not x.get('error') for x in rows),rows
          print('Eight music/film native RPH PDF layouts: 8/8 A4')
          PY
      - name: Render original source-locked native Word for 8 exact lessons
        run: python tools/verify_english_y4_y6_a4_20261104.py --year 6 --lessons "$LESSONS"
      - name: Require 8 Word one-page A4 without losing any source text
        run: |
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path('output/english_y4_y6_word_a4_20261104/year6/report.json')
          report=json.loads(p.read_text(encoding='utf-8'))
          rows=report['lessons']
          ids={int(v) for v in os.environ['LESSONS'].split(',')}
          assert len(rows)==8 and {x['lesson'] for x in rows}==ids,rows
          assert report['lesson_total']==8 and report['compact_one_page_a4']==8,report
          assert all(x['compact']['pages']==1 and x['compact']['a4']
                     and x['raw']['source_text']==x['compact']['source_text'] for x in rows),rows
          print('Eight music/film native RPH Word layouts: 8/8 one-page A4 with full source text')
          PY
      - name: Upload test measurements only; no user or production database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-y6-eight-music-film-word-pdf-a4
          path: |
            output/english_2_6_native_pdf_smoke_20261104/year6/native_pdf_report.json
            output/english_y4_y6_word_a4_20261104/year6/report.json
          retention-days: 14
