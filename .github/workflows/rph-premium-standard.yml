name: Syarat tetap RPH premium semua subjek

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "app.py"
      - "web/**/*.py"
      - "tests/test_rph*.py"
      - "docs/RPH_PREMIUM_STANDARD_20261121.md"
      - "docs/rph_premium_contract_20261121.json"
      - "docs/LOG_KEMASKINI_BAHAN.md"
      - ".github/workflows/rph-premium-standard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subject-standard:
    name: Kekalkan kotak sama lebar dan daftar semua subjek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight layout contract dependencies
        run: python -m pip install "pytest>=8,<10" "reportlab>=4,<5" "python-docx>=1.1,<2" "pymupdf>=1.24,<2" "lxml>=5,<7"
      - name: Check permanent owner-approved RPH contract
        run: python -m pytest -q tests/test_rph_premium_contract_20261121.py
      - name: Compile registry contract regression test
        run: python -m py_compile tests/test_rph_premium_contract_20261121.py
