name: RPH unified generator compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - "web/rph_unified_engine.py"
      - "dlp_year2_rph.py"
      - "staging/ppki/render_pengurusan_kehidupan.py"
      - "web/rph_premium_header_20261121.py"
      - "web/rph_native_pdf_header_20261121.py"
      - "tests/test_rph_unified_engine_20261123.py"
      - ".github/workflows/rph-unified-generator-20261123.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline document test tools
        run: python -m pip install "pytest>=8,<10" "python-docx>=1.1,<2" "reportlab>=4,<5" "pypdf>=5,<7" "PyMuPDF>=1.24,<2" "flask>=3,<4" "lxml>=5,<7"
      - name: Compile the shared generator and its source adapters
        run: python -m py_compile web/rph_unified_engine.py dlp_year2_rph.py staging/ppki/render_pengurusan_kehidupan.py web/rph_premium_header_20261121.py web/rph_native_pdf_header_20261121.py
      - name: Check same academic content and layout across old vs shared Word PDF paths
        run: python -m pytest -q tests/test_rph_unified_engine_20261123.py
