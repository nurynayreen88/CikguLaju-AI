name: PI active 698 activity quality and source-grounded candidates QA
on:
  pull_request:
    paths:
      - "tools/audit_pi_active_activity_quality_20261125.py"
      - ".github/workflows/pi-active-activity-quality-20261125.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-activity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing Jawi runtime requirements
        run: bash build_jawi.sh
      - name: Compare native RPH activities for every active PI PdP T2-6
        env:
          PYTHONUNBUFFERED: "1"
          CIKGULAJU_WEB_NATIVE_RPH_ENABLED: "0"
        run: python -m tools.audit_pi_active_activity_quality_20261125
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-active-698-activity-quality-qa
          path: qa/pi-activity-quality/audit.json
          if-no-files-found: warn
          retention-days: 7
