name: English Year 4 standalone runtime
on:
  pull_request:
    paths:
      - 'english_standalone_adapter.py'
      - 'web/english_y4_standalone_runtime.py'
      - 'tools/run_telegram_with_curriculum_api.py'
      - 'tests/test_english_y4_standalone_runtime.py'
      - 'tests/test_english_y4_word_pdf_rows.py'
      - '.github/workflows/english-y4-standalone-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'english_standalone_adapter.py'
      - 'web/english_y4_standalone_runtime.py'
      - 'tools/run_telegram_with_curriculum_api.py'
      - 'tests/test_english_y4_standalone_runtime.py'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_english_y4_standalone_runtime.py' -v
          python -m unittest discover -s tests -p 'test_english_y4_word_pdf_rows.py' -v
