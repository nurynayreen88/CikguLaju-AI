name: Web auto school logo Supabase and private profile QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - web/school_logo_candidate.py
      - web/school_directory_store.py
      - web/teacher_profile_routes.py
      - web_v1_static_preview/index.html
      - web_v1_static_preview/teacher-profile.js
      - tests/test_web_auto_school_logo_20261111.py
      - tests/test_school_logo_preview.cjs
      - tests/test_web_teacher_profile_timetable.py
      - .github/workflows/web-auto-school-logo-20261111.yml
  push:
    branches: [feat/web-auto-school-logo-supabase-20261111, production/cikgulaju-web-20261105]
    paths:
      - web/school_logo_candidate.py
      - web/school_directory_store.py
      - web/teacher_profile_routes.py
      - web_v1_static_preview/index.html
      - web_v1_static_preview/teacher-profile.js
      - tests/test_web_auto_school_logo_20261111.py
      - tests/test_school_logo_preview.cjs
      - tests/test_web_teacher_profile_timetable.py
      - .github/workflows/web-auto-school-logo-20261111.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logo-import-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'Flask==3.1.3'
      - name: Python and JavaScript syntax
        run: |
          python -m py_compile web/school_logo_candidate.py web/school_directory_store.py web/teacher_profile_routes.py tests/test_web_auto_school_logo_20261111.py
          node --check web_v1_static_preview/teacher-profile.js
          node tests/test_school_logo_preview.cjs
      - name: Candidate logo and non-destructive existing profile tests
        run: |
          python -m unittest discover -s tests -p 'test_web_auto_school_logo_20261111.py' -v
          python -m unittest discover -s tests -p 'test_web_school_directory_20261111.py' -v
          python -m unittest discover -s tests -p 'test_web_shared_teacher_profile.py' -v
          python -m unittest discover -s tests -p 'test_web_teacher_profile_timetable.py' -v
