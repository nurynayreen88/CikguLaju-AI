name: PJPK source-gap queue checks
on:
  push:
    branches:
      - work/pjpk-source-gap-remediation-v2679
    paths:
      - 'scripts/pjpk_source_gap_queue_v2679.py'
      - 'scripts/pjpk_12_scope_summary_v2680.py'
      - 'scripts/pjpk_entry_worklist_v2681.py'
      - 'scripts/verify_pjpk_batch_v2682.py'
      - 'scripts/pjpk_source_review_packet_v2683.py'
      - 'scripts/validate_pjpk_source_review_v2684.py'
      - 'tests/test_pjpk_12_scope_summary_v2680.py'
      - 'tests/test_pjpk_entry_worklist_v2681.py'
      - 'tests/test_verify_pjpk_batch_v2682.py'
      - 'tests/test_pjpk_source_review_packet_v2683.py'
      - 'tests/test_validate_pjpk_source_review_v2684.py'
      - 'docs/pjpk_batch_audit_v2680.md'
      - 'tests/test_pjpk_source_gap_queue_v2679.py'
      - 'rebuild_pjpk_candidate.py'
      - 'curriculum_sources/pjpk/**'
      - '.github/workflows/pjpk-source-gap-queue-v2679.yml'
  pull_request:
    branches:
      - staging/pjpk-v26-18-review
    paths:
      - 'scripts/pjpk_source_gap_queue_v2679.py'
      - 'scripts/pjpk_12_scope_summary_v2680.py'
      - 'scripts/pjpk_entry_worklist_v2681.py'
      - 'scripts/verify_pjpk_batch_v2682.py'
      - 'scripts/pjpk_source_review_packet_v2683.py'
      - 'scripts/validate_pjpk_source_review_v2684.py'
      - 'tests/test_pjpk_12_scope_summary_v2680.py'
      - 'tests/test_pjpk_entry_worklist_v2681.py'
      - 'tests/test_verify_pjpk_batch_v2682.py'
      - 'tests/test_pjpk_source_review_packet_v2683.py'
      - 'tests/test_validate_pjpk_source_review_v2684.py'
      - 'docs/pjpk_batch_audit_v2680.md'
      - 'tests/test_pjpk_source_gap_queue_v2679.py'
      - 'rebuild_pjpk_candidate.py'
      - 'curriculum_sources/pjpk/**'
      - '.github/workflows/pjpk-source-gap-queue-v2679.yml'
permissions:
  contents: read
jobs:
  queue-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source-gap queue
        run: python -m py_compile scripts/pjpk_source_gap_queue_v2679.py scripts/pjpk_12_scope_summary_v2680.py scripts/pjpk_entry_worklist_v2681.py scripts/verify_pjpk_batch_v2682.py scripts/pjpk_source_review_packet_v2683.py scripts/validate_pjpk_source_review_v2684.py tests/test_pjpk_12_scope_summary_v2680.py tests/test_pjpk_entry_worklist_v2681.py tests/test_verify_pjpk_batch_v2682.py tests/test_pjpk_source_review_packet_v2683.py tests/test_validate_pjpk_source_review_v2684.py pjpk_dskp_evidence_v2676.py
      - name: Test read-only behavior and fail-closed schema
        run: python -m unittest tests.test_pjpk_source_gap_queue_v2679 tests.test_pjpk_12_scope_summary_v2680 tests.test_pjpk_entry_worklist_v2681 tests.test_verify_pjpk_batch_v2682 tests.test_pjpk_source_review_packet_v2683 tests.test_validate_pjpk_source_review_v2684
      - name: Rebuild isolated PJPK candidate database
        run: python rebuild_pjpk_candidate.py
      - name: Generate actionable source-gap review files
        run: |
          mkdir -p artifacts/pjpk-source-gap-queue-v2679
          python scripts/pjpk_source_gap_queue_v2679.py --db pjpk_candidate.db --format csv > artifacts/pjpk-source-gap-queue-v2679/source_gaps.csv
          python scripts/pjpk_source_gap_queue_v2679.py --db pjpk_candidate.db --format json > artifacts/pjpk-source-gap-queue-v2679/source_gaps.json
          python scripts/pjpk_12_scope_summary_v2680.py --db pjpk_candidate.db > artifacts/pjpk-source-gap-queue-v2679/summary_12_scopes.json
          python scripts/pjpk_entry_worklist_v2681.py --db pjpk_candidate.db > artifacts/pjpk-source-gap-queue-v2679/entry_worklist_12_scopes.json
          python scripts/verify_pjpk_batch_v2682.py artifacts/pjpk-source-gap-queue-v2679/source_gaps.json artifacts/pjpk-source-gap-queue-v2679/summary_12_scopes.json artifacts/pjpk-source-gap-queue-v2679/entry_worklist_12_scopes.json > artifacts/pjpk-source-gap-queue-v2679/batch_verification.json
          python scripts/pjpk_source_review_packet_v2683.py --db pjpk_candidate.db --output artifacts/pjpk-source-gap-queue-v2679/source_review_packet_12_scopes.csv
          python -m scripts.validate_pjpk_source_review_v2684 --original artifacts/pjpk-source-gap-queue-v2679/source_review_packet_12_scopes.csv --reviewed artifacts/pjpk-source-gap-queue-v2679/source_review_packet_12_scopes.csv > artifacts/pjpk-source-gap-queue-v2679/review_import_safety.json
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("artifacts/pjpk-source-gap-queue-v2679")
          data = json.loads((root / "source_gaps.json").read_text(encoding="utf-8"))
          rows = list(csv.DictReader((root / "source_gaps.csv").open(encoding="utf-8", newline="")))
          assert data["read_only"] is True
          assert data["production_promoted"] is False
          assert data["queue_count"] == len(rows)
          summary = json.loads((root / "summary_12_scopes.json").read_text(encoding="utf-8"))
          worklist = json.loads((root / "entry_worklist_12_scopes.json").read_text(encoding="utf-8"))
          assert worklist["scope_count"] == 12
          assert worklist["review_rows"] == len(rows)
          assert sum(scope["unique_entries"] for scope in worklist["scopes"]) == worklist["unique_entries"]
          assert worklist["read_only"] is True and worklist["production_promoted"] is False
          assert summary["scope_count"] == 12
          assert summary["read_only"] is True and summary["production_promoted"] is False
          assert summary["review_rows"] == len(rows)
          assert summary["sp_source_review"] + summary["missing_sk_link"] == len(rows)
          assert sum(item["review_rows"] for item in summary["scopes"]) == len(rows)
          print(json.dumps({
              "read_only": data["read_only"],
              "production_promoted": data["production_promoted"],
              "queue_count": data["queue_count"],
              "record_types": dict(sorted({kind: sum(r["record_type"] == kind for r in rows) for kind in {r["record_type"] for r in rows}}.items()))
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload private source-gap queue for review
        uses: actions/upload-artifact@v4
        with:
          name: pjpk-source-gap-queue-v2679
          path: artifacts/pjpk-source-gap-queue-v2679/
          retention-days: 7
