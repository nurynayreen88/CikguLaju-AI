name: Web private Komen Cadangan Supabase reuse QA
on:
  pull_request:
    paths:
      - 'web/web_feedback_routes.py'
      - 'web_v1_static_preview/web-feedback.js'
      - 'web_v1_static_preview/index.html'
      - 'tools/run_web_production.py'
      - 'tests/test_web_private_feedback_20261112.py'
      - '.github/workflows/web-private-feedback-20261112.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'flask==3.1.3'
      - name: Syntax and secure private-feedback regression
        run: |
          python -m py_compile web/web_feedback_routes.py tests/test_web_private_feedback_20261112.py tools/run_web_production.py
          python -m unittest -v tests.test_web_private_feedback_20261112
      - name: Ensure no new public Supabase credentials or service-role script
        run: |
          ! grep -E '(SUPABASE_SECRET_KEY|SUPABASE_SERVICE_ROLE|apikey:|Bearer )' web_v1_static_preview/web-feedback.js
