name: English Year 2 five-Lesson Word A4 runtime safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/english_y2_word_a4_runtime.py'
      - 'tests/test_english_y2_word_a4_runtime.py'
      - 'tools/run_telegram_with_curriculum_api.py'
      - '.github/workflows/english-y2-word-a4-runtime.yml'
permissions: {contents: read}
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install python-docx==1.1.2 pypdf==5.1.0 Flask==3.1.0
      - run: python -m unittest discover -s tests -p 'test_english_y2_word_a4_runtime.py' -v
      - run: python -m unittest discover -s tests -p 'test_telegram_optional_wsgi.py' -v
      - name: Install LibreOffice if unavailable
        run: |
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer >/dev/null
          fi
      - name: Verify all 160 Year 2 Word A4 outputs with 5 targeted compactions
        run: python tools/verify_english_800_word_a4.py --year 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-y2-word-a4-160-recheck
          path: output/english_full_a4_20261103/year2/verification.json
          retention-days: 7
