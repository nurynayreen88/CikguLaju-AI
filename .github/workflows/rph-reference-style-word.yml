name: RPH Rujukan Sains DLP PPKI - Word Subjek Lain

on:
  pull_request:
    paths:
      - "web/rph_reference_style_20261121.py"
      - "tests/test_rph_reference_style_20261121.py"
      - "tools/run_telegram_with_curriculum_api.py"
      - "tools/diagnose_rph_word_ast_20261121.py"
      - ".github/workflows/rph-reference-style-word.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8,<10" "python-docx>=1.1,<2" "lxml>=5,<7"
      - name: Pastel boxes without modifying RPH or reference subjects
        run: python -m pytest tests/test_rph_reference_style_20261121.py -q
      - name: Diagnose English native Word snapshot mismatch (strict gate unchanged)
        run: python tools/diagnose_rph_word_ast_20261121.py
      - name: Compile production integration
        run: python -m py_compile web/rph_reference_style_20261121.py tools/run_telegram_with_curriculum_api.py
