name: RPH Minggu Ini unit tests
on:
  pull_request:
    paths:
      - 'rph_weekly_*.py'
      - 'tests/test_rph_weekly_*.py'
      - '.github/workflows/rph-weekly-tests.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile weekly modules
        run: python -m compileall -q rph_weekly_*.py tests/test_rph_weekly_*.py
      - name: Run weekly unit tests
        run: python -m unittest discover -s tests -p 'test_rph_weekly_*.py' -v
