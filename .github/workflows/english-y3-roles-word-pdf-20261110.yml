name: English Year 3 role layout and native Word PDF QA
on:
  push:
    branches:
      - fix/english-y3-render-phase-roles-20261110
  pull_request:
    branches: [main]
    paths:
      - 'english_y3_standalone_render.py'
      - 'tests/test_english_y3_render_roles_20261110.py'
      - 'tests/test_english_y3_workbook_in_activity_20261112.py'
      - 'tests/test_english_y3_l17_l20_quality_20261113.py'
      - 'tests/test_english_y3_l21_l24_quality_20261113.py'
      - 'rph_standalone/english/year3/lesson_0*.md'
      - '.github/workflows/english-y3-roles-word-pdf-20261110.yml'
permissions:
  contents: read
jobs:
  y3-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Word and PDF dependencies
        run: python -m pip install python-docx==1.1.2 reportlab==4.2.5 pypdf==5.1.0
      - name: Test Y3 roles, 160 lessons, and existing Y2-Y3 regressions
        run: |
          python -m unittest discover -s tests -p 'test_english_y3_render_roles_20261110.py' -v
          python -m unittest discover -s tests -p 'test_english_y3_workbook_in_activity_20261112.py' -v
          python -m unittest discover -s tests -p 'test_english_y3_l11_l14_quality_20261113.py' -v
          python -m unittest discover -s tests -p 'test_english_y3_l17_l20_quality_20261113.py' -v
          python -m unittest discover -s tests -p 'test_english_y3_l21_l24_quality_20261113.py' -v
          python -m unittest discover -s tests -p 'test_english_y2_y3_rph_render_integrity.py' -v
          python -m unittest discover -s tests -p 'test_english_y3_12_sow_pupil_actions_20261104.py' -v
      - name: Generate actual RPH Word table files with source-backed Y3 rows
        run: |
          python - <<'PY'
          from tempfile import TemporaryDirectory
          from pathlib import Path
          from docx import Document
          from tools.audit_english_rph_word_a4_layout import from_source, write_word, validate_word_function_snapshot
          validate_word_function_snapshot()
          for lesson in (11, 12, 13, 14, 16, 17, 18, 19, 20, 21, 22, 23, 24, 93):
              rows=from_source(3,lesson)
              with TemporaryDirectory() as root:
                  path=Path(root)/f"Y3_{lesson:03d}.docx"
                  write_word(3,lesson,rows,path)
                  doc=Document(path)
                  text="\n".join(cell.text for table in doc.tables for row in table.rows for cell in row.cells)
                  assert "Teacher:" in text and "Pupils:" in text,(lesson,text[:900])
                  assert "NOT READY FOR RELEASE" not in text,(lesson,text[:900])
                  assert "CikguLaju original assessment" not in text,(lesson,text[:900])
                  assert "materials/lesson_014_writing_family_revision.md" not in text,(lesson,text[:900])
                  assert "**Teacher:**" not in text,(lesson,text[:900])
                  assert "PENTAKSIRAN" not in text or "Assessment" in text or "Pentaksiran" in text
                  assert len(doc.tables)>=3,(lesson,len(doc.tables))
                  assert doc.sections[0].page_height and doc.sections[0].page_width
                  print(f"WORD_Y3_L{lesson:03d} VALID bytes={path.stat().st_size} tables={len(doc.tables)}")
          PY
      - name: Render native ReportLab PDF using actual production table builder
        run: python tools/verify_english_800_native_pdf_contract_20261104.py --year 3 --lessons 11,12,13,14,16,17,18,19,20,21,22,23,24,93
      - name: Check native PDF A4 pages and extracted text
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          root=Path("output/english_2_6_native_pdf_smoke_20261104/year3")
          report=json.loads((root/"native_pdf_report.json").read_text(encoding="utf-8"))
          assert report["summary"].get("errors",0)==0,report["errors"]
          for lesson in (11,12,13,14,16,17,18,19,20,21,22,23,24,93):
              path=root/f"Y3_L{lesson:03d}_native_layout.pdf"
              pages=PdfReader(str(path)).pages
              assert len(pages)>=1,(lesson,"no pages")
              if lesson in (11,12,13,14,16,17,18,19,20,21,22,23,24):
                  assert len(pages)==1,(lesson,"RPH exceeds one A4 page",len(pages))
              assert all(abs(float(p.mediabox.width)-595.28)<1.5 and abs(float(p.mediabox.height)-841.89)<1.5 for p in pages)
              text="\n".join(p.extract_text() or "" for p in pages)
              assert "Teacher:" in text and "Pupils:" in text,lesson
              assert "NOT READY FOR RELEASE" not in text,lesson
              assert "CikguLaju original assessment" not in text,lesson
              print(f"PDF_Y3_L{lesson:03d} pages={len(pages)} bytes={path.stat().st_size}")
          PY
      - name: Keep offline PDF diagnostics for academic review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-y3-role-layout-pdf-review
          path: output/english_2_6_native_pdf_smoke_20261104/year3
          retention-days: 14
