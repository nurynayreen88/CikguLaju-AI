name: Render polished DLP tables and audit all current RPT PDFs
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - '.github/workflows/rpt-table-polish-20261126.yml'
permissions:
  contents: read
jobs:
  dlp:
    strategy:
      fail-fast: false
      matrix:
        subject: [mathematics_dlp,science_dlp]
        year: [2,3,4,5,6]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - name: Verify native table and PDF with complete source text
        run: |
          python -m tools.build_rpt_dlp_full_standards_20261126 --subject ${{ matrix.subject }} --year ${{ matrix.year }} --out "$RUNNER_TEMP/private"
          python - <<'PY'
          import os,fitz,re,json,base64
          from pathlib import Path
          from docx import Document
          folder=Path(os.environ["RUNNER_TEMP"])/"private"
          doc=Document(next(folder.glob("*.docx")))
          table=doc.tables[0]
          weeks=list(dict.fromkeys(r.cells[0].text.splitlines()[0] for r in table.rows[1:]))
          assert weeks==[f"Week {i:02d}" for i in range(1,len(weeks)+1)],weeks
          assert all(any(p.text for p in r.cells[1].paragraphs) for r in table.rows[1:])
          assert all(r.cells[2].paragraphs[0].runs[0].bold and r.cells[3].paragraphs[0].runs[0].bold for r in table.rows[1:])
          pdf=fitz.open(next(folder.glob("*.pdf")))
          for page in list(pdf)[1:-1]:
              text=page.get_text()
              assert "Content Standard (CS)" in text and "Learning Standard (LS)" in text,(page.number,text[:200])
              assert "YEARLY TEACHING PLAN 2027 |" not in text
              assert "Group A and Group B | CikguLaju" not in text
              assert re.search(r"Week \d+",text),(page.number,text[:200])
              assert re.search(r"Lesson \d+|Review",text)
          print(json.dumps({"weeks":len(weeks),"rows":len(table.rows)-1,"pages":len(pdf),"result":"PASS"}))
          if "${{ matrix.subject }}:${{ matrix.year }}"=="science_dlp:6":
              for idx in [1,len(pdf)-2,len(pdf)-1]:
                  print("SAMPLE_BEGIN",idx)
                  data=base64.b64encode(pdf[idx].get_pixmap(matrix=fitz.Matrix(1.25,1.25)).tobytes("jpeg")).decode()
                  for i in range(0,len(data),7000):print("SAMPLE_CHUNK",data[i:i+7000])
                  print("SAMPLE_END",idx)
          PY
      - if: always()
        run: rm -rf "$RUNNER_TEMP/private"
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pymupdf==1.26.7'
      - name: Inventory released PDFs without changing any source
        run: |
          python - <<'PY'
          import json,fitz,re
          from pathlib import Path
          root=Path("rpt_2027")
          for folder in sorted(root.iterdir()):
              if not folder.is_dir() or not (folder.name.startswith("compact_") or folder.name in ("full_standards_dlp_pdf_2027","web_2027_pdfs")):continue
              print("AUDIT_FOLDER",folder.name)
              for f in sorted(folder.rglob("*.pdf")):
                  with fitz.open(f) as doc:
                      first=doc[0].get_text()
                      body=[p.get_text() for p in list(doc)[1:]]
                      result={"file":str(f.relative_to(root)),"pages":len(doc),"cover_has_holiday":bool(re.search(r"Main school breaks|Cuti Penggal|Cuti Sekolah|Cuti Akhir",first,re.I)),"blank_body_pages":[i+2 for i,t in enumerate(body) if len(t.strip())<20],"standard_heading":bool(re.search(r"Standard Kandungan|Content Standard|CS / LS|SK / SP", "\n".join(body),re.I)),"first_body_excerpt":(body[0][:180].replace("\n"," ") if body else "")}
                      print(json.dumps(result,ensure_ascii=False))
          PY
