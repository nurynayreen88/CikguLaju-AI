name: RPH premium kotak kecil kiri 9 subjek

on:
  pull_request:
    paths:
      - "web/rph_premium_header_20261121.py"
      - "web/rph_equal_width_20261121.py"
      - "web/rph_reference_style_20261121.py"
      - "tests/test_rph_premium_header_20261121.py"
      - ".github/workflows/rph-premium-header.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8,<10" "python-docx>=1.1,<2" "lxml>=5,<7" "pypdf>=5,<7" "PyMuPDF>=1.24,<2"
      - name: Install A4 renderer
        run: |
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y -qq --no-install-recommends libreoffice-writer fonts-crosextra-carlito
      - name: Check source text, SK/SP, RTL exclusion, and A4
        run: python -m pytest -q tests/test_rph_premium_header_20261121.py tests/test_rph_reference_style_20261121.py
      - name: Compile adapter
        run: python -m py_compile web/rph_premium_header_20261121.py web/rph_reference_style_20261121.py web/rph_equal_width_20261121.py
