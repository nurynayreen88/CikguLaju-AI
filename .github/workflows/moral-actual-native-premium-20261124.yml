name: Moral actual native premium RPH 480 source and 25 A4 sample QA
on:
  pull_request:
    paths:
      - 'tools/audit_moral_480_actual_premium_20261124.py'
      - '.github/workflows/moral-actual-native-premium-20261124.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq libreoffice-writer fonts-noto-core
      - run: bash build_jawi.sh
      - run: python -m tools.audit_moral_480_actual_premium_20261124
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moral-25-actual-native-premium-examples
          path: qa/moral-actual-native/
          retention-days: 7
