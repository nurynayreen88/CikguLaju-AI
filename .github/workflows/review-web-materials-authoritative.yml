name: Web authoritative materials route review
on:
  push:
    branches:
      - review/web-materials-authoritative-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Flask>=3.0,<4'
      - name: Check material route and authoritative adapter
        run: |
          python -m unittest discover -s tests -p 'test_web_materials_authoritative_route.py' -v
          python -m unittest discover -s tests -p 'test_web_authoritative_http_source.py' -v
