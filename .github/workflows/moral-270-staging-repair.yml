name: Moral 270 SP-specific supplemental edits - staging only
on:
  push:
    branches:
      - staging/moral-480-final-source-gate-20261105
    paths:
      - 'scripts/revise_moral_supplement270_sp_semantics_20261105.py'
      - '.github/workflows/moral-270-staging-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.ref == 'refs/heads/staging/moral-480-final-source-gate-20261105'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit 270 source SP and scene records without mutation
        run: python scripts/revise_moral_supplement270_sp_semantics_20261105.py
      - name: Apply scope-limited text improvements to this staging branch only
        run: python scripts/revise_moral_supplement270_sp_semantics_20261105.py --apply
      - name: Refuse release-status or unrelated-file changes
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert len(changed)==270,(len(changed), changed[:10])
          assert all(p.startswith('rph_standalone/pendidikan_moral/pengukuhan/year') and p.endswith('.md') for p in changed)
          print('SAFE SCOPE:',len(changed),'supplementary Moral RPH only; no original DB, app or payment data')
          PY
      - name: Commit only the 270 RPH plus immutable source ledger to staging branch
        run: |
          git config user.name 'CikguLaju Moral staging QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rph_standalone/pendidikan_moral/pengukuhan audits/pendidikan_moral_supplement270_semantic_review_20261105.json
          git diff --cached --check
          git commit -m "Moral: refine all 270 supplementary RPH with SP-specific source scenes"
          git push origin HEAD:refs/heads/staging/moral-480-final-source-gate-20261105
