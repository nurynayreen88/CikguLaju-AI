name: English Workbook safety checks
on:
  push:
    branches:
      - staging/english-wb-isolated-20261031
  pull_request:
    paths:
      - 'tools/apply_verified_workbook.py'
      - 'tools/audit_english_workbook_coverage.py'
      - 'tests/test_english_workbook_applicator.py'
      - '.github/workflows/english-workbook-checks.yml'
  workflow_dispatch:
jobs:
  workbook-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_english_workbook_applicator.py' -v 2>&1 | tee workbook-tests.log
      - name: Audit Year 2 and Year 3 (read-only)
        id: audit
        if: ${{ always() }}
        shell: bash
        run: |
          set -o pipefail
          python tools/audit_english_workbook_coverage.py --review-csv workbook_review.csv 2>&1 | tee workbook-audit.log
      - name: Upload diagnostic logs and audit CSV
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: english-workbook-diagnostics
          path: |
            workbook-tests.log
            workbook-audit.log
            workbook_review.csv
          if-no-files-found: warn
