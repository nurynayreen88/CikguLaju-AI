name: Web English Workbook & Music source-link integration QA
on:
  push:
    branches: [production/cikgulaju-web-20261105, feat/web-english-workbook-music-links-20261106]
    paths:
      - 'web/unified_rph_web.py'
      - 'web/native_telegram_extra_materials_20261106.py'
      - 'web_v1_static_preview/index.html'
      - 'tests/test_web_english_music_extras_20261106.py'
      - '.github/workflows/web-english-music-extra-materials-qa.yml'
  pull_request:
    paths:
      - 'web/unified_rph_web.py'
      - 'web/native_telegram_extra_materials_20261106.py'
      - 'web_v1_static_preview/index.html'
      - 'tests/test_web_english_music_extras_20261106.py'
      - '.github/workflows/web-english-music-extra-materials-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'flask==3.1.3' 'python-docx==1.2.0' 'lxml==5.4.0' 'pypdf==5.1.0'
      - run: PYTHONPATH=tests:. python -m unittest -v tests.test_web_english_music_extras_20261106 tests.test_web_all_subject_unit_parity_20261106
