name: Worksheet generator draft smoke QA
on:
  pull_request:
    branches:
      - 'production/cikgulaju-web-20261105'
    paths:
      - 'worksheets/generator_v1/**'
      - '.github/workflows/worksheet-generator-draft-qa.yml'
  push:
    branches:
      - 'draft/worksheet-generator-batch03-v1'
    paths:
      - 'worksheets/generator_v1/**'
      - '.github/workflows/worksheet-generator-draft-qa.yml'
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name == 'push' || github.head_ref == 'draft/worksheet-generator-batch03-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip install -r worksheets/generator_v1/requirements.txt
      - run: python -m py_compile worksheets/generator_v1/generate.py worksheets/generator_v1/test_generator.py
      - run: python -m unittest discover -s worksheets/generator_v1 -p 'test_generator.py' -v
