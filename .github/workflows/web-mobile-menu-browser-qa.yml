name: Web mobile menu browser QA
on:
  push:
    branches: [fix/web-mobile-menu-grid-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Real Chromium mobile and desktop menu checks
        run: python -m unittest discover -s tests -p test_web_mobile_menu_browser.py -v
      - name: Existing Web sidebar and payment regression
        run: |
          pip install 'flask==3.1.3' 'gunicorn==23.0.0'
          python -m unittest discover -s tests -p test_web_sidebar_navigation.py -v
          python -m unittest discover -s tests -p test_web_payment_proof_first.py -v
