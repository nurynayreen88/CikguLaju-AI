name: BM Web numbered-activity source preservation QA
on:
  push:
    branches: [main, fix/bm-rph-numbered-activities-20261106]
    paths:
      - 'web/telegram_native_bm_sequence_rph_bridge.py'
      - 'tests/test_bm_web_activity_lines_20261106.py'
      - '.github/workflows/bm-web-activity-lines-qa.yml'
  pull_request:
    paths:
      - 'web/telegram_native_bm_sequence_rph_bridge.py'
      - 'tests/test_bm_web_activity_lines_20261106.py'
      - '.github/workflows/bm-web-activity-lines-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'flask==3.1.3' 'python-docx==1.2.0' 'lxml==5.4.0'
      - run: PYTHONPATH=tests:. python -m unittest -v tests.test_bm_web_activity_lines_20261106 tests.test_telegram_native_bm_sequence_rph tests.test_telegram_bm_hierarchy_web
