name: KP2027 BM SJK Tahun 1 52 RPH editorial source and hold QA

on:
  pull_request:
    branches:
      - production/cikgulaju-web-20261105
    paths:
      - 'audits/kp2027_bm_sjk_year1_26sp_52pdp_20261122.json'
      - 'audits/kp2027_bm_sjk_tahun1_52_rph_editorial_qa_20261123.json'
      - 'tests/test_kp2027_bm_sjk_52_rph_editorial_20261123.py'
      - 'audits/kp2027_bm_sjk_official_sp_crosscheck_20261123.json'
      - 'tests/test_kp2027_bm_sjk_official_sp_crosscheck_20261123.py'
      - '.github/workflows/kp2027-bmsjk-52-rph-qa-20261123.yml'
  push:
    branches:
      - 'feature/kp2027-bmsjk-52-rph-qa-20261123'
    paths:
      - 'audits/kp2027_bm_sjk_tahun1_52_rph_editorial_qa_20261123.json'
      - 'tests/test_kp2027_bm_sjk_52_rph_editorial_20261123.py'
      - '.github/workflows/kp2027-bmsjk-52-rph-qa-20261123.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-only-not-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate official DK SP-to-52-PdP provenance
        run: python -m unittest discover -s tests -p 'test_kp2027_bm_sjk_standard_catalog_20261122.py' -v
      - name: Validate 52 distinct pedagogical drafts stay QA HOLD
        run: python -m unittest discover -s tests -p 'test_kp2027_bm_sjk_52_rph_editorial_20261123.py' -v
      - name: Validate 26 original SP codes and preserve HOLD
        run: python -m unittest discover -s tests -p 'test_kp2027_bm_sjk_official_sp_crosscheck_20261123.py' -v
