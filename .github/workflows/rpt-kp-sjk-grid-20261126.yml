name: KP2027 and SJK 21 exact-source fixed-grid private QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/build_rpt_kp_sjk_grid_20261126.py'
      - '.github/workflows/rpt-kp-sjk-grid-20261126.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scope: [kp, 'sjkc:bahasa-cina', 'sjkc:bahasa-melayu', 'sjkc:sains', 'sjkc:matematik', 'sjkt:matematik']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk fonts-noto-core fonts-liberation
      - run: python -m tools.build_rpt_kp_sjk_grid_20261126 '${{ matrix.scope }}'
