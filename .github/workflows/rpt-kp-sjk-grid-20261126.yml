name: KP2027 and SJK 21 native teaching-table fixed grid QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/rpt_existing_table_grid_20261126.py'
      - 'tools/qa_rpt_kp_sjk_grid_20261126.py'
      - '.github/workflows/rpt-kp-sjk-grid-20261126.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [kp,sjkc,sjkt]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation fonts-noto-cjk fonts-noto-core
      - run: python -m tools.qa_rpt_kp_sjk_grid_20261126 ${{ matrix.group }}
