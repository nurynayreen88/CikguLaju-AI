name: Sejarah 2027 RPH-RPT PDF Preview QA
on:
  pull_request:
    paths:
      - 'rph_standalone/sejarah/**'
      - 'rpt_2027/sejarah/**'
      - 'scripts/render_sejarah_pdf_preview_2027.py'
      - '.github/workflows/sejarah_pdf_preview_2027_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PDF renderer and reader
        run: python -m pip install 'weasyprint==62.3' 'pydyf==0.10.0' 'pypdf==5.1.0'
      - name: Render and check six real A4 PDF previews
        run: python scripts/render_sejarah_pdf_preview_2027.py
      - name: Archive preview PDFs for internal visual approval only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sejarah-Y4-Y6-2027-RPH-RPT-DRAF-PDF-Preview
          path: output/sejarah_pdf_preview_qa/*.pdf
          if-no-files-found: error
