name: RPT 2027 - 56 live-PDF week coverage audit
on:
  pull_request:
    branches:
      - production/cikgulaju-web-20261105
    paths:
      - 'scripts/audit_web_rpt2027_pdf_weeks_20261110.py'
      - '.github/workflows/rpt2027-web-pdf-week01-audit-20261110.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpt-week-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF==1.24.14'
      - run: python -m py_compile scripts/audit_web_rpt2027_pdf_weeks_20261110.py
      - name: Audit actual catalog PDFs, dates, and first school week
        run: python scripts/audit_web_rpt2027_pdf_weeks_20261110.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpt2027-week-labels-56-live-pdf
          retention-days: 30
          path: output/rpt2027_week_audit_20261110.json
