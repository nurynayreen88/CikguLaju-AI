name: RPH 4 Kumpulan - EMK PAK21 KBAT Pemulihan Pengayaan

on:
  pull_request:
    paths:
      - 'web/rph_supporting_fields_20261121.py'
      - 'dlp_year2_rph.py'
      - 'tests/test_rph_supporting_fields_20261121.py'
      - '.github/workflows/rph-supporting-fields-20261121.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-families:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Word and PDF test dependencies
        run: python -m pip install --disable-pip-version-check pytest python-docx pypdf reportlab lxml
      - name: Verify 4 families, source evidence and printed A4
        run: python -m pytest -q tests/test_rph_supporting_fields_20261121.py
      - name: Syntax validation
        run: python -m py_compile dlp_year2_rph.py web/rph_supporting_fields_20261121.py
