name: Sains SK Opening Pedagogy EMK KBAT PAK21

on:
  pull_request:
    paths:
      - "web/sains_y3_unit_awal.py"
      - "web/sains_unit_awal.py"
      - "web/sains_opening_pedagogy_20261121.py"
      - "tests/test_sains_opening_pedagogy_20261121.py"
      - "tests/test_sains_opening_real_word_a4_20261121.py"
      - ".github/workflows/sains-opening-pedagogy-20261121.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opening-pedagogy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install unit-test tool
        run: python -m pip install --disable-pip-version-check "pytest>=8,<10" "flask>=3.1,<4" "lxml>=5,<7" "python-docx>=1.1,<2" "pypdf>=5,<7"
      - name: Validate curriculum/activity/PBD identity in every opening PdP
        run: python -m pytest tests/test_sains_opening_pedagogy_20261121.py tests/test_sains_unit_awal.py tests/test_sains_y3_unit_awal.py -q
      - name: Install real Word-to-PDF converter
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends libreoffice-writer fonts-crosextra-carlito
      - name: Check app.py native Word function, source fields and three A4 PDFs
        run: python -m pytest tests/test_sains_opening_real_word_a4_20261121.py -q
      - name: Compile source modules
        run: python -m py_compile web/sains_y3_unit_awal.py web/sains_unit_awal.py web/sains_opening_pedagogy_20261121.py
