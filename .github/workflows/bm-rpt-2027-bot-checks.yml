name: BM RPT 2027 PDFs - Telegram entitlement and isolation
on:
  push:
    branches:
      - feat/rpt-bm-2027-pdf-telegram-20261104
      - feat/bm-rpt-2026-layout-20261104
    paths:
      - 'rpt_2027/bahasa_melayu/**'
      - 'rpt_2027/english/telegram_downloads.py'
      - 'tools/run_telegram_with_curriculum_api.py'
      - 'tests/test_bm_rpt_2027_telegram_downloads.py'
      - '.github/workflows/bm-rpt-2027-bot-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rpt_2027/bahasa_melayu/**'
      - 'rpt_2027/english/telegram_downloads.py'
      - 'tools/run_telegram_with_curriculum_api.py'
      - 'tests/test_bm_rpt_2027_telegram_downloads.py'
      - '.github/workflows/bm-rpt-2027-bot-checks.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime-free test dependencies
        run: python -m pip install 'Flask>=3.0,<4' 'pypdf==5.1.0'
      - name: Compile callback modules
        run: |
          python -m py_compile rpt_2027/bahasa_melayu/telegram_downloads.py rpt_2027/english/telegram_downloads.py tools/run_telegram_with_curriculum_api.py
      - name: Run BM, English and WSGI isolation checks
        run: |
          python -m unittest discover -s tests -p 'test_bm_rpt_2027_telegram_downloads.py' -v
          python -m unittest discover -s tests -p 'test_english_rpt_2027_telegram_downloads.py' -v
          python -m unittest discover -s tests -p 'test_telegram_optional_wsgi.py' -v
      - name: Verify all five PDF files and exact PdP counts
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          import re
          root=Path("rpt_2027/bahasa_melayu")
          expected={2:164,3:165,4:165,5:166,6:165}
          for year, n in expected.items():
              path=root/f"RPT_Bahasa_Melayu_Tahun_{year}_2027_DRAF.pdf"
              assert path.is_file() and path.stat().st_size>50000, path
              assert path.read_bytes()[:5]==b"%PDF-", path
              pdf=PdfReader(str(path))
              assert all(float(p.mediabox.width)>float(p.mediabox.height) for p in pdf.pages)
              content="\n".join((p.extract_text() or "") for p in pdf.pages)
              found={int(x) for x in re.findall(r"PdP\s+(\d{3})\b", content)}
              assert set(range(1,n+1)).issubset(found), (year,n,len(found))
              print("OK", year,n,"PdP",len(pdf.pages),"landscape pages")
          PY
