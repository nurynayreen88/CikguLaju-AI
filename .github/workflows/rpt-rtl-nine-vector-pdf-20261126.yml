name: Verify nine RTL original vector PDF downloads
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'rpt_2027/compact_rtl_pdf_2027/**'
      - 'web/rpt_compact_pdf.py'
      - 'web/rpt_2027_all_http.py'
      - 'web_v1_static_preview/rpt-personalize.js'
      - 'tests/test_rpt_compact_rtl_pdf.py'
      - '.github/workflows/rpt-rtl-nine-vector-pdf-20261126.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: python -m unittest discover -s tests -p 'test_rpt_compact*pdf.py' -v
