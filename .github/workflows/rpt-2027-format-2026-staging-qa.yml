name: RPT 2027 staged 21-PDF QA plus 3 RBT simulations
on:
  pull_request:
    paths:
      - 'rpt_2027/common/format_2026_layout_preview.py'
      - 'rpt_2027/common/standard_text_enrichment.py'
      - 'rpt_2027/common/calendar_week_2027_a_b_snapshot_20261107_DRAF.json'
      - 'rpt_2027/common/calendar_week_mapping_staging.py'
      - 'rpt_2027/common/sejarah_source_enrichment_staging.py'
      - 'rpt_2027/common/sejarah_group_a_2027_03_14_holiday_index_evidence_DRAF.json'
      - 'audits/sejarah_y4_y6_primary_textbook_page_evidence_20261106.json'
      - 'scripts/audit_rpt_2027_calendar_master_staging.py'
      - 'tests/test_rpt_2027_calendar_master_staging.py'
      - 'curriculum/sejarah/y*_dskp_crosswalk_DRAF.json'
      - 'rpt_2027/pendidikan_moral/year*_crosswalk_DSKP.json'
      - 'rpt_2027/psv/dskp_full_standard_texts_y*_20261107_DRAF.json'
      - 'rpt_2027/rbt/dskp_full_standard_texts_y*_20261107_DRAF.json'
      - 'rpt_2027/pjpk/dskp_full_standard_texts_y*_20261107_DRAF.json'
      - 'scripts/build_rpt_2027_standard_preview.py'
      - 'scripts/build_rpt_2027_second_batch_preview.py'
      - 'scripts/build_rpt_2027_rbt_32_week_illustration.py'
      - 'rpt_2027/common/rbt_truncated_title_guard_staging.py'
      - 'tests/test_rpt_2027_rbt_truncated_titles.py'
      - 'scripts/verify_rbt_t4_textbook_pages_offline.py'
      - 'audits/rbt_t4_actual_pdf_page_code_verification_20261107.md'
      - 'tests/test_rpt_2027_rbt_32_week_illustration.py'
      - 'audits/rbt_y4_y6_dskp_full_standard_text_audit_20261107.md'
      - 'tests/test_rpt_2027_second_batch_preview.py'
      - 'rpt_2027/sejarah/RPT_SEJARAH_TAHUN_*_2027_A_B_DRAF.csv'
      - 'rpt_2027/pjpk/pjpk_2027_rpt_manifest.json'
      - 'tests/test_rpt_2027_standard_2026_layout_preview.py'
      - '.github/workflows/rpt-2027-format-2026-staging-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'reportlab==4.2.5' 'pypdf==5.1.0' 'PyMuPDF==1.24.14'
      - run: python -m py_compile rpt_2027/common/format_2026_layout_preview.py scripts/build_rpt_2027_standard_preview.py scripts/build_rpt_2027_second_batch_preview.py rpt_2027/common/standard_text_enrichment.py rpt_2027/common/calendar_week_mapping_staging.py scripts/audit_rpt_2027_calendar_master_staging.py rpt_2027/common/sejarah_source_enrichment_staging.py scripts/build_rpt_2027_rbt_32_week_illustration.py rpt_2027/common/rbt_truncated_title_guard_staging.py scripts/verify_rbt_t4_textbook_pages_offline.py
      - name: Audit source and render each of the 13 A4 landscape PDFs
        run: python -m unittest tests.test_rpt_2027_standard_2026_layout_preview tests.test_rpt_2027_second_batch_preview tests.test_rpt_2027_calendar_master_staging tests.test_rpt_2027_rbt_32_week_illustration tests.test_rpt_2027_rbt_truncated_titles -v
      - name: Audit calendar against central 2027 week master (read-only)
        run: python -m scripts.audit_rpt_2027_calendar_master_staging
      - name: Build named reviewer previews (not live downloads)
        run: |
          python -m scripts.build_rpt_2027_standard_preview
          python -m scripts.build_rpt_2027_second_batch_preview
          python - <<'PY'
          from pathlib import Path
          import fitz
          root=Path('staging/rpt_2027_seragam_2026/pdf')
          pdfs=sorted(root.glob('*.pdf'))
          assert len(pdfs)==21, len(pdfs)
          for f in pdfs:
              with fitz.open(f) as pdf:
                  assert pdf.page_count>1, f
                  for i,page in enumerate(pdf):
                      assert page.rect.width>page.rect.height, (f, i)
                      text = page.get_text()
                      # A DSKP bullet previously became U+0000 in PJPK/PSV.
                      assert '\\x00' not in text, (f, i, "blank/control glyph")
                      for block in page.get_text("blocks"):
                          x0,y0,x1,y1 = block[:4]
                          assert 0 <= x0 <= x1 <= page.rect.width, (f, i, "text outside horizontal page")
                          assert 0 <= y0 <= y1 <= page.rect.height, (f, i, "text outside vertical page")
                  cover=pdf[0].get_text()
                  for required in ("RANCANGAN PENGAJARAN TAHUNAN 2027",
                                   "NAMA SEKOLAH", "NAMA GURU", "LOGO SEKOLAH"):
                      assert required in cover, (f, "missing cover field", required)
                  for forbidden in ("ALAMAT SEKOLAH", "NEGERI / KUMPULAN", "KUMPULAN A",
                                    "KUMPULAN B", "DRAF SEMAKAN", "Halaman 1"):
                      assert forbidden not in cover, (f, "extra cover field", forbidden)
                  coverpix=pdf[0].get_pixmap(matrix=fitz.Matrix(1.4,1.4),alpha=False)
                  coverpix.save(str(f.with_suffix('.cover.png')))
                  pix=pdf[1].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
                  pix.save(str(f.with_suffix('.page2.png')))
          PY
      - name: Generate separate explicitly unapproved RBT example schedules
        run: |
          python -m scripts.build_rpt_2027_rbt_32_week_illustration
          python - <<'PY'
          from pathlib import Path
          import fitz
          root=Path('staging/rpt_2027_seragam_2026/rbt_32week_SIMULASI')
          files=sorted(root.glob('*.pdf'))
          assert len(files)==3, files
          for file in files:
              assert 'SIMULASI_BUKAN_FINAL' in file.name
              with fitz.open(file) as doc:
                  assert doc.page_count>1
                  assert all(p.rect.width>p.rect.height for p in doc)
                  cover=doc[0].get_text()
                  assert all(t in cover for t in ('NAMA GURU','NAMA SEKOLAH','LOGO SEKOLAH'))
                  body='\\n'.join(p.get_text() for p in list(doc)[1:])
                  assert 'M03 (SIMULASI)' in body and 'M34 (SIMULASI)' in body
                  assert 'bukan tarikh kelas sebenar' in ' '.join(body.split())
                  assert not any('\\x00' in p.get_text() for p in doc)
                  for p in doc:
                      for b in p.get_text('blocks'):
                          x0,y0,x1,y1=b[:4]
                          assert 0<=x0<=x1<=p.rect.width and 0<=y0<=y1<=p.rect.height
                  doc[0].get_pixmap(matrix=fitz.Matrix(1.4,1.4),alpha=False).save(
                      str(file.with_suffix('.cover.png')))
                  doc[1].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(
                      str(file.with_suffix('.page2.png')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RPT2027-21-asal-dan-3-RBT-simulasi-DRAF
          path: |
            staging/rpt_2027_seragam_2026/pdf/*.pdf
            staging/rpt_2027_seragam_2026/pdf/*.png
            staging/rpt_2027_seragam_2026/audit_calendar_week_alignment.json
            staging/rpt_2027_seragam_2026/rbt_32week_SIMULASI/*.pdf
            staging/rpt_2027_seragam_2026/rbt_32week_SIMULASI/*.png
          if-no-files-found: error
          retention-days: 14
