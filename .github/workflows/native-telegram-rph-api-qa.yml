name: Native Telegram RPH API QA
on:
  push:
    branches: [feature/telegram-internal-rph-api-20261105, feature/telegram-db-rph-bridge-bm-pi-20261106, fix/telegram-native-rph-overlay-guards-20261108]
    paths:
      - web/native_rph_telegram_api.py
      - web/english_y1_kssr_rph.py
      - tests/test_english_y1_kssr_native.py
      - web/telegram_verified_rpt_rph_bridge.py
      - web/telegram_verified_sequence_rph_bridge.py
      - web/sains_y3_unit_awal.py
      - tests/test_sains_y3_unit_awal.py
      - web/sains_unit_awal.py
      - tests/test_sains_unit_awal.py
      - web/pi_navigation.py
      - web_v1_dropdown_catalog.py
      - web_v1_verified_pdp.py
      - tests/test_telegram_unit_navigation.py
      - tests/test_telegram_verified_rpt_rph_bridge.py
      - tests/test_telegram_verified_sequence_rph_bridge.py
      - tools/run_telegram_with_curriculum_api.py
      - tests/test_native_telegram_rph_api.py
      - .github/workflows/native-telegram-rph-api-qa.yml
  workflow_dispatch:
  pull_request:
    paths:
      - web/rph_teacher_reflection.py
      - web/native_rph_telegram_api.py
      - web/english_y1_kssr_rph.py
      - tests/test_english_y1_kssr_native.py
      - web/telegram_verified_rpt_rph_bridge.py
      - web/telegram_verified_sequence_rph_bridge.py
      - web/sains_y3_unit_awal.py
      - tests/test_sains_y3_unit_awal.py
      - web/sains_unit_awal.py
      - tests/test_sains_unit_awal.py
      - web/pi_navigation.py
      - web_v1_dropdown_catalog.py
      - web_v1_verified_pdp.py
      - tests/test_telegram_unit_navigation.py
      - web/telegram_native_bm_sequence_rph_bridge.py
      - web/rbt_2027_native_api.py
      - web/sejarah_2027_native_api.py
      - web/telegram_provisional_arab_music_api.py
      - tools/run_telegram_with_curriculum_api.py
      - tests/test_native_telegram_rph_api.py
      - .github/workflows/native-telegram-rph-api-qa.yml
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flask==3.1.3 python-docx==1.2.0
      - name: Verify no Telegram webhook or quota changes, Word/PDF native calling
        run: |
          python -m py_compile web/native_rph_telegram_api.py tools/run_telegram_with_curriculum_api.py
          python -m unittest discover -s tests -p test_native_telegram_rph_api.py -v
          python -m py_compile web/telegram_verified_rpt_rph_bridge.py web/telegram_verified_sequence_rph_bridge.py
          python -m unittest discover -s tests -p test_telegram_verified_rpt_rph_bridge.py -v
          python -m unittest discover -s tests -p test_telegram_verified_sequence_rph_bridge.py -v
          python -m unittest discover -s tests -p test_telegram_bm_hierarchy_web.py -v
          python -m unittest discover -s tests -p test_telegram_unit_navigation.py -v
          python -m unittest discover -s tests -p test_sains_y3_unit_awal.py -v
          python -m unittest discover -s tests -p test_sains_unit_awal.py -v
          python -m unittest discover -s tests -p test_sains_native_runtime_readiness_probe_20261108.py -v
          python -m unittest discover -s tests -p test_english_y1_kssr_native.py -v
