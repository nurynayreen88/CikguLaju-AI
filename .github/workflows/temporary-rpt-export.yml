name: Export RPT PDFs for QA
on:
  push:
    branches:
      - audit/rpt2027-bm-pjpk-pdf-source-20261104
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: rpt-pdf-and-source
          path: |
            rpt_2027/bahasa_melayu/*.pdf
            rpt_2027/bahasa_melayu/*.html
            rpt_2027/pjpk/*.pdf
            rpt_2027/pjpk/pjpk_2027_rpt_manifest.json
          retention-days: 1
