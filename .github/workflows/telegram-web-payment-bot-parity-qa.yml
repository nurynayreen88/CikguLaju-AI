name: Telegram bot identity payment parity QA
on:
  push:
    branches: [feature/telegram-web-payment-bot-parity-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'flask==3.1.3' 'requests==2.32.3'
      - run: python -m py_compile web/telegram_payment_source.py
      - run: python -m unittest discover -s tests -p test_telegram_web_payment_entry.py -v
