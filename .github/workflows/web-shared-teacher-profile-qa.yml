name: Shared Teacher Profile Web QA
on:
  push:
    branches:
      - feature/web-profile-shared-ui-copy-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask==3.1.3
      - name: Validate common Telegram and Web teacher profile, timetable, and copy
        run: |
          python -m py_compile web/teacher_profile_store.py web/teacher_profile_routes.py
          python -m unittest discover -s tests -p 'test_web_shared_teacher_profile.py' -v
          python -m unittest discover -s tests -p 'test_web_teacher_profile_timetable.py' -v
          python -m unittest discover -s tests -p 'test_web_saved_classes.py' -v
          python -m unittest discover -s tests -p 'test_web_sidebar_navigation.py' -v
          python -m unittest discover -s tests -p 'test_web_unified_rph_preview.py' -v
      - name: Verify Web scripts
        run: |
          node --check web_v1_static_preview/teacher-profile.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('web_v1_static_preview/index.html').read_text(encoding='utf8')
          js=re.findall(r'<script>\s*(.*?)\s*</script>',html,flags=re.S)
          assert len(js)==1
          Path('/tmp/cikgulaju-web-shared.js').write_text(js[0],encoding='utf8')
          PY
          node --check /tmp/cikgulaju-web-shared.js
