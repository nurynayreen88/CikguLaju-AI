name: RPT school cover 25 real source PDFs QA
on:
  push:
    branches: [feature/rpt-school-25-real-source-qa-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-real-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pypdf==5.1.0' 'reportlab==4.2.5' 'Pillow==11.3.0' 'flask==3.1.3'
      - run: python -m unittest discover -s tests -p test_rpt_school_cover_real_sources.py -v
