name: Durable CikguLaju user storage checks

on:
  pull_request:
    paths:
      - 'web/supabase_user_payment_runtime.py'
      - 'web/payment_record_on_proof_runtime.py'
      - 'test_payment_record_on_proof_runtime.py'
      - 'web/payment_receipt_admin_runtime.py'
      - 'test_payment_receipt_admin_runtime.py'
      - 'web/supabase_user_feedback_runtime.py'
      - 'test_supabase_user_records.py'
      - 'migrations/20261104_durable_telegram_payments_feedback.sql'
      - 'tools/run_telegram_with_curriculum_api.py'
      - '.github/workflows/durable-user-storage-tests.yml'
  push:
    branches: [main]
    paths:
      - 'web/payment_record_on_proof_runtime.py'
      - 'test_payment_record_on_proof_runtime.py'
      - 'pioneer_telegram.py'
      - 'web/supabase_user_payment_runtime.py'
      - 'web/supabase_user_feedback_runtime.py'
      - 'test_supabase_user_records.py'
      - 'migrations/20261104_durable_telegram_payments_feedback.sql'
      - 'tools/run_telegram_with_curriculum_api.py'
      - '.github/workflows/durable-user-storage-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Telegram HTTP dependency for isolated mock tests
        run: python -m pip install requests==2.32.5
      - name: Compile isolated runtime code
        run: python -m py_compile web/payment_record_on_proof_runtime.py test_payment_record_on_proof_runtime.py web/supabase_user_payment_runtime.py web/payment_receipt_admin_runtime.py web/supabase_user_feedback_runtime.py test_supabase_user_records.py test_payment_receipt_admin_runtime.py
      - name: Test permanent user records without any live credentials
        run: python -m unittest -v test_supabase_user_records test_payment_receipt_admin_runtime test_payment_record_on_proof_runtime
