name: Web English Year 6 RPH — source-safe boxed Word/PDF QA

on:
  pull_request:
    paths:
      - "web/rph_year6_boxed_word_20261123.py"
      - "web/english_y6_rph_2027_http.py"
      - "tests/test_web_english_y6_boxed_word_20261123.py"
      - ".github/workflows/web-english-y6-boxed-word-20261123.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-safe-word:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Word, PDF and testing dependencies
        run: |
          python -m pip install --disable-pip-version-check "pytest>=8,<10" "python-docx>=1.1,<2" "lxml>=5,<7" "Flask>=3,<4" "pypdf>=5,<7" "PyMuPDF>=1.24,<2"
      - name: Install real A4 renderer with visible bounded network time
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          timeout --signal=TERM --kill-after=10s 240s sudo apt-get \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=25 \
            -o Acquire::https::Timeout=25 update
          timeout --signal=TERM --kill-after=10s 420s sudo apt-get \
            -o Dpkg::Lock::Timeout=60 \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=25 \
            -o Acquire::https::Timeout=25 install -y --no-install-recommends \
            libreoffice-writer fonts-crosextra-carlito
          libreoffice --version
      - name: Verify verified Year 6 SK/SP, all fields and real A4 PDF
        run: |
          python -m pytest -q tests/test_web_english_y6_boxed_word_20261123.py
          python -m py_compile web/rph_year6_boxed_word_20261123.py web/english_y6_rph_2027_http.py
