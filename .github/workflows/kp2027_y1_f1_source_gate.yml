name: KP2027 Year 1 and Form 1 Source Integrity

on:
  pull_request:
    paths:
      - 'curriculum/kp2027/**'
      - 'web/kp2027_status_api.py'
      - 'tests/test_kp2027_y1_f1_source_gate_20261106.py'
      - '.github/workflows/kp2027_y1_f1_source_gate.yml'
  workflow_dispatch:

jobs:
  kp2027-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API test dependency
        run: python -m pip install 'Flask==3.1.0'
      - name: Verify all new-curriculum choices are source-gated
        run: python -m unittest discover -s tests -p 'test_kp2027_y1_f1_source_gate_20261106.py' -v
