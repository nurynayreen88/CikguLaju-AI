name: English Y6 16 original KPM SOW tasks Word PDF A4 audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'rph_standalone/english/year6/lesson_0[89][0-9].md'
      - 'rph_standalone/english/year6/lesson_100.md'
      - 'tests/test_english_y6_16_kpm_sow_making_music_20261104.py'
      - '.github/workflows/english-y6-16-kpm-sow-a4-20261104.yml'
      - 'tools/verify_english_y4_y6_a4_20261104.py'
      - 'tools/verify_english_800_native_pdf_contract_20261104.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-and-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LESSONS: "81,82,83,84,86,87,88,89,91,92,93,94,97,98,99,100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check official source codes and 16 detailed RPH source tasks
        run: python -m unittest discover -s tests -p 'test_english_y6_16_kpm_sow_making_music_20261104.py' -v
      - name: Install isolated native document QA dependencies
        run: |
          python -m pip install reportlab==4.2.5 python-docx==1.1.2 pypdf==5.1.0
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer >/dev/null
          fi
      - name: Run original source-linked ReportLab PDF renderer on exact 16 lessons
        run: python tools/verify_english_800_native_pdf_contract_20261104.py --year 6 --lessons "$LESSONS"
      - name: Require 16 real native PDF A4 documents
        run: |
          python - <<'PY'
          import json,os,pathlib
          q=pathlib.Path("output/english_2_6_native_pdf_smoke_20261104/year6/native_pdf_report.json")
          data=json.loads(q.read_text(encoding="utf-8"))
          rows=data["results"]
          selected={int(n) for n in os.environ["LESSONS"].split(",")}
          assert len(rows)==16, len(rows)
          assert {x["lesson"] for x in rows}==selected
          assert all(x.get("pages")==1 and x.get("a4") and not x.get("error") for x in rows),rows
          print("English Y6 next 16: native PDF A4 all passed")
          PY
      - name: Run existing source-locked real Word document builder
        run: python tools/verify_english_y4_y6_a4_20261104.py --year 6 --lessons "$LESSONS"
      - name: Require 16 Word one-page A4 and no lost source text
        run: |
          python - <<'PY'
          import json,os,pathlib
          q=pathlib.Path("output/english_y4_y6_word_a4_20261104/year6/report.json")
          data=json.loads(q.read_text(encoding="utf-8"))
          rows=data["lessons"]
          selected={int(n) for n in os.environ["LESSONS"].split(",")}
          assert data["lesson_total"]==16,data
          assert {x["lesson"] for x in rows}==selected
          assert data["compact_one_page_a4"]==16,data
          for item in rows:
              assert item["compact"]["pages"]==1 and item["compact"]["a4"],item
              assert item["raw"]["source_text"]==item["compact"]["source_text"],item
          print("English Y6 next 16: Word one-page A4 with all text preserved")
          PY
      - name: Save source-linked document measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-y6-16-verified-word-pdf-measurements
          path: |
            output/english_2_6_native_pdf_smoke_20261104/year6/native_pdf_report.json
            output/english_y4_y6_word_a4_20261104/year6/report.json
          retention-days: 14
