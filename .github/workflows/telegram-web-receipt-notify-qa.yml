name: Telegram admin Web receipt notice QA
on:
  push:
    branches: [feature/telegram-web-receipt-review-notification-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'flask==3.1.3' 'requests==2.32.3'
      - run: python -m py_compile web/telegram_web_receipt_admin_notification.py tools/run_telegram_with_curriculum_api.py
      - run: python -m unittest discover -s tests -p test_telegram_web_receipt_admin_notification.py -v
      - run: python -m unittest discover -s tests -p test_pioneer_approval_recovery.py -v
      - run: python -m unittest discover -s tests -p test_pioneer_paid_recovery.py -v
      - run: python -m unittest discover -s . -p test_payment_receipt_admin_runtime.py -v
      - run: python -m unittest discover -s . -p test_payment_record_on_proof_runtime.py -v
