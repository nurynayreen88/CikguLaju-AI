name: RPT 2027 mobile personalized PDF browser and original-cover regression
on:
  pull_request:
    branches:
      - production/cikgulaju-web-20261105
    paths:
      - '.github/workflows/web-rpt2027-mobile-profile-download-ci.yml'
      - 'web_v1_static_preview/index.html'
      - 'web_v1_static_preview/rpt-personalize.js'
      - 'tests/test_web_mobile_rpt_download_browser.py'
      - 'tests/test_web_rpt_mobile_profile_end_to_end.py'
      - 'tests/qa_web_rpt_personal_cover_node.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-rpt-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          python -m pip install 'flask==3.1.3' 'PyMuPDF==1.24.14' 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Check JS parser and pinned original PDF library
        run: |
          node --check web_v1_static_preview/rpt-personalize.js
          sha256sum -c web_v1_static_preview/pdf-lib.min.js.sha256
      - name: Verify authenticated RPT routes and mobile click gesture in Chromium
        run: |
          python -m unittest tests.test_web_mobile_rpt_download_browser tests.test_web_rpt2027_56_release_catalog tests.test_web_rpt_2027_all -v
      - name: End-to-end mobile touch through profile, source checksum and blob PDF viewer
        run: python -m unittest tests.test_web_rpt_mobile_profile_end_to_end -v
      - name: Fill exact original cover slots on all 56 source PDFs with synthetic profiles
        run: node tests/qa_web_rpt_personal_cover_node.cjs
      - name: Verify all original cover slots and 56 PDF hashes remain intact
        run: python -m unittest tests.test_web_rpt_original_cover_layout -v
