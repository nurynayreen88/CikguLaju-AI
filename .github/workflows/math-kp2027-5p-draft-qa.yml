name: Math KP2027 249 RPH 5P Word PDF QA
on:
  push:
    branches: ['qa/math-kp2027-rph-5p-20261127']
    paths:
      - 'tools/build_math_kp2027_5p_draft_qa.py'
      - 'web/kp2027_math_5p.py'
      - 'web/kp2027_math_canary_web.py'
      - 'tests/test_math_kp2027_5p_delivery_20261127.py'
      - 'web_v1_static_preview/index.html'
      - 'audits/rph_5p_math_kp2027*'
      - '.github/workflows/math-kp2027-5p-draft-qa.yml'
  pull_request:
    paths:
      - 'tools/build_math_kp2027_5p_draft_qa.py'
      - 'web/kp2027_math_5p.py'
      - 'web/kp2027_math_canary_web.py'
      - 'tests/test_math_kp2027_5p_delivery_20261127.py'
      - 'web_v1_static_preview/index.html'
      - 'audits/rph_5p_math_kp2027*'
      - '.github/workflows/math-kp2027-5p-draft-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
          pip install -r requirements.txt python-docx pymupdf
      - run: PYTHONPATH=. python tools/build_math_kp2027_5p_draft_qa.py
      - name: Convert and validate every document
        run: |
          mkdir -p qa_math_5p/pdf
          find qa_math_5p -maxdepth 1 -name '*.docx' -print0 | xargs -0 -r -n 40 libreoffice -env:UserInstallation=file:///tmp/lo-math-5p --headless --convert-to pdf --outdir qa_math_5p/pdf
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import fitz
          from unicodedata import normalize
          from docx import Document
          p=Path("qa_math_5p")
          records=json.loads((p/"manifest.json").read_text())["records"]
          assert len(records)==249 and sum(r["dk_scope_correction"] for r in records)==40
          issues=[]
          norm=lambda s:" ".join(re.sub(r"(?<=\w)-[ \t]*\r?\n[ \t]*(?=\w)","-",normalize("NFKC",s)).split())
          for r in records:
              name=r["filename"]
              try:
                  word=Document(p/(name+".docx"))
                  assert len(word.tables)==1 and len(word.tables[0].rows)==21
                  with fitz.open(p/"pdf"/(name+".pdf")) as pdf:
                      assert len(pdf)==1 and abs(pdf[0].rect.width-595.28)<2 and abs(pdf[0].rect.height-841.89)<2, "not one A4 page"
                      txt=norm(pdf[0].get_text())
                      for term in ("Penglibatan","Penerokaan","Penerangan","Pengembangan","Penilaian","Refleksi",r["source"]["sp"],r["source"]["objective"],r["source"]["criteria"],*r["phases"].values()):
                          assert norm(term) in txt, "missing: "+term
                      assert "Refleksi (Auto" not in txt
              except Exception as e:
                  issues.append({"file":name,"error":str(e)})
          (p/"layout-report.json").write_text(json.dumps({"total":249,"issues":issues,"release":False},indent=2))
          print("Documents passing:",249-len(issues))
          assert not issues, issues[:10]
          PY
      - name: Verify route security and legacy Math downloads
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p test_math_kp2027_5p_delivery_20261127.py -v
          PYTHONPATH=. python -m unittest discover -s tests -p test_kp2027_math_canary_web.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-kp2027-5p-249-draft-qa
          path: qa_math_5p/
          retention-days: 7
