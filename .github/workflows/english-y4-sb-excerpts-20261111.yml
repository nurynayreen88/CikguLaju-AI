name: Telegram Year4 Student Book exact-page source QA
on:
  pull_request:
    paths:
      - "web/telegram_english_student_book_api_20261111.py"
      - "tools/run_telegram_with_curriculum_api.py"
      - "tests/test_english_y4_student_book_api_20261111.py"
      - ".github/workflows/english-y4-sb-excerpts-20261111.yml"
  push:
    branches: [staging/english-y4-sb-download-telegram-20261111]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'flask==3.1.3' 'pypdf==5.1.0'
      - run: PYTHONPATH=tests:. python -m unittest -v tests.test_english_y4_student_book_api_20261111
