name: RPH Aktiviti Khas - Review Pack

on:
  pull_request:
    paths:
      - 'rph_standalone/aktiviti_khas/**'
      - 'scripts/export_aktiviti_khas_review.py'
      - '.github/workflows/rph_aktiviti_khas_review_pack.yml'
  workflow_dispatch:

jobs:
  review-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reviewed document dependencies
        run: python -m pip install 'python-docx==1.1.2' 'reportlab==4.2.5' 'pypdf==5.1.0'
      - name: Export 118 draft documents and manifest
        run: python -m scripts.export_aktiviti_khas_review
      - name: Validate archive inventory and one-page PDF integrity
        run: |
          python - <<'PY'
          import io, json, zipfile, hashlib
          from pypdf import PdfReader
          path = "dist/CikguLaju_59_RPH_Aktiviti_Khas_DRAF.zip"
          with zipfile.ZipFile(path) as z:
              manifest = json.loads(z.read("MANIFEST.json"))
              assert manifest["rph_count"] == 59
              assert manifest["document_count"] == 118
              assert len(manifest["records"]) == 59
              count = 0
              for row in manifest["records"]:
                  assert len(row["documents"]) == 2
                  for item in row["documents"]:
                      b = z.read(item["archive_path"])
                      assert hashlib.sha256(b).hexdigest() == item["sha256"]
                      assert len(b) == item["bytes"]
                      if item["format"] == "pdf":
                          assert len(PdfReader(io.BytesIO(b)).pages) == 1
                      count += 1
              assert count == 118
          print("PASS: all 118 files verifiably match the manifest")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CikguLaju-59-RPH-Aktiviti-Khas-DRAF
          path: dist/CikguLaju_59_RPH_Aktiviti_Khas_DRAF.zip
          retention-days: 14
          if-no-files-found: error
