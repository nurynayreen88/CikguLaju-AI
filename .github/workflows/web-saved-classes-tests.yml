name: Web saved classes Supabase read-only check
on:
  push:
    branches:
      - staging/web-saved-classes-20261105
      - staging/cikgulaju-web-v1
    paths:
      - 'web/teacher_class_choices.py'
      - 'web_v1_telegram_auth_routes.py'
      - 'web_v1_static_preview/index.html'
      - 'tests/test_web_saved_classes.py'
      - '.github/workflows/web-saved-classes-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classes:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'flask==3.1.2'
      - name: Syntax and isolated profile tests
        run: |
          python -m py_compile web/teacher_class_choices.py web_v1_telegram_auth_routes.py
          python -m unittest discover -s tests -p 'test_web_saved_classes.py' -v
          python -m unittest discover -s tests -p 'test_web_v1_telegram_auth_routes.py' -v
      - name: Browser script remains syntactically valid
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('web_v1_static_preview/index.html').read_text(encoding='utf8')
          scripts=re.findall(r'<script>\s*(.*?)\s*</script>',s,flags=re.S)
          assert len(scripts)==1
          Path('/tmp/web-saved-classes.js').write_text(scripts[0],encoding='utf8')
          PY
          node --check /tmp/web-saved-classes.js
