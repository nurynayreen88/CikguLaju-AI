name: English Year5 151+9 draft release safety and source coverage
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/english_y5_fixed_draft_preview_runtime.py'
      - 'web/english_y5_teacher_choice_runtime.py'
      - 'web/english_y5_standalone_runtime.py'
      - 'rph_standalone/english/year5/**'
      - 'tests/test_english_y5_full_preview_gate_20261105.py'
      - 'tools/audit_english_y5_fixed_release_evidence.py'
      - '.github/workflows/english-y5-160-preview-release-gate-20261105.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check all Year5 151 fixed draft + 9 teacher selected
        run: python -m unittest discover -s tests -p 'test_english_y5_full_preview_gate_20261105.py' -v
  year5-document-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install offline rendering dependencies
        run: |
          python -m pip install python-docx==1.1.2 pypdf==5.1.0 reportlab==4.2.5
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer >/dev/null
          fi
      - name: Check the approved renderer and SOW source
        run: |
          python -m unittest discover -s tests -p 'test_english_y5_rph_runtime.py' -v
          python tools/audit_english_y5_sow_printed_page_citations_20261105.py --strict
      - name: Render 151 Year 5 Word drafts and check A4 page layout
        run: python tools/verify_english_y4_y5_draft_a4.py --year 5
      - name: Render the isolated native ReportLab path and assemble the evidence
        run: |
          python tools/verify_english_800_native_pdf_contract_20261104.py --year 5 --all
          python -m tools.audit_english_y5_fixed_release_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: English_SK_Year_5_151_RPH_dan_bukti_semakan
          path: |
            output/english_y5_fixed_release_evidence/
            output/english_y4_y5_full_draft_a4/year5/report.json
            output/english_y4_y5_full_draft_a4/year5/docx/*.docx
            output/english_y4_y5_full_draft_a4/year5/pdf/*.pdf
            output/english_2_6_native_pdf_smoke_20261104/year5/native_pdf_report.json
          if-no-files-found: error
          retention-days: 30
