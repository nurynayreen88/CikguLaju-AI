name: English standalone adapter smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'english_standalone_adapter.py'
      - 'rph_standalone/english/year1/**'
      - 'tests/test_english_standalone_adapter.py'
      - 'tools/render_english_y1_markdown.py'
      - '.github/workflows/english-standalone-adapter-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check standalone library and fallback guards
        run: python -m unittest discover -s tests -p 'test_english_standalone_adapter.py' -v
      - name: Install A4 preview dependencies
        run: python -m pip install reportlab pypdf
      - name: Render representative standalone lessons
        run: |
          for lesson in 1 16 80 150 160; do python tools/render_english_y1_markdown.py "$lesson"; done
      - name: Confirm A4 single-page previews
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          folder = Path('output/english_y1_standalone_preview')
          files = sorted(folder.glob('*.pdf'))
          assert len(files) == 5, f'Expected 5 PDF previews; found {len(files)}'
          for path in files:
              reader = PdfReader(str(path))
              assert len(reader.pages) == 1, f'{path.name}: {len(reader.pages)} pages'
              assert abs(float(reader.pages[0].mediabox.width) - 595.28) < 1
              assert abs(float(reader.pages[0].mediabox.height) - 841.89) < 1
          print('Five representative A4 one-page previews passed')
          PY
