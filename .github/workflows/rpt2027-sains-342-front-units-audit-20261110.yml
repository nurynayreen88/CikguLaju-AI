name: RPT2027 Sains 342 source missing initial units - release guard
on:
  pull_request:
    paths:
      - 'scripts/audit_rpt2027_sains_342_missing_front_units_20261110.py'
      - 'tests/test_rpt2027_sains_342_missing_front_units_20261110.py'
      - 'scripts/build_rpt_2027_sains_342_actual_source_staging.py'
      - '.github/workflows/rpt2027-sains-342-front-units-audit-20261110.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source reader dependencies
        run: python -m pip install 'PyMuPDF==1.24.14' 'reportlab==4.2.5'
      - name: Test 342-source Year2-6 unit coverage, no invented units
        run: |
          python -m py_compile scripts/audit_rpt2027_sains_342_missing_front_units_20261110.py
          python -m unittest tests.test_rpt2027_sains_342_missing_front_units_20261110 -v
      - name: Write machine-readable blocked-release report (staging only)
        run: python -m scripts.audit_rpt2027_sains_342_missing_front_units_20261110
      - uses: actions/upload-artifact@v4
        with:
          name: rpt2027-sains-342-missing-front-units-source-audit-not-release
          path: staging/rpt_2027_seragam_2026/sains_342_front_unit_coverage_20261110.json
          if-no-files-found: error
          retention-days: 30
