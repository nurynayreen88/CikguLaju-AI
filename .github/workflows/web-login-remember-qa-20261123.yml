name: Web login clarity and secure remember-me QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'web_v1_sessions.py'
      - 'web_v1_telegram_auth_routes.py'
      - 'web_v1_email_auth_routes.py'
      - 'web_v1_email_auth_ui.py'
      - 'web_v1_static_preview/email-auth.js'
      - 'tests/test_web_v1_sessions.py'
      - 'tests/test_web_v1_telegram_auth_routes.py'
      - 'tests/test_web_login_remember_ui_20261123.py'
      - '.github/workflows/web-login-remember-qa-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  login-ui-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'flask==3.1.3' 'requests==2.32.3' 'gunicorn==23.0.0'
      - run: python -m py_compile web_v1_sessions.py web_v1_email_auth_routes.py web_v1_telegram_auth_routes.py web_v1_email_auth_ui.py
      - run: node --check web_v1_static_preview/email-auth.js
      - run: python -m unittest discover -s tests -p test_web_v1_sessions.py -v
      - run: python -m unittest discover -s tests -p test_web_v1_telegram_auth_routes.py -v
      - run: python -m unittest discover -s tests -p test_web_login_remember_ui_20261123.py -v
