name: RPT2027 Sains Y6 recover 2021 original 96-SP published text
on:
  pull_request:
    paths:
      - 'scripts/audit_rpt2027_sains_y6_2021_published_source_20261110.py'
      - '.github/workflows/rpt2027-sains-y6-2021-published-text-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-2021-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.12.3'
      - name: Inspect accessible KPM 2021 published facsimile text, no edits
        run: python -m scripts.audit_rpt2027_sains_y6_2021_published_source_20261110
      - uses: actions/upload-artifact@v4
        with:
          name: rpt2027-sains-year6-public-96-sp-source-probe-audit-not-release
          path: output/rpt2027_sains_y6_public_source_probe_20261110.json
          retention-days: 30
          if-no-files-found: error
