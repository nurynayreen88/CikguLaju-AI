name: Web Sidebar Navigation CI
on:
  push:
    branches:
      - feature/web-sidebar-rpt-separate-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sidebar-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask==3.1.3
      - name: Verify RPT is outside RPH, login and download protected
        run: |
          python -m unittest discover -s tests -p 'test_web_sidebar_navigation.py' -v
          python -m unittest discover -s tests -p 'test_web_v1_quick_preview.py' -v
          python -m unittest discover -s tests -p 'test_web_saved_classes.py' -v
          python -m unittest discover -s tests -p 'test_web_unified_rph_preview.py' -v
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('web_v1_static_preview/index.html').read_text(encoding='utf8')
          scripts=re.findall(r'<script>\s*(.*?)\s*</script>',html,flags=re.S)
          assert len(scripts)==1
          Path('/tmp/cikgulaju-sidebar.js').write_text(scripts[0],encoding='utf8')
          PY
          node --check /tmp/cikgulaju-sidebar.js
