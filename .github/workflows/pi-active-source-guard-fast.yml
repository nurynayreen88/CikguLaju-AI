name: PI active source guard — fast Word/RTL QA
on:
  pull_request:
    paths:
      - "web/rph_active_pi_rtl_alignment_20261123.py"
      - "web/rph_reference_style_20261121.py"
      - "tests/test_pi_active_jawi_content_right_20261123.py"
      - ".github/workflows/pi-active-source-guard-fast.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quick-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fast Word dependencies
        run: python -m pip install "pytest>=8,<10" "python-docx>=1.1,<2" "lxml>=5,<7"
      - name: Verify source content and Jawi alignment before A4 renderer
        run: python -m pytest -q tests/test_pi_active_jawi_content_right_20261123.py -k 'not real_a4'
