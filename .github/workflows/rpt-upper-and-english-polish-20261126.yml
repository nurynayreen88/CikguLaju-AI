name: Ten upper SK Math Science and English polished native tables
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/rpt_kssr_physical_pages.py'
      - 'tools/rpt_source_table_polish.py'
      - 'tools/build_rpt_math_upper_native_word_20261126.py'
      - 'tools/build_rpt_science_approved_word_20261126.py'
      - 'tools/build_english_rpt_merged_week_word_pdf_20261126.py'
      - '.github/workflows/rpt-upper-and-english-polish-20261126.yml'
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {module: build_rpt_math_upper_native_word_20261126, year: 4}
          - {module: build_rpt_math_upper_native_word_20261126, year: 5}
          - {module: build_rpt_math_upper_native_word_20261126, year: 6}
          - {module: build_rpt_science_approved_word_20261126, year: 5}
          - {module: build_rpt_science_approved_word_20261126, year: 6}
          - {module: build_english_rpt_merged_week_word_pdf_20261126, year: 2}
          - {module: build_english_rpt_merged_week_word_pdf_20261126, year: 3}
          - {module: build_english_rpt_merged_week_word_pdf_20261126, year: 4}
          - {module: build_english_rpt_merged_week_word_pdf_20261126, year: 5}
          - {module: build_english_rpt_merged_week_word_pdf_20261126, year: 6}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - name: Verify original academic content and original cover against rendered table
        run: |
          python - <<'PY'
          import importlib,os,re,json,fitz
          from pathlib import Path
          from docx import Document
          module=importlib.import_module("tools.${{ matrix.module }}")
          y=${{ matrix.year }}
          out=Path(os.environ["RUNNER_TEMP"])/"private"
          out.mkdir()
          module.render(y,out)
          d=Document(next(out.glob("*.docx")))
          t=d.tables[0]
          rows=[]
          for i,row in enumerate((r for t in d.tables for r in t.rows[1:]),1):
              values=[c.text.strip() for c in row.cells]
              assert any(values[1:]),(i,"empty body row")
              rows.append(values)
          with fitz.open(next(out.glob("*.pdf"))) as pdf:
              assert all(len(p.get_text().strip())>20 for p in list(pdf)[1:])
          print("LAYOUT_PASS",json.dumps({"module":module.__name__,"year":y,"rows":len(rows),"headings":[c.text for c in t.rows[0].cells],"first_rows":rows[:2]},ensure_ascii=False))
          PY
      - if: always()
        run: rm -rf "$RUNNER_TEMP/private"
