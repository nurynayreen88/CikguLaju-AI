name: PI KSSR Years 2-6 real native RPH Word/PDF Jawi A4 QA
on:
  pull_request:
    paths:
      - "tools/audit_pi_all_years_jawi_layout_20261124.py"
      - ".github/workflows/pi-kssr-y2-y6-native-a4-qa-20261124.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-v26-verified-pi:
    name: 10 source-backed PI Jawi RPH · Year 2–6 · 2 distinct units/year
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact native Telegram renderer and master source dependencies
        run: bash build_jawi.sh
      - name: Install read-only Word/PDF inspection dependencies
        run: |
          python -m pip install "pymupdf>=1.24,<2" "Pillow>=10,<13"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libreoffice-writer
      - name: Validate verified RPT, actual Word and native PDF for every PI Year 2–6
        run: python -m tools.audit_pi_all_years_jawi_layout_20261124
      - name: Upload 10 real reviewed Word/PDF samples (QA only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CIKGULAJU_PI_TAHUN_2_6_10_CONTOH_WORD_PDF_JAWI
          path: qa/pi-y2-y6-jawi-native/*
          if-no-files-found: error
          retention-days: 7
