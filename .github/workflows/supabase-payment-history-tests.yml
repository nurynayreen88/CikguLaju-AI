name: Supabase payment history unit tests

on:
  pull_request:
    paths:
      - 'app.py'
      - 'supabase_admin_payment_history.py'
      - 'supabase_admin_payment_page.py'
      - 'supabase_payment_history.py'
      - 'supabase_payment_request_write.py'
      - 'tests/test_supabase_payment_request_write.py'
      - 'tests/test_supabase_admin_payment_history.py'
      - 'tests/test_supabase_admin_payment_page.py'
      - '.github/workflows/supabase-payment-history-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile supabase_admin_payment_history.py supabase_admin_payment_page.py supabase_payment_history.py supabase_payment_request_write.py
      - name: Run payment history unit tests
        run: |
          python -m unittest discover -s tests -p 'test_supabase_admin_payment*.py' -v
          python -m unittest discover -s tests -p 'test_supabase_payment_request_write.py' -v
