name: Web Sains real browser Word-PDF click and 10-credit UI QA

on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - "tests/test_web_science_download_click_browser_20261108.py"
      - "web_v1_static_preview/index.html"
      - ".github/workflows/web-science-browser-real-click-qa-20261108.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-click-no-real-user:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and browser testing dependencies
        run: |
          python -m pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Click real teacher Web Word and PDF buttons with synthetic Science account
        run: python -m unittest discover -s tests -p "test_web_science_download_click_browser_20261108.py" -v
      - name: Retain previous 10-credit Web UI behavior
        run: python -m unittest discover -s tests -p "test_web_trial_browser.py" -v
