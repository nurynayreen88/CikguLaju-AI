name: Web RPT2027 fill ORIGINAL cover three slots - 56 real PDF QA
on:
  pull_request:
    branches:
      - 'production/cikgulaju-web-20261105'
    paths:
      - '.github/workflows/web-rpt2027-original-cover-fill-ci.yml'
      - 'web/rpt_2027_all_http.py'
      - 'tools/run_web_production.py'
      - 'web_v1_static_preview/index.html'
      - 'web_v1_static_preview/rpt-personalize.js'
      - 'rpt_2027/web_2027_pdfs/original_cover_layout_verified.json'
      - 'tests/test_web_rpt_original_cover_layout.py'
      - 'tests/test_web_rpt2027_56_release_catalog.py'
      - 'tests/qa_web_rpt_personal_cover_node.cjs'
      - 'tests/qa_web_rpt_original_cover_render.py'
permissions:
  contents: read
jobs:
  original_cover:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing paid RPT auth plus all 56 PDF original cover placeholders
        run: |
          python -m pip install 'flask==3.1.3' 'PyMuPDF==1.24.14' 'Pillow==11.3.0'
          python -m unittest tests.test_web_rpt2027_56_release_catalog tests.test_web_rpt_2027_all tests.test_web_rpt_original_cover_layout -v
      - name: Verify pinned, first-party PDF library and JS source syntax
        run: |
          sha256sum -c web_v1_static_preview/pdf-lib.min.js.sha256
          node --check web_v1_static_preview/rpt-personalize.js
          node --check tests/qa_web_rpt_personal_cover_node.cjs
          test "$(grep -c 'insertPage(' web_v1_static_preview/rpt-personalize.js || true)" -eq 0
          test "$(grep -c 'copyPages(' web_v1_static_preview/rpt-personalize.js || true)" -eq 0
      - name: Fill only existing PDF cover, 56 originals, zero extra pages
        shell: bash
        run: |
          set -euo pipefail
          node tests/qa_web_rpt_personal_cover_node.cjs "$RUNNER_TEMP/rpt_original_cover_sample"
          python tests/qa_web_rpt_original_cover_render.py --outputs "$RUNNER_TEMP/rpt_original_cover_sample"
      - name: Block accidental deployment of 2027 Year1 or billing changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('rpt_2027/web_2027_pdfs')
          m=json.loads((root/'manifest.json').read_text('utf-8'))
          a=json.loads((root/'original_cover_layout_verified.json').read_text('utf-8'))
          assert len(m['files'])==len(a['source_sha256_by_subject_year'])==56
          assert not any(key.endswith(':1') for key in m['files'])
          assert m['status']=='DRAF_USER_VISIBLE_NOT_ACADEMIC_FINAL'
          assert a['expected_underscore_lines_per_cover']==2
          print('SAFE_WEB_RPT_ORIGINAL_COVER_ONLY_NO_BILLING_NO_DB_WRITES')
          PY
