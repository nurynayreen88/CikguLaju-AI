name: Web staging all-subject RPT 2027 validation
on:
  push:
    branches:
      - staging/cikgulaju-web-v1
    paths:
      - '.github/workflows/web-rpt-2027-all-tests.yml'
      - 'tests/test_web_rpt_2027_all.py'
      - 'web/rpt_2027_all_http.py'
      - 'tools/run_web_v1_preview.py'
      - 'web_v1_static_preview/index.html'
      - 'rpt_2027/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-staging-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Flask test dependency
        run: python -m pip install 'flask==3.1.2'
      - name: Compile new Web endpoints and test access controls
        run: |
          python -m py_compile web/rpt_2027_all_http.py tools/run_web_v1_preview.py
          python -m unittest discover -s tests -p 'test_web_rpt_2027_all.py' -v
      - name: Check HTML inline JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib
          import re
          src = pathlib.Path("web_v1_static_preview/index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>\s*(.*?)\s*</script>", src, flags=re.S)
          if not match:
              raise SystemExit("Web inline script not found")
          pathlib.Path("/tmp/cikgulaju-web-rpt-2027.js").write_text(match.group(1), encoding="utf-8")
          assert "RPT 2027 — Semua Subjek" in src
          assert "rpt-subject" in src
          assert "/api/rpt/2027/all/" in src
          assert "RPT English 2027 (PDF)" not in src
          PY
          node --check /tmp/cikgulaju-web-rpt-2027.js
      - name: Verify 35 exact PDF snapshots remain present
        run: |
          python - <<'PY'
          from web.rpt_2027_all_http import SUBJECTS, YEARS, pdf_ready
          for subject in SUBJECTS:
              for year in YEARS:
                  if subject == "sains":
                      assert not pdf_ready(subject,year), f"Unexpected provisional Sains source {year}"
                      continue
                  assert pdf_ready(subject,year), f"PDF missing or corrupt: {subject} Year {year}"
          print("PASS: 35 subject/year PDFs are locally available and have correct PDF headers.")
          PY
