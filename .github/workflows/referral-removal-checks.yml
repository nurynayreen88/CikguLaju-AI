name: Referral removal syntax checks
on:
  pull_request:
    paths:
      - 'app.py'
      - '.github/workflows/referral-removal-checks.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile app.py pioneer_telegram.py pioneer_supabase.py
