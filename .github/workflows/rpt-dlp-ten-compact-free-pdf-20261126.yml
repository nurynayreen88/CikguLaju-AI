name: Build ten DLP compact free PDFs
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - '.github/workflows/rpt-dlp-ten-compact-free-pdf-20261126.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rpt-dlp-ten-compact-free-pdf-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - name: Generate verified unpersonalized free PDF candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from hashlib import sha256
          import json
          import fitz
          from tools.build_rpt_dlp_native_20261126 import render,PINS
          from rpt_2027.dlp.documents import document_path
          root=Path("rpt_2027")
          output=root/"compact_dlp_pdf_2027"
          output.mkdir(parents=True,exist_ok=True)
          entries={}
          with TemporaryDirectory() as temp:
              for key,digest in PINS.items():
                  subject,y=key.split(":");year=int(y)
                  old=document_path(subject,year,root=root/"dlp")
                  assert sha256(old.read_bytes()).hexdigest()==digest
                  render(subject,year,Path(temp))
                  candidate=Path(temp)/f"RPT_{subject}_Year_{year}_2027.pdf"
                  data=candidate.read_bytes()
                  with fitz.open(old) as a,fitz.open(candidate) as b:
                      assert a[0].get_pixmap().samples==b[0].get_pixmap().samples
                      assert all(p.get_text().strip() for p in list(b)[1:])
                      assert len(b)<len(a)
                      entry={"path":f"{subject}/tahun_{year}.pdf","source_sha256":digest,
                             "sha256":sha256(data).hexdigest(),"bytes":len(data),"pages":len(b),"source_pages":len(a)}
                  dest=output/entry["path"];dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
                  entries[key]=entry
          assert len(entries)==10 and len(list(output.rglob("*.pdf")))==10 and not list(output.rglob("*.docx"))
          (output/"manifest.json").write_text(json.dumps({"version":1,"status":"LAYOUT_QA_CANDIDATE","count":10,"files":entries},indent=2)+"\n")
          PY
      - name: Commit only ten free PDFs on isolated review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rpt_2027/compact_dlp_pdf_2027
          git diff --cached --name-only | python -c 'import sys; p=sys.stdin.read().splitlines(); assert len(p)==11 and all(s.startswith("rpt_2027/compact_dlp_pdf_2027/") and (s.endswith(".pdf") or s.endswith("/manifest.json")) for s in p)'
          git commit -m "build(rpt): ten DLP compact free PDF candidates"
          git push origin HEAD:refs/heads/feat/rpt-dlp-ten-compact-free-pdf-20261126
