name: Native RPH Word sixteen-subject format QA
on:
  push:
    branches: [fix/rph-word-canonical-20261122]
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'web/rph_table_layout.py'
      - 'web/rph_login_canonical_layout_20261121.json'
      - 'tests/test_rph_word_canonical_theme_20261122.py'
      - '.github/workflows/rph-word-canonical-20261122.yml'
permissions:
  contents: read
jobs:
  word-canonical-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask==3.1.3 python-docx==1.2.0 Pillow==11.3.0
      - name: Syntax and exact source/format preservation in sixteen subjects
        run: |
          python -m py_compile web/rph_table_layout.py web/telegram_rph_parity.py
          python -m unittest discover -s tests -p 'test_rph_word_canonical_theme_20261122.py' -v
      - name: Existing Word and PDF source-parity regressions
        run: |
          python -m unittest discover -s tests -p 'test_web_logo_and_tables.py' -v
          python -m unittest discover -s tests -p 'test_web_unified_rph_preview.py' -v
