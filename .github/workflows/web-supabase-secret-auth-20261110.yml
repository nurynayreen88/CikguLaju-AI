name: Web Supabase secret-key read-only compatibility
on:
  pull_request:
    branches:
      - production/cikgulaju-web-20261105
    paths:
      - 'web_v1_supabase_account_adapter.py'
      - 'tests/test_web_v1_supabase_account_adapter.py'
      - '.github/workflows/web-supabase-secret-auth-20261110.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-account-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile without production credentials
        run: python -m py_compile web_v1_supabase_account_adapter.py tests/test_web_v1_supabase_account_adapter.py
      - name: Prove legacy and opaque key headers, lifetime and trial balance
        run: python -m unittest tests.test_web_v1_supabase_account_adapter -v
