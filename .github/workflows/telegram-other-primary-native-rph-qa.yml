name: Telegram Native RPH BM PI Matematik Sains QA
on:
  push:
    branches: [main, feature/telegram-db-rph-bridge-bm-pi-20261106, feature/telegram-bm-structured-web-catalog-20261106, feature/telegram-rph-choice-page-refs-20261106, fix/bm-web-real-verified-pdp-sequence-20261106]
    paths:
      - web_v1_dropdown_catalog.py
      - web/telegram_native_bm_sequence_rph_bridge.py
      - tests/test_telegram_native_bm_sequence_rph.py
      - tests/test_telegram_reference_options_web.py
      - web/telegram_curriculum_api.py
      - tests/test_telegram_bm_hierarchy_web.py
      - web/telegram_verified_rpt_rph_bridge.py
      - web/telegram_verified_sequence_rph_bridge.py
      - tools/run_telegram_with_curriculum_api.py
      - tests/test_telegram_verified_rpt_rph_bridge.py
      - tests/test_telegram_verified_sequence_rph_bridge.py
      - .github/workflows/telegram-other-primary-native-rph-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-render-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flask==3.1.3 python-docx==1.2.0 lxml==5.4.0
      - name: Validate source-only routes and no changes to Telegram main flow
        run: |
          python -m py_compile web/telegram_verified_rpt_rph_bridge.py web/telegram_verified_sequence_rph_bridge.py tools/run_telegram_with_curriculum_api.py
          python -m unittest discover -s tests -p test_telegram_verified_rpt_rph_bridge.py -v
          python -m unittest discover -s tests -p test_telegram_verified_sequence_rph_bridge.py -v
          python -m unittest discover -s tests -p test_telegram_bm_hierarchy_web.py -v
          python -m unittest discover -s tests -p test_telegram_native_bm_sequence_rph.py -v
          python -m unittest discover -s tests -p test_telegram_reference_options_web.py -v
