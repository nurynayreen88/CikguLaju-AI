name: Web RPH Source Availability QA
on:
  push:
    branches: [feature/web-rph-availability-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flask==3.1.3 python-docx==1.2.0 Pillow==11.3.0
      - name: Validate signed account readiness, exact source and real Telegram downloads
        run: |
          python -m py_compile web/unified_rph_web.py web/native_telegram_rph_client.py
          python -m unittest discover -s tests -p test_web_rph_availability.py -v
          python -m unittest discover -s tests -p test_web_native_telegram_rph_download.py -v
          python -m unittest discover -s tests -p test_web_unified_rph_preview.py -v
          python -m unittest discover -s tests -p test_web_sidebar_navigation.py -v
          python -m unittest discover -s tests -p test_web_production_inventory.py -v
      - name: Validate browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page=Path('web_v1_static_preview/index.html').read_text('utf8')
          scripts=re.findall(r'<script>\s*(.*?)\s*</script>',page,flags=re.S)
          assert len(scripts)==1
          Path('/tmp/web-rph-readiness.js').write_text(scripts[0],encoding='utf8')
          PY
          node --check /tmp/web-rph-readiness.js
