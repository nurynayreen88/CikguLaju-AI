name: BM Actual Telegram Native Word PDF Smoke
on:
  push:
    branches: [qa/bm-actual-native-word-pdf-v26-20261106]
    paths:
      - tools/bm_actual_native_document_smoke_20261106.py
      - .github/workflows/bm-real-native-document-smoke-20261106.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-word-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only runtime dependencies required for genuine document smoke
        run: pip install Flask==3.1.3 requests==2.32.3 python-docx==1.2.0 reportlab==4.2.5 pypdf==5.1.0 Pillow==11.3.0 lxml==5.4.0
      - name: Generate genuine Telegram Word and PDF for verified BM Year 2, 3, 4
        env:
          BOT_TOKEN: ""
          GEMINI_API_KEY: ""
        run: python -m tools.bm_actual_native_document_smoke_20261106
