name: BM RPT 2027 - build five PDF landscape files (DRAF)
on:
  push:
    branches:
      - feat/rpt-bm-2027-pdf-telegram-20261104
    paths:
      - 'rpt_2027/bahasa_melayu/keluaran_format_english/**'
      - 'tools/build_bm_rpt_pdf_2027.py'
      - '.github/workflows/bm-rpt-2027-pdf-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-rpt-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF rendering and QA tools
        run: python -m pip install 'weasyprint==62.3' 'pydyf==0.10.0' 'pypdf==5.1.0'
      - name: Build and verify 5 PDFs with 825 PdP
        run: python tools/build_bm_rpt_pdf_2027.py
      - name: Make build artifacts available
        uses: actions/upload-artifact@v4
        with:
          name: CikguLaju-RPT-Bahasa-Melayu-Tahun2-6-2027-DRAF-PDF
          path: |
            rpt_2027/bahasa_melayu/RPT_Bahasa_Melayu_Tahun_*_2027_DRAF.pdf
            rpt_2027/bahasa_melayu/PDF_DRAF_MANIFEST_2027.json
          if-no-files-found: error
      - name: Commit PDF outputs only to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rpt_2027/bahasa_melayu/RPT_Bahasa_Melayu_Tahun_*_2027_DRAF.pdf rpt_2027/bahasa_melayu/PDF_DRAF_MANIFEST_2027.json
          if git diff --staged --quiet; then
            echo 'PDFs identical; no commit required.'
          else
            git commit -m 'Build five BM RPT 2027 landscape DRAF PDFs (825 PdP)'
            git push origin HEAD:feat/rpt-bm-2027-pdf-telegram-20261104
          fi
