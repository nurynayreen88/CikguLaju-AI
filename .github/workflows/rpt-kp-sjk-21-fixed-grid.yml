name: Render 21 KP2027 and SJK fixed-width tables without changing covers
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/rpt_kp_sjk_fixed_grid.py'
      - '.github/workflows/rpt-kp-sjk-21-fixed-grid.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scope: [kp2027, sjkc-bahasa-cina, sjkc-bahasa-melayu, sjkc-sains, sjkc-matematik, sjkt-matematik]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation fonts-noto-cjk fonts-noto-core
      - name: Validate original content and render all teaching pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from io import BytesIO
          from docx import Document
          from docx.oxml.ns import qn
          import re,json,fitz,subprocess
          from web.rpt_2027_all_http import SCHOOL_RPTS
          from web import kp2027_year1_rpt_combined as kp
          from tools.rpt_kp_sjk_fixed_grid import fix,teaching
          scope="${{ matrix.scope }}"
          sources=[]
          if scope=="kp2027":
              for subject in kp.SUBJECTS:
                  sources.append((subject,subject,kp.document(subject,"docx")[0],kp.document(subject,"pdf")[0]))
          else:
              school,slug=scope.split("-",1)
              module=SCHOOL_RPTS[school][slug]
              for y in module.YEARS:
                  w=module.document_path(y,"docx");p=module.document_path(y,"pdf")
                  assert w and p
                  sources.append((f"{school}:{slug}:{y}",slug,w.read_bytes(),p.read_bytes()))
          for key,subject,word,original in sources:
              revised,count=fix(word,subject)
              a=Document(BytesIO(word));b=Document(BytesIO(revised))
              assert [[ [c.text for c in row.cells] for row in t.rows] for t in a.tables]==[[ [c.text for c in row.cells] for row in t.rows] for t in b.tables]
              assert [p.text for p in a.paragraphs]==[p.text for p in b.paragraphs]
              for ta,tb in zip(a.tables,b.tables):
                  if not teaching(ta):assert ta._tbl.xml==tb._tbl.xml
                  else:
                      assert tb._tbl.tblPr.find(qn("w:tblW")).get(qn("w:type"))=="dxa"
                      assert tb.rows[0]._tr.trPr.find(qn("w:tblHeader")) is not None
              with TemporaryDirectory() as td:
                  folder=Path(td);path=folder/"rpt.docx";path.write_bytes(revised)
                  subprocess.run(["libreoffice","-env:UserInstallation="+(folder/"lo").as_uri(),"--headless","--convert-to","pdf","--outdir",td,str(path)],check=True,timeout=180)
                  with fitz.open(folder/"rpt.pdf") as rendered,fitz.open(stream=original,filetype="pdf") as orig,fitz.open() as final:
                      assert len(rendered)>1
                      final.insert_pdf(orig,from_page=0,to_page=0)
                      final.insert_pdf(rendered,from_page=1)
                      assert final[0].get_pixmap().samples==orig[0].get_pixmap().samples
                      assert all(p.get_text().strip() for p in list(final)[1:])
                      print("QA_PASS",json.dumps({"key":key,"teaching_tables":count,"old_pages":len(orig),"new_pages":len(final)},ensure_ascii=False),flush=True)
          PY
