name: Ten DLP explicit page tables private QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/rpt_physical_page_tables.py'
      - 'tools/build_rpt_dlp_full_standards_20261126.py'
      - '.github/workflows/rpt-dlp-explicit-page-qa-20261126.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        subject: [mathematics_dlp, science_dlp]
        year: [2,3,4,5,6]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - run: python -m tools.build_rpt_dlp_full_standards_20261126 --subject ${{ matrix.subject }} --year ${{ matrix.year }} --out "$RUNNER_TEMP/private"
      - if: always()
        run: rm -rf "$RUNNER_TEMP/private"
