name: Arabic SK 178 draft shared RTL layout QA
on:
  pull_request:
    paths:
      - 'rph_standalone/bahasa_arab/year[456]/**'
      - 'tools/arabic_178_draft_shared_layout_20261124.py'
      - 'web/telegram_provisional_arab_music_api.py'
      - 'audits/arabic_draft_y4_y6_sp_candidate_bank_20261124.json'
      - '.github/workflows/arabic-178-draft-shared-layout-20261124.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx pymupdf flask reportlab pypdf
      - name: Generate all 178 through the actual private Word renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          from web.telegram_provisional_arab_music_api import _arab_index, _arab_word, _selected
          from docx import Document
          out = Path("qa-arabic-178")
          out.mkdir()
          count=0
          for (year,n), row in _arab_index().items():
              if year not in (4,5,6): continue
              selected=_selected(year,"ARAB",f"u{int(row['unit']):02d}",f"{n:03d}")
              assert selected.get("status","DRAF")=="DRAF"
              assert selected["formats"]==["word"]
              dest=out/f"BA_T{year}_{n:03d}.docx"
              teacher={"class":"4 Bestari","date":"2027-01-20","time":"08:00 - 09:00","students":"30","reflection":""}
              _arab_word(selected,teacher,dest)
              doc=Document(dest)
              assert [len(t.columns) for t in doc.tables]==[3,2,3,2]
              assert [r.cells[2].text for r in doc.tables[0].rows]==["4 Bestari","20/01/2027","08:00 - 09:00","30"]
              assert doc.tables[1].cell(1,1).text==row["sp"]
              assert "DRAF" not in "".join(c.text for t in doc.tables for r in t.rows for c in r.cells)
              if n==1:
                  extra=out/"manual.docx"
                  _arab_word(selected,{**teacher,"reflection":"Catatan guru."},extra)
                  assert Document(extra).tables[-1].cell(2,1).text=="Catatan guru."
                  extra.unlink()
              count+=1
          assert count==178,count
          print("178 actual Arabic draft Word downloads verified")
          PY
      - name: Install native PDF converter and Arabic font
        run: |
          timeout 240 sudo apt-get update
          timeout 1200 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libreoffice-writer fonts-hosny-amiri
      - name: Convert all 178 Word candidates and check A4
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import fitz
          out=Path("qa-arabic-178").resolve()
          files=sorted(out.glob("*.docx"))
          assert len(files)==178
          pdf=out/"pdf"
          pdf.mkdir()
          for start in range(0,len(files),24):
              subprocess.run(["libreoffice","-env:UserInstallation="+(out/f"lo-{start}").as_uri(),"--headless","--convert-to","pdf","--outdir",str(pdf),*map(str,files[start:start+24])],check=True,timeout=180)
          errors=[]
          for f in files:
              p=pdf/(f.stem+".pdf")
              if not p.exists():
                  errors.append((f.name,"missing"))
                  continue
              with fitz.open(p) as d:
                  if len(d)!=1 or abs(d[0].rect.width-595.28)>2 or abs(d[0].rect.height-841.89)>2 or not d[0].get_text().strip():
                      errors.append((f.name,"A4/page/text",len(d)))
          print("A4 screen",178-len(errors),"/178",errors)
          assert not errors
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arabic-178-draft-rtl-review
          path: |
            qa-arabic-178/*.docx
            qa-arabic-178/*.json
            qa-arabic-178/pdf/*.pdf
          retention-days: 7
