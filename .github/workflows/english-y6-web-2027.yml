name: English Year 6 Web staging RPH
on:
  pull_request:
    branches: [staging/cikgulaju-web-v1]
    paths:
      - 'web/english_y6_rph_2027_http.py'
      - 'web/english_y6_standalone_runtime.py'
      - 'rph_standalone/english/year6/**'
      - 'tests/test_english_y6_web_2027.py'
      - '.github/workflows/english-y6-web-2027.yml'
  push:
    branches: [feat/english-y6-rph-web-preview-20261103]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'Flask>=3.0,<4'
      - run: python -m unittest discover -s tests -p 'test_english_y6_web_2027.py' -v
      - run: python -m unittest discover -s tests -p 'test_english_y6_rph_runtime.py' -v
