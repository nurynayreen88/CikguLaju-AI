name: Web English Catalog Smoke Tests

on:
  push:
    branches:
      - staging/cikgulaju-web-v1
    paths:
      - "cikgulaju_web_v1.py"
      - "web/english_catalog_http.py"
      - "tests/test_web_english_catalog_http.py"
      - ".github/workflows/web-english-catalog-tests.yml"
  workflow_dispatch:

jobs:
  catalog-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Flask for isolated catalog tests
        run: python -m pip install "Flask>=3,<4"
      - name: Run catalog tests
        run: python -m unittest discover -s tests -p "test_web_english_catalog_http.py" -v
