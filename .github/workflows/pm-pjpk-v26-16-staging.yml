name: PM PJPK v26.16 staging QA
on:
  push:
    branches:
      - staging/pm-pjpk-v26-16
      - main
    paths:
      - 'CikguLaju_v26_16.db.part*'
      - 'scripts/rebuild_pm_pjpk_v26_16.py'
      - 'scripts/check_pm_pjpk_v26_16.py'
      - 'scripts/pjpk_v26_16_adapter.py'
      - 'scripts/pjpk_runtime_readiness.py'
      - 'scripts/activate_pjpk_v26_16.py'
      - '.github/workflows/pm-pjpk-v26-16-staging.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'CikguLaju_v26_16.db.part*'
      - 'scripts/rebuild_pm_pjpk_v26_16.py'
      - 'scripts/check_pm_pjpk_v26_16.py'
      - 'scripts/pjpk_v26_16_adapter.py'
      - 'scripts/activate_pjpk_v26_16.py'
      - '.github/workflows/pm-pjpk-v26-16-staging.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct safely and check database
        run: |
          python scripts/rebuild_pm_pjpk_v26_16.py
          python scripts/check_pm_pjpk_v26_16.py
      - name: Print verified SK and SP readiness by year
        run: |
          python -m scripts.pjpk_runtime_readiness
          python - <<'PY'
          from scripts.pjpk_runtime_readiness import report
          rows = report()
          assert len(rows) == 12, f'Expected twelve PJPK year-subject combinations, got {len(rows)}'
          assert all(0 <= eligible <= safe for _, _, safe, eligible in rows)
          total_safe = sum(row[2] for row in rows)
          total_eligible = sum(row[3] for row in rows)
          assert total_safe == 33, f'Expected 33 safe-release rows, got {total_safe}'
          print(f'PJPK RPH READY: {total_eligible}/{total_safe} safe-release rows have verified SK+SP')
          if total_eligible == 0:
              print('BLOCKED: no PJPK row is eligible for RPH; source verification required')
          PY
      - name: Upload PJPK readiness audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pjpk-readiness-audit
          path: pjpk_readiness_audit.log
          if-no-files-found: ignore
      - name: Check adapter isolates incomplete years
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from pjpk_v26_16_adapter import ready_pdp
          rows = ready_pdp('Tahun 1', 'Pendidikan Jasmani')
          assert len(rows) == 33, f'Expected 33 safe PJ T1 rows, got {len(rows)}'
          for year in range(2, 7):
              assert not ready_pdp(f'Tahun {year}', 'Pendidikan Jasmani')
          for year in range(1, 7):
              assert not ready_pdp(f'Tahun {year}', 'Pendidikan Kesihatan')
          assert not ready_pdp('Tahun 1', 'Pendidikan Moral')
          print('PASS: 33 safe PJ T1 rows; unfinished PJPK rows hidden')
          PY
      - name: Test verified PJPK row handoff into RPH entry flow
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.activate_pjpk_v26_16 import install
          import sqlite3
          db = Path('CikguLaju_Curriculum_Master_v26_16_PJPK_SAFE_RELEASE.db')
          before = db.stat().st_size
          events = []
          state = {1: {'year': 'Tahun 1'}}
          def send(cid, msg, keyboard):
              events.append(('SEND', msg, keyboard))
          def lesson_to_class(cid):
              events.append(('RPH_ENTRY', dict(state[cid])))
          g = {
              'callback': lambda cid, data: events.append(('LEGACY', data)),
              'state': state,
              'send': send,
              '_lesson_to_class_v2439': lesson_to_class,
              'SUBJECTS': [],
              'SUBJECT_LABEL': {},
              'SUBJECTS_BY_GRADE': {},
          }
          install(g)
          first_callback = g['callback']
          install(g)
          assert g['callback'] is first_callback, 'PJPK install wrapped callback twice'
          assert g['SUBJECTS_BY_GRADE']['Tahun 1'].count('Pendidikan Jasmani') == 1
          g['callback'](1, 'sub_Pendidikan Jasmani')
          assert events and events[-1][0] == 'SEND', events
          assert '_pjpk_v2616_rows' not in state[1], 'Selectable rows must not be cached in session'
          buttons = [button for group in events[-1][2] for button in group]
          pdp_buttons = [button['callback_data'] for button in buttons if button['callback_data'].startswith('pjpk2616pdp|')]
          available = bool(pdp_buttons)
          if available:
              assert all(int(item.split('|')[1]) > 0 for item in pdp_buttons), 'PdP callbacks must contain stable positive entry IDs'
          if not available:
              assert 'belum disahkan' in events[-1][1], 'Missing fail-closed notice'
              assert db.stat().st_size == before, 'Read-only DB changed during blocked menu'
              print('BLOCKED: no PJ Tahun 1 row has complete SK and SP text; no RPH handoff')
              raise SystemExit(0)
          state[1]['year'] = 'Tahun 2'
          g['callback'](1, pdp_buttons[0])
          assert not any(event[0] == 'RPH_ENTRY' for event in events), 'Stale year selection entered RPH'
          state[1]['year'] = 'Tahun 1'
          g['callback'](1, 'sub_Pendidikan Jasmani')
          g['callback'](1, 'home')
          assert '_pjpk_v2616_selection_scope' not in state[1], 'Exit did not clear selection scope'
          g['callback'](1, pdp_buttons[0])
          assert not any(event[0] == 'RPH_ENTRY' for event in events), 'Exited menu still allowed RPH'
          g['callback'](1, 'sub_Pendidikan Jasmani')
          g['callback'](1, pdp_buttons[0])
          handoffs = [event for event in events if event[0] == 'RPH_ENTRY']
          assert handoffs, 'Selection did not enter the normal RPH class flow'
          selected = handoffs[-1][1]
          assert selected.get('quick_rpt_row'), 'Selected RPT row missing'
          assert selected.get('rpt_entry_id') is not None, 'RPT entry ID missing'
          assert selected.get('selected_sp') and selected.get('sp_code'), 'Verified SP not mapped'
          assert len(selected['grouped_sp_codes']) == len(selected['grouped_sp_texts']), 'SP codes/text mismatched'
          assert selected['selected_sp_codes'] == selected['grouped_sp_codes'], 'Verified SP omitted from selection'
          assert selected.get('quick_material_flow') is True
          assert selected.get('assessment_mode') == 'formative'
          assert '_pm_pdp_rows_v2602' not in selected, 'Old helper handoff still used'
          assert db.stat().st_size == before, 'Read-only DB changed during test'
          print('PASS: verified PJ Tahun 1 row reaches RPH entry with SP and DB unchanged')
          PY
