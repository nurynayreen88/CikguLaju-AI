name: PM PJPK v26.16 staging QA
on:
  push:
    branches:
      - staging/pm-pjpk-v26-16
      - staging/pjpk-private-pdf-v2656
      - main
    paths:
      - 'CikguLaju_v26_16.db.part*'
      - 'scripts/rebuild_pm_pjpk_v26_16.py'
      - 'scripts/check_pm_pjpk_v26_16.py'
      - 'scripts/pjpk_v26_16_adapter.py'
      - 'scripts/activate_pjpk_v26_16.py'
      - '.github/workflows/pm-pjpk-v26-16-staging.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile PJPK integration modules
        run: |
          python -m py_compile scripts/activate_pjpk_v26_16.py scripts/pjpk_v26_16_adapter.py scripts/rebuild_pm_pjpk_v26_16.py scripts/check_pm_pjpk_v26_16.py
      - name: Reconstruct safely and check database
        run: |
          python scripts/rebuild_pm_pjpk_v26_16.py
          python scripts/check_pm_pjpk_v26_16.py
      - name: Check adapter isolates incomplete years
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from pjpk_v26_16_adapter import ready_pdp
          rows = ready_pdp('Tahun 1', 'Pendidikan Jasmani')
          assert len(rows) == 33, f'Expected 33 safe PJ T1 rows, got {len(rows)}'
          for year in range(2, 7):
              assert not ready_pdp(f'Tahun {year}', 'Pendidikan Jasmani')
          for year in range(1, 7):
              assert not ready_pdp(f'Tahun {year}', 'Pendidikan Kesihatan')
          assert not ready_pdp('Tahun 1', 'Pendidikan Moral')
          print('PASS: 33 safe PJ T1 rows; unfinished PJPK rows hidden')
          PY

      - name: Test generic PJPK menu without altering DB
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.activate_pjpk_v26_16 import install
          from scripts.pjpk_v26_16_adapter import ready_pdp
          import sqlite3
          db=Path('CikguLaju_Curriculum_Master_v26_16_PJPK_SAFE_RELEASE.db')
          before=db.stat().st_size
          events=[]
          state={1:{'year':'Tahun 1'}}
          def send(cid,msg,kb):
              events.append((msg,kb))
          def lesson_to_class(cid):
              events.append(('LESSON_TO_CLASS',cid))
          g={'callback':lambda cid,d: events.append(('LEGACY',d)), 'state':state,
             'send':send,'_lesson_to_class_v2439':lesson_to_class,
             'SUBJECTS':[],'SUBJECT_LABEL':{},'SUBJECTS_BY_GRADE':{}}
          install(g)
          g['callback'](1,'sub_Pendidikan Jasmani')
          assert events and 'Pilih PdP' in events[-1][0],events
          assert len(state[1]['_pjpk_v2616_rows'])==33
          g['callback'](1,'pjpk2616pdp|0')
          ss=state[1]
          assert any(x[0]=='LESSON_TO_CLASS' for x in events),events
          assert ss['pjpk_generic_mode_v2616'] is True
          assert ss['subject']=='Pendidikan Jasmani'
          assert ss['quick_rpt_row']['id'] == ss['rpt_entry_id']
          assert ss['selected_sp'] and ss['sp_code']
          assert ss['rph_mode']=='fast_rpt' and ss['task']=='quick_material'
          assert db.stat().st_size==before
          print('PASS: menu, verified PdP, SP/context state, RPH class route, DB unchanged')
          PY
