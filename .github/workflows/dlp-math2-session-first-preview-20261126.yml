name: DLP Mathematics Year 2 session-first Word and PDF preview
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/preview_dlp_math2_session_first_20261126.py'
      - '.github/workflows/dlp-math2-session-first-preview-20261126.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3' 'requests>=2'
      - run: sudo apt-get update -qq && sudo apt-get install -y libreoffice-writer fonts-liberation
      - run: python -m tools.preview_dlp_math2_session_first_20261126
      - uses: actions/upload-artifact@v4
        with:
          name: math2-session-first-word-pdf-review
          path: math2_session_first_review/
