name: Web live Telegram source integration
on:
  push:
    branches: [staging/cikgulaju-web-v1]
    paths:
      - 'tools/run_web_v1_preview.py'
      - 'tests/test_web_live_telegram_source.py'
      - 'web/authoritative_http_source.py'
      - '.github/workflows/web-live-telegram-source.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flask
        run: python -m pip install 'Flask==3.1.0'
      - name: Run fail-closed source tests
        run: |
          python -m py_compile tools/run_web_v1_preview.py web/unified_rph_web.py
          python -m unittest discover -s tests -p 'test_web_live_telegram_source.py' -v
          python -m unittest discover -s tests -p 'test_web_unified_rph_preview.py' -v
