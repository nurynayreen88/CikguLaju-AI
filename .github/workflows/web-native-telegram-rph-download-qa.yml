name: Web Native Telegram RPH Download QA
on:
  push:
    branches: [feature/web-direct-rph-telegram-engine-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secure-download:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flask==3.1.3 python-docx==1.2.0 Pillow==11.3.0
      - name: Validate native server-to-server Word/PDF, no preview and access gates
        run: |
          python -m py_compile web/native_telegram_rph_client.py web/unified_rph_web.py
          python -m unittest discover -s tests -p test_web_native_telegram_rph_download.py -v
          python -m unittest discover -s tests -p test_web_logo_and_tables.py -v
          python -m unittest discover -s tests -p test_web_unified_rph_preview.py -v
          python -m unittest discover -s tests -p test_web_v1_quick_preview.py -v
          python -m unittest discover -s tests -p test_web_sidebar_navigation.py -v
          python -m unittest discover -s tests -p test_web_production_inventory.py -v
      - name: Browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page=Path("web_v1_static_preview/index.html").read_text("utf8")
          js=re.findall(r'<script>\s*(.*?)\s*</script>',page,flags=re.S)
          assert len(js)==1
          Path("/tmp/native-rph.js").write_text(js[0],encoding="utf8")
          PY
          node --check /tmp/native-rph.js
