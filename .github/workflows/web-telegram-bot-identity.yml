name: Diagnose Web Telegram login bot domain

on:
  push:
    branches:
      - production/cikgulaju-web-20261105
    paths:
      - 'tools/run_web_production.py'
      - 'tests/test_web_telegram_bot_identity.py'
      - '.github/workflows/web-telegram-bot-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'flask==3.1.3'
      - name: Verify bot identity endpoint does not reveal tokens
        run: |
          python -m py_compile tools/run_web_production.py
          python -m unittest discover -s tests -p 'test_web_telegram_bot_identity.py' -v
      - name: Check public Web diagnostic when available
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from urllib.error import HTTPError, URLError
          import json
          url="https://cikgulaju-web.onrender.com/api/auth/telegram/bot-identity"
          try:
              with urlopen(url,timeout=12) as r:
                  raw=r.read(4096)
                  code=r.status
          except HTTPError as e:
              code=e.code
              raw=e.read(4096)
          except URLError:
              print("Public endpoint temporarily unreachable")
              raise SystemExit(0)
          try:
              data=json.loads(raw)
              print(json.dumps({"http":code,
                  "configured_widget_bot":data.get("configured_widget_bot"),
                  "telegram_token_bot_username":data.get("telegram_token_bot_username"),
                  "identity_checked":data.get("telegram_bot_identity_checked"),
                  "username_matches_token":data.get("username_matches_token"),
                  "expected_domain":data.get("expected_domain")}))
          except Exception:
              print("Public diagnostic not deployed yet")
          PY
