name: Primary-school PdP hub and daily materials UI (staging)
on:
  pull_request:
    paths:
      - 'web_v1_static_preview/index.html'
      - 'web_v1_static_preview/rph-today.js'
      - 'tests/test_primary_pdp_hub_staging_20261112.cjs'
      - 'tests/test_guest_onboarding_20261112.cjs'
      - 'tests/test_web_english_y4_worksheet_20261112.py'
      - 'web/english_y4_worksheet_pdf_20261112.py'
      - 'web/english_y4_worksheet_word_20261112.py'
      - 'audits/legacy_worksheet_sources_staging_20261112.json'
      - 'tools/audit_legacy_worksheet_banks_20261112.py'
      - 'tests/test_legacy_worksheet_inventory_20261112.py'
      - 'tools/triage_legacy_worksheet_candidates_20261112.py'
      - 'tests/test_legacy_worksheet_triage_20261112.py'
      - 'web/legacy_worksheet_quality_gate_20261112.py'
      - 'tests/test_legacy_worksheet_quality_gate_20261112.py'
      - 'supplementary_materials/math/year1/repair_demo_sk1_1_sp1_1_1_20261112.json'
      - 'tests/test_repaired_math_y1_dummy_20261112.py'
      - 'web/unified_rph_web.py'
      - 'english_supplementary_materials.py'
      - 'supplementary_materials/english/year4/**'
      - '.github/workflows/web-primary-pdp-hub-staging-20261112.yml'
  push:
    branches:
      - 'staging/primary-pdp-hub-daily-materials-20261112'
permissions:
  contents: read
jobs:
  verify-pdp-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check daily source syntax
        run: node --check web_v1_static_preview/rph-today.js
      - name: Test verified materials and unchanged menu/credit boundaries
        run: node tests/test_primary_pdp_hub_staging_20261112.cjs
      - name: Test public guest onboarding and trusted Telegram link
        run: node tests/test_guest_onboarding_20261112.cjs
      - name: Regression - existing selection and timetable flow
        run: node tests/test_rph_today_selection_progress_20261111.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified Web PDF/runtime dependencies
        run: pip install -r requirements-web-v1.txt 'pypdf==5.1.0'
      - name: Validate printable PDF and editable A4 Word worksheets, auth and original Workbook paths
        run: PYTHONPATH=tests:. python -m unittest -v tests.test_web_english_y4_worksheet_20261112 tests.test_web_english_music_extras_20261106
      - name: Ensure historical worksheet DBs remain unapproved and read-only
        run: PYTHONPATH=. python -m unittest -v tests.test_legacy_worksheet_inventory_20261112
      - name: Inventory historical SQLite source tables without writes or publication
        run: |
          PYTHONPATH=. python tools/audit_legacy_worksheet_banks_20261112.py \
            --manifest audits/legacy_worksheet_sources_staging_20261112.json \
            --root . --output /tmp/cikgulaju-legacy-worksheet-inventory.json
          python - <<'PY'
          import json
          p = '/tmp/cikgulaju-legacy-worksheet-inventory.json'
          data = json.load(open(p, encoding='utf-8'))
          assert data['approval'] == 'NONE'
          assert data['production_feature_gate'] == 'OFF'
          for x in data['sources']:
              print('SOURCE', x['path'], x['state'],
                    'candidate tables:', len(x.get('tables', [])),
                    'integrity:', x.get('integrity', 'n/a'))
              for table in x.get('tables', []):
                  cols = ', '.join(c['name'] for c in table.get('columns', []))
                  print('  TABLE', table['table'], 'rows=', table.get('rows'),
                        'columns=', cols[:320], 'STATUS=', table['status'])
          PY
      - name: Triage worksheet content coverage and manual approval boundary
        run: |
          PYTHONPATH=. python -m unittest -v tests.test_legacy_worksheet_triage_20261112 tests.test_legacy_worksheet_quality_gate_20261112 tests.test_repaired_math_y1_dummy_20261112
          PYTHONPATH=. python tools/triage_legacy_worksheet_candidates_20261112.py \
            --root . --out /tmp/cikgulaju-worksheet-triage.json
