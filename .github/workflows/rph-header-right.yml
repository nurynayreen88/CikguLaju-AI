name: RPH header kanan Bahasa Arab

on:
  pull_request:
    paths:
      - 'web/arabic_rph_word.py'
      - 'tests/test_arabic_header_right_20261121.py'
      - 'tools/other_draft_actual_smoke_20261106.py'
      - '.github/workflows/rph-header-right.yml'
  push:
    branches:
      - 'fix/rph-dlp-header-right-20261121'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-rph-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install layout-test dependencies
        run: python -m pip install --disable-pip-version-check pytest python-docx pypdf reportlab flask requests python-dotenv
      - name: Verify Word and PDF layout and curriculum retention
        run: |
          python -m pytest -q tests/test_arabic_header_right_20261121.py
          PYTHONPATH=. python tools/other_draft_actual_smoke_20261106.py
