name: Web RPH staging regression
on:
  push:
    branches:
      - staging/cikgulaju-web-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota-and-generation-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Web test dependencies
        run: python -m pip install flask python-docx==1.1.2 reportlab==4.2.5
      - name: Compile Web modules and guards
        run: |
          python -m py_compile tools/run_web_v1_preview.py web/shared_trial_rpc.py web/rph_delivery_quota.py web/rph_document_renderer.py web/rph_download_pipeline.py web/document_integrity.py
      - name: Run offline quota and generation security tests
        run: |
          python -m unittest discover -s tests -p 'test_web_shared_trial_rpc.py' -v
          python -m unittest discover -s tests -p 'test_web_rph_delivery_quota.py' -v
          python -m unittest discover -s tests -p 'test_web_paid_access.py' -v
          python -m unittest discover -s tests -p 'test_web_document_authorization.py' -v
          python -m unittest discover -s tests -p 'test_web_renderer_input_guards.py' -v
          python -m unittest discover -s tests -p 'test_web_rph_download_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_web_real_document_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_web_document_integrity.py' -v
          python -m unittest discover -s tests -p 'test_web_download_http_guards.py' -v
          python -m unittest discover -s tests -p 'test_web_rph_http_integration.py' -v
          python -m unittest discover -s tests -p 'test_web_exact_vip_expiry.py' -v
          python -m unittest discover -s tests -p 'test_web_download_release_gate.py' -v
          python -m unittest discover -s tests -p 'test_web_shared_source_provenance.py' -v
          python -m unittest discover -s tests -p 'test_web_shared_catalog_http.py' -v
          python -m unittest discover -s tests -p 'test_web_shared_domain_parity.py' -v
          python -m unittest discover -s tests -p 'test_web_authoritative_curriculum_source.py' -v
          python -m unittest discover -s tests -p 'test_web_authoritative_http_source.py' -v
          python -m unittest discover -s tests -p 'test_web_generation_fail_closed.py' -v
