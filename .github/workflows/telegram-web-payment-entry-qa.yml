name: Telegram Web link and read-only payments QA
on:
  push:
    branches: [feature/telegram-web-entry-payment-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'flask==3.1.3' 'requests==2.32.3'
      - run: python -m py_compile web/web_link_telegram.py web/telegram_payment_source.py tools/run_telegram_with_curriculum_api.py
      - run: python -m unittest discover -s tests -p test_telegram_web_payment_entry.py -v
      - run: python -m unittest discover -s tests -p test_manual_pengguna_telegram.py -v
