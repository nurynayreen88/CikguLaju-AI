name: English Year 4 standalone regression
on:
  push:
    branches:
      - staging/english-year4-standalone-20261030
    paths:
      - 'rph_standalone/english/year4/**'
      - '.github/workflows/english-year4-standalone-qa.yml'
  workflow_dispatch:
jobs:
  standalone-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Year 4 Python modules
        run: python -m compileall -q rph_standalone/english/year4
      - name: Verify lesson count and print release blockers
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'rph_standalone/english/year4')
          from standalone_renderer_adapter import year4_release_blockers
          folder = Path('rph_standalone/english/year4')
          files = sorted(folder.glob('lesson_[0-9][0-9][0-9].md'))
          assert len(files) == 160, f'Expected 160 lessons, found {len(files)}'
          blocked = []
          for path in files:
              reasons = year4_release_blockers(path.read_text(encoding='utf-8'))
              if reasons:
                  blocked.append((path.stem, reasons))
          for name, reasons in blocked:
              print(name + ': ' + ', '.join(reasons))
          print(f'Lessons: {len(files)}; lessons with detected release blockers: {len(blocked)}')
          print('All lessons remain DRAFT pending source, export and manual verification.')
          PY
      - name: Run 160-lesson standalone adapter tests
        run: python -m unittest discover -s rph_standalone/english/year4 -p 'test_standalone_renderer_adapter.py' -v

      - name: Run read-only release audit and export 160-lesson reports
        run: |
          python rph_standalone/english/year4/audit_standalone_release.py --json year4_audit.json --csv year4_audit.csv
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('year4_audit.json').read_text(encoding='utf-8'))
          assert report['lessons_expected'] == 160
          assert report['files_found'] == 160
          assert report['manual_approvals_verified'] == 0
          assert report['release_ready'] is False
          assert len(report['records']) == 160
          print('Read-only audit report generated; all approvals remain pending.')
          PY
      - name: Upload read-only 160-lesson audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-year4-manual-approval-audit
          path: |
            year4_audit.json
            year4_audit.csv
          if-no-files-found: warn

      - name: Produce downloadable release-blocker report
        if: always()
        run: |
          python - <<'PY'
          import csv
          import sys
          from pathlib import Path
          sys.path.insert(0, 'rph_standalone/english/year4')
          from standalone_renderer_adapter import year4_release_blockers
          folder = Path('rph_standalone/english/year4')
          with open('year4_release_blockers.csv', 'w', newline='', encoding='utf-8') as handle:
              writer = csv.writer(handle)
              writer.writerow(['lesson', 'blockers', 'review_status'])
              for path in sorted(folder.glob('lesson_[0-9][0-9][0-9].md')):
                  reasons = year4_release_blockers(path.read_text(encoding='utf-8'))
                  writer.writerow([path.stem, '; '.join(reasons), 'DRAFT'])
          PY
      - name: Publish draft audit summary
        if: always()
        run: |
          python - <<'PY'
          import csv
          import os
          from collections import Counter
          from pathlib import Path
          path = Path('year4_release_blockers.csv')
          if not path.exists():
              print('Release-blocker CSV was not generated')
          else:
              with path.open(encoding='utf-8', newline='') as handle:
                  rows = list(csv.DictReader(handle))
              counts = Counter(reason.strip() for row in rows for reason in row['blockers'].split(';') if reason.strip())
              summary = ['## English Year 4 draft audit', '', f'Lessons reported: {len(rows)}', f'Lessons with detected blockers: {sum(bool(row["blockers"]) for row in rows)}', '', 'All lessons remain DRAFT; an empty blocker list does not certify READY.', '', '### Detected reasons']
              summary.extend(f'- {reason}: {count}' for reason, count in sorted(counts.items()))
              report = '\n'.join(summary)
              print(report)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
                      handle.write(report + '\n')
          PY
      - name: Upload release-blocker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-year4-release-blockers
          path: year4_release_blockers.csv
          if-no-files-found: warn
