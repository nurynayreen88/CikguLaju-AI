name: English Year 4 standalone regression
on:
  push:
    branches:
      - staging/english-year4-standalone-20261030
    paths:
      - 'rph_standalone/english/year4/**'
      - '.github/workflows/english-year4-standalone-qa.yml'
  workflow_dispatch:
jobs:
  standalone-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run 160-lesson standalone adapter tests
        run: python -m unittest discover -s rph_standalone/english/year4 -p 'test_standalone_renderer_adapter.py' -v
