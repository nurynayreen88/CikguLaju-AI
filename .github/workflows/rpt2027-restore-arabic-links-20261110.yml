name: Restore Arabic RPT original 298 links - review branch only
on:
  pull_request:
    branches:
      - production/cikgulaju-web-20261105
    paths:
      - 'scripts/restore_rpt2027_arabic_links_20261110.py'
      - '.github/workflows/rpt2027-restore-arabic-links-20261110.yml'
permissions:
  contents: write
jobs:
  restore-source-links:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyMuPDF==1.24.14'
      - name: Restore only original PDF link annotations
        run: python scripts/restore_rpt2027_arabic_links_20261110.py
      - name: Whitelist only five Arabic PDFs, manifest and locked cover SHA
        run: |
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          expected={"rpt_2027/web_2027_pdfs/manifest.json",
                    "rpt_2027/web_2027_pdfs/original_cover_layout_verified.json"}
          expected.update(f"rpt_2027/web_2027_pdfs/bahasa_arab/tahun_{y}.pdf" for y in range(2,7))
          assert changed==expected,(changed,expected)
          print("ONLY_FIVE_ARABIC_PDFS_MANIFEST_COVER_SHA",len(changed))
          PY
      - name: Attach source parity, visual parity, SHA report
        uses: actions/upload-artifact@v4
        with:
          name: rpt2027-arabic-298-links-restoration
          if-no-files-found: error
          retention-days: 30
          path: qa_rpt2027_links/restored_298_arabic_links.json
      - name: Commit to pull request review branch, never deploy directly
        env:
          TARGET: ${{ github.head_ref }}
        run: |
          git config user.name "cikgulaju-rpt-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rpt_2027/web_2027_pdfs/bahasa_arab/tahun_*.pdf \
                  rpt_2027/web_2027_pdfs/manifest.json \
                  rpt_2027/web_2027_pdfs/original_cover_layout_verified.json
          git commit -m "rpt2027: restore 298 original DSKP link annotations in five Bahasa Arab PDFs"
          git push origin "HEAD:$TARGET"
