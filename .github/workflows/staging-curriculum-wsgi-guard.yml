name: Staging curriculum WSGI safety

on:
  push:
    branches:
      - staging/cikgulaju-web-v1
    paths:
      - 'tools/run_telegram_curriculum_wsgi.py'
      - 'tests/test_telegram_curriculum_wsgi_guard.py'
      - '.github/workflows/staging-curriculum-wsgi-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify staging WSGI fails closed and registers with stubs
        run: python -m unittest discover -s tests -p 'test_telegram_curriculum_wsgi_guard.py' -v
