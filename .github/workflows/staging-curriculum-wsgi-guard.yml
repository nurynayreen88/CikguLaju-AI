name: Staging curriculum WSGI safety

on:
  push:
    branches:
      - staging/cikgulaju-web-v1
    paths:
      - 'tools/run_telegram_curriculum_wsgi.py'
      - 'tools/run_telegram_with_curriculum_api.py'
      - 'tests/test_telegram_optional_wsgi.py'
      - 'tests/test_telegram_curriculum_wsgi_guard.py'
      - 'tests/test_verified_pdp_navigation_limit.py'
      - 'tests/test_pjpk_component_isolation.py'
      - 'tests/test_pjpk_authoritative_http.py'
      - 'tests/test_web_authoritative_http_source.py'
      - 'tests/test_telegram_curriculum_pjpk_routes.py'
      - 'web/authoritative_http_source.py'
      - 'web/telegram_curriculum_api.py'
      - 'web/register_curriculum_api.py'
      - 'tests/test_curriculum_registration_hook.py'
      - 'web_v1_dropdown_catalog.py'
      - 'tools/run_web_v1_preview.py'
      - 'web_v1_verified_pdp.py'
      - '.github/workflows/staging-curriculum-wsgi-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependency
        run: python -m pip install 'Flask>=3.0,<4'
      - name: Verify staging WSGI fails closed and registers with stubs
        run: |
          python -m unittest discover -s tests -p 'test_telegram_curriculum_wsgi_guard.py' -v
          python -m unittest discover -s tests -p 'test_verified_pdp_navigation_limit.py' -v
          python -m unittest discover -s tests -p 'test_pjpk_component_isolation.py' -v
          python -m unittest discover -s tests -p 'test_pjpk_authoritative_http.py' -v
          python -m unittest discover -s tests -p 'test_web_authoritative_http_source.py' -v
          python -m unittest discover -s tests -p 'test_telegram_curriculum_pjpk_routes.py' -v
          python -m unittest discover -s tests -p 'test_curriculum_registration_hook.py' -v
          python -m unittest discover -s tests -p 'test_telegram_optional_wsgi.py' -v
