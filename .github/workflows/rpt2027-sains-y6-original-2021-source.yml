name: RPT2027 Sains Year6 original KPM DSKP 2021 source audit
on:
  pull_request:
    paths:
      - 'scripts/audit_sains_y6_original_2021_sp_membership_staging.py'
      - 'tests/test_sains_y6_original_2021_sp_membership_staging.py'
      - '.github/workflows/rpt2027-sains-y6-original-2021-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  year6_source_only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'PyMuPDF==1.24.14' 'reportlab==4.2.5'
      - name: Failing release gate / synthetic code mismatch QA
        run: python -m unittest tests.test_sains_y6_original_2021_sp_membership_staging -v
      - name: Obtain public mirror of KPM-authored Sains T6 original DSKP 2021
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'Mozilla/5.0 (compatible; CikguLaju-SourceAudit/1.0)' \
            'https://beebeeclassroom.com/wp-content/uploads/2022/04/DSKP-KSSR-Semakan-2017-Sains-Tahun-6_ISBN_.pdf' \
            --output /tmp/Sains_T6_DSKP_KPM_2021_source.pdf
          test $(wc -c </tmp/Sains_T6_DSKP_KPM_2021_source.pdf) -ge 200000
          sha256sum /tmp/Sains_T6_DSKP_KPM_2021_source.pdf
      - name: Compare all 84 historical PdP source SP codes to original 2021 KPM PDF
        run: |
          python -m scripts.audit_sains_y6_original_2021_sp_membership_staging \
            --pdf /tmp/Sains_T6_DSKP_KPM_2021_source.pdf \
            --out staging/rpt_2027_seragam_2026/sains_y6_original2021_code_membership_DRAF.json
      - uses: actions/upload-artifact@v4
        with:
          name: RPT2027-SAINS-Y6-KPM-2021-ORIGINAL-SP-CODE-MEMBERSHIP-STAGING
          path: staging/rpt_2027_seragam_2026/sains_y6_original2021_code_membership_DRAF.json
          if-no-files-found: error
          retention-days: 14
