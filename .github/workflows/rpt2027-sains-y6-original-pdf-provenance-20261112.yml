name: RPT Sains Y6 2021 original PDF 96-SP provenance only
on:
  pull_request:
    paths:
      - 'scripts/audit_sains_y6_2021_pdf_source_provenance_20261112.py'
      - 'scripts/probe_sains_y6_2021_96_sp_anyflip_20261110.py'
      - 'tests/test_sains_y6_2021_pdf_source_provenance_20261112.py'
      - '.github/workflows/rpt2027-sains-y6-original-pdf-provenance-20261112.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-pdf-96-code-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader without writing source PDFs into repository
        run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.12.3' 'pypdf==5.1.0'
      - name: Offline evidence and fail-closed guard tests
        run: |
          python -m py_compile scripts/audit_sains_y6_2021_pdf_source_provenance_20261112.py
          python -m unittest -v tests.test_sains_y6_2021_pdf_source_provenance_20261112
      - name: Read BPK September 2021 PDF facsimile and match 96 SP codes
        run: python -m scripts.audit_sains_y6_2021_pdf_source_provenance_20261112
      - name: Retain non-copyrighted diagnostic index, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sains-y6-2021-original-pdf-96-code-index-no-source-binary
          path: output/sains_y6_2021_96_sp_pdf_provenance_20261112.json
          retention-days: 30
          if-no-files-found: warn
