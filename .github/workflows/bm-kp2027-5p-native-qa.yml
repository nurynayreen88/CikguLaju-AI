name: BM KP2027 5P native delivery QA
on:
  pull_request:
    paths:
      - 'web/kp2027_bm_5p.py'
      - 'web/kp2027_bm_rph_web.py'
      - 'web/rph_5p_v5_layout.py'
      - 'web_v1_static_preview/index.html'
      - 'tests/test_bm_kp2027_5p_20261127.py'
      - '.github/workflows/bm-kp2027-5p-native-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt python-docx pymupdf
      - run: PYTHONPATH=. python -m unittest discover -s tests -p test_bm_kp2027_5p_20261127.py -v
      - run: PYTHONPATH=. python -m unittest discover -s tests -p test_kp2027_bm_rph_rpt_aligned_20261122.py -v
