name: Telegram RPH Hari Ini Manual Timetable QA
on:
  pull_request:
    paths:
      - 'tools/run_telegram_with_curriculum_api.py'
      - 'web/telegram_today_manual_timetable_20261110.py'
      - 'web/telegram_special_activity_menu.py'
      - 'tests/test_telegram_today_manual_timetable_20261110.py'
      - '.github/workflows/telegram-today-manual-timetable-20261110.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-timetable-rph:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile app adapter (no network)
        run: |
          python -m py_compile web/telegram_today_manual_timetable_20261110.py web/telegram_special_activity_menu.py tools/run_telegram_with_curriculum_api.py
      - name: Test Telegram menu, manual timetable, verified sources, debit and duplicate safety
        run: |
          python -m unittest discover -s tests -p 'test_telegram_today_manual_timetable_20261110.py' -v
      - name: Confirm previous Telegram Special Activity module compiles
        run: python -m py_compile web/telegram_special_activity_menu.py
