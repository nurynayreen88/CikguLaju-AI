name: RPH Hari Ini staging unit tests

on:
  push:
    branches:
      - staging/rph-hari-ini-integration-audit-20261027
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile staging modules
        run: python -m compileall -q rph_hari_ini
      - name: Run focused staging unit tests
        run: |
          for test in test_class_identity.py test_class_identity_rename_safety.py test_class_identity_uuid_format.py test_session_eligibility.py test_legacy_timetable_bridge.py test_stable_timetable_bridge.py test_taught_confirmation_guard.py test_sqlite_taught_store_testonly.py test_taught_sql_security.py; do
            python -m unittest discover -s tests -p "$test" -v || exit 1
          done
            tests.test_taught_sql_security
