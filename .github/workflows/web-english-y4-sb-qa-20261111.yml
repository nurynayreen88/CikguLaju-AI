name: Web English Y4 Student Book excerpt parity QA
on:
  pull_request:
    paths:
      - "web/native_telegram_extra_materials_20261106.py"
      - "web/unified_rph_web.py"
      - "web_v1_static_preview/index.html"
      - "tests/test_web_english_y4_student_book_20261111.py"
      - ".github/workflows/web-english-y4-sb-qa-20261111.yml"
  push:
    branches: [staging/web-english-y4-student-book-excerpts-20261111]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'flask==3.1.3' 'python-docx==1.2.0' 'lxml==5.4.0'
      - run: PYTHONPATH=tests:. python -m unittest -v tests.test_web_english_y4_student_book_20261111 tests.test_web_english_music_extras_20261106
