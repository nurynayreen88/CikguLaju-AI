name: RPT 2027 actual Web Telegram packaged PDF leak audit
on:
  pull_request:
    paths:
      - 'scripts/audit_rpt2027_packaged_live_downloads_staging.py'
      - 'scripts/audit_rpt2027_teacher_text_leaks_20261108.py'
      - 'rpt_2027/**/*.pdf'
      - 'web/native_rpt_telegram_api.py'
      - '.github/workflows/rpt2027-packaged-live-route-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-packaged-25:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'PyMuPDF==1.24.14'
      - name: Verify 25 real packaged RPT PDFs and report all developer text
        run: |
          python -m scripts.audit_rpt2027_packaged_live_downloads_staging
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('staging/rpt_2027_seragam_2026/packaged_delivery_pdf_audit.json')
          report=json.loads(p.read_text(encoding='utf-8'))
          assert report['target_count']==25
          assert report['scanned_files']==25
          assert not report['missing_packaged_files']
          assert not report['read_errors']
          assert report['academic_signoff'] is False
          print('PACKAGED_LEAK_COUNT:',report['findings_count'])
          print('PACKAGED_FILES_AFFECTED:',report['files_with_findings'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RPT2027-actual-packaged-25-PDF-leak-audit
          path: staging/rpt_2027_seragam_2026/packaged_delivery_pdf_audit.json
          if-no-files-found: error
          retention-days: 14
