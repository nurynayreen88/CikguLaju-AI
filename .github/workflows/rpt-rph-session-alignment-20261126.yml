name: Audit Arabic and DLP actual RPT session allocation
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/audit_rpt_rph_session_alignment_20261126.py'
      - '.github/workflows/rpt-rph-session-alignment-20261126.yml'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: python -m tools.audit_rpt_rph_session_alignment_20261126 --out "$RUNNER_TEMP/session-plan.json"
      - if: always()
        run: rm -f "$RUNNER_TEMP/session-plan.json"
