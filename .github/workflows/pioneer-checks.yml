name: Pioneer lifetime checks
on:
  pull_request:
    paths:
      - 'pioneer_*.py'
      - 'tests/test_pioneer_*.py'
      - 'web/telegram_web_receipt_admin_notification.py'
      - 'tests/test_telegram_web_receipt_admin_notification.py'
      - 'supabase/migrations/*_rakan_payment_review.sql'
      - 'tests/test_rakan_pembangun_cap_200_20261107.py'
      - 'migrations/20261107_rakan_pembangun_batch1_200_cap.sql'
      - '.github/workflows/pioneer-checks.yml'
  push:
    branches:
      - 'staging/pioneer-entitlement-core-20261025'
    paths:
      - 'pioneer_*.py'
      - 'tests/test_pioneer_*.py'
      - 'tests/test_rakan_pembangun_cap_200_20261107.py'
      - 'migrations/20261107_rakan_pembangun_batch1_200_cap.sql'
      - '.github/workflows/pioneer-checks.yml'
jobs:
  pioneer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.5 flask==3.1.3
      - run: python -m py_compile pioneer_entitlements.py pioneer_supabase.py pioneer_telegram.py pioneer_paid_recovery_telegram.py
      - run: python -m unittest tests.test_pioneer_entitlements tests.test_pioneer_supabase tests.test_pioneer_approval_recovery tests.test_pioneer_paid_recovery tests.test_pioneer_percentage tests.test_rakan_pembangun_cap_200_20261107
      - run: python -m unittest tests.test_telegram_web_receipt_admin_notification
