name: RPH Aktiviti Khas (draft)

on:
  pull_request:
    paths:
      - 'rph_standalone/aktiviti_khas/**'
      - 'web/telegram_special_activity_api.py'
      - 'tests/test_aktiviti_khas_catalog_20261106.py'
      - 'tests/test_aktiviti_khas_render_20261106.py'
      - 'tests/test_aktiviti_khas_preview_20261106.py'
      - '.github/workflows/rph_aktiviti_khas_pr.yml'
  workflow_dispatch:

jobs:
  audit-special-rph:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated document renderer dependencies
        run: python -m pip install 'Flask==3.1.0' 'python-docx==1.1.2' 'reportlab==4.2.5' 'pypdf==5.1.0'
      - name: Check source and 50 one-page A4 documents
        run: |
          python -m unittest discover -s tests -p 'test_aktiviti_khas_catalog_20261106.py' -v
          python -m unittest discover -s tests -p 'test_aktiviti_khas_render_20261106.py' -v
          python -m unittest discover -s tests -p 'test_aktiviti_khas_preview_20261106.py' -v
