name: RPH trial quota checks
on:
  push:
    branches: [fix/trial-quota-guard-20261026]
  pull_request:
    paths:
      - 'app.py'
      - 'tests/test_rph_trial_delivery_20261027.py'
      - '.github/workflows/rph-trial-quota-check.yml'
jobs:
  trial-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile app.py
      - run: python -m unittest discover -s tests -p 'test_rph_trial_delivery_20261027.py' -v
