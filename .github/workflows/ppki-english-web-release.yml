name: PPKI English Web release checks
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'web/native_telegram_ppki_client.py'
      - 'web/unified_rph_web.py'
      - 'tools/run_web_v1_preview.py'
      - 'web_v1_static_preview/index.html'
      - 'tests/test_ppki_english_web_release.py'
      - '.github/workflows/ppki-english-web-release.yml'
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Flask==3.1.3
      - run: python -m py_compile web/native_telegram_ppki_client.py web/unified_rph_web.py tools/run_web_v1_preview.py
      - run: python -m unittest discover -s tests -p 'test_ppki_english_web_release.py'
