name: Build five BM compact free PDFs from exact sources
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - '.github/workflows/rpt-bm-five-compact-pdf-20261126.yml'
      - 'tools/build_rpt_bm_compact_20261126.py'
permissions:
  contents: write
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rpt-bm-compact-five-pdf-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - name: Build five free BM PDF candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from hashlib import sha256
          import fitz
          from tools.build_rpt_bm_compact_20261126 import ROOT,render
          source=json.loads((ROOT/"manifest.json").read_text())
          lock=json.loads((ROOT/"original_cover_layout_verified.json").read_text())
          output=ROOT.parent/"compact_bm_pdf_2027"
          output.mkdir(parents=True,exist_ok=True)
          entries={}
          with TemporaryDirectory() as temp:
              for year in range(2,7):
                  key=f"bahasa_melayu:{year}"
                  entry=source["files"][key]
                  report=render("bahasa_melayu",year,Path(temp),source,lock)
                  candidate=Path(temp)/f"RPT_bahasa_melayu_tahun_{year}_2027.pdf"
                  raw=candidate.read_bytes()
                  assert sha256(raw).hexdigest()==report["pdf_sha256"]
                  with fitz.open(ROOT/entry["path"]) as a,fitz.open(candidate) as b:
                      assert a[0].get_pixmap().samples==b[0].get_pixmap().samples
                      assert len(b)==report["pages_after"]
                      for page in b:
                          assert page.get_text().strip()
                          assert page.get_pixmap(matrix=fitz.Matrix(.5,.5),alpha=False).width>0
                  relative=f"bahasa_melayu/tahun_{year}.pdf"
                  target=output/relative
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(raw)
                  entries[key]={"path":relative,"source_sha256":entry["sha256"],"sha256":report["pdf_sha256"],
                                "bytes":len(raw),"pages":report["pages_after"],"source_pages":report["pages_before"]}
          assert len(entries)==5 and len(list(output.rglob("*.pdf")))==5
          assert not list(output.rglob("*.docx"))
          (output/"manifest.json").write_text(json.dumps({"version":1,"count":5,"status":"LAYOUT_QA_CANDIDATE","files":entries},indent=2)+"\n")
          PY
      - name: Commit only unpersonalized PDF candidates to isolated review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rpt_2027/compact_bm_pdf_2027
          git diff --cached --name-only | python -c 'import sys; p=sys.stdin.read().splitlines(); assert len(p)==6 and all(s.startswith("rpt_2027/compact_bm_pdf_2027/") and (s.endswith(".pdf") or s.endswith("/manifest.json")) for s in p)'
          git commit -m "build(rpt): five BM compact free PDF candidates"
          git push origin HEAD:refs/heads/feat/rpt-bm-compact-five-pdf-20261126
