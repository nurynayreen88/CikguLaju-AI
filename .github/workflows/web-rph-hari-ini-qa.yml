name: Web RPH Hari Ini shared timetable and native selection QA
on:
  push:
    branches: [production/cikgulaju-web-20261105, feat/rph-hari-ini-web-20261106]
    paths:
      - 'web/rph_hari_ini_web.py'
      - 'web/school_day_calendar.py'
      - 'web/rph_timetable_word_bundle.py'
      - 'web/rph_weekly_quota.py'
      - 'supabase/migrations/20261117120500_web_rph_weekly_exports.sql'
      - 'supabase/migrations/20261117123500_web_rph_weekly_exports_sunday.sql'
      - 'web/unified_rph_web.py'
      - 'tests/test_web_rph_timetable_word_bundle.py'
      - 'requirements-web-v1.txt'
      - 'requirements-rph-word-bundle.txt'
      - 'web/math_unit_groups.py'
      - 'tools/run_web_v1_preview.py'
      - 'tests/test_web_math_unit_grouping_20261106.py'
      - 'web_v1_static_preview/rph-today.js'
      - 'web_v1_static_preview/index.html'
      - 'tools/run_web_production.py'
      - 'tests/test_web_rph_hari_ini_20261106.py'
      - 'tests/test_web_english_integrated_rph_2027.py'
      - 'web/native_telegram_integrated_english_client.py'
      - 'web/english_integrated_rph_weeks_2027.json'
      - 'tests/test_web_saved_classes.py'
      - '.github/workflows/web-rph-hari-ini-qa.yml'
  pull_request:
    paths:
      - 'web/rph_hari_ini_web.py'
      - 'web/school_day_calendar.py'
      - 'web/rph_timetable_word_bundle.py'
      - 'web/rph_weekly_quota.py'
      - 'supabase/migrations/20261117120500_web_rph_weekly_exports.sql'
      - 'supabase/migrations/20261117123500_web_rph_weekly_exports_sunday.sql'
      - 'web/unified_rph_web.py'
      - 'tests/test_web_rph_timetable_word_bundle.py'
      - 'requirements-web-v1.txt'
      - 'requirements-rph-word-bundle.txt'
      - 'web/math_unit_groups.py'
      - 'tools/run_web_v1_preview.py'
      - 'tests/test_web_math_unit_grouping_20261106.py'
      - 'web_v1_static_preview/rph-today.js'
      - 'web_v1_static_preview/index.html'
      - 'tools/run_web_production.py'
      - 'tests/test_web_rph_hari_ini_20261106.py'
      - 'tests/test_web_english_integrated_rph_2027.py'
      - 'web/native_telegram_integrated_english_client.py'
      - 'web/english_integrated_rph_weeks_2027.json'
      - 'tests/test_web_saved_classes.py'
      - '.github/workflows/web-rph-hari-ini-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install 'flask==3.1.3' 'lxml==5.4.0' -r requirements-rph-word-bundle.txt
      - run: PYTHONPATH=tests:. python -m unittest -v tests.test_web_rph_hari_ini_20261106 tests.test_web_teacher_profile_timetable tests.test_web_saved_classes tests.test_web_math_unit_grouping_20261106
      - run: PYTHONPATH=tests:. python -m unittest -v tests.test_web_rph_timetable_word_bundle
      - name: Verify October English RPT and paired Word/PDF downloads
        if: hashFiles('tests/test_web_english_integrated_rph_2027.py') != ''
        run: PYTHONPATH=tests:. python -m unittest -v tests.test_web_english_integrated_rph_2027
      - run: node --check web_v1_static_preview/rph-today.js
      - name: Syntax-check existing main Web script after embedding daily handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("web_v1_static_preview/index.html").read_text("utf8")
          prefix='<script>\n"use strict";'
          assert s.count(prefix)==1
          raw=s.split(prefix,1)[1].split("</script>",1)[0]
          Path("/tmp/cikgulaju-rph-today-inline.js").write_text('"use strict";'+raw)
          PY
          node --check /tmp/cikgulaju-rph-today-inline.js

  verify-weekly-quota:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Validate database permissions, retries, and atomic subscription quota
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role bypassrls;'
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117120500_web_rph_weekly_exports.sql
          quota() {
            psql -v ON_ERROR_STOP=1 -Atq -c "set role service_role; select allowed,remaining from public.web_rph_weekly_usage($1);"
          }
          test "$(quota "20,'00000000-0000-4000-8000-000000000020',repeat('a',64)")" = "t|1"
          shifted="$(psql -Atq -c 'select week_start - 1 from public.web_rph_weekly_exports where teacher_id=20')"
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117123500_web_rph_weekly_exports_sunday.sql
          test "$(psql -Atq -c 'select week_start from public.web_rph_weekly_exports where teacher_id=20')" = "$shifted"
          balance="$(quota 20)"
          test "$(quota "20,'00000000-0000-4000-8000-000000000020',repeat('a',64)")" = "$balance"
          test "$(psql -Atq -c "select extract(isodow from usage_week_start)::int from public.web_rph_weekly_usage(20)")" = "7"
          test "$(quota 11)" = "t|2"
          test "$(quota "11,'00000000-0000-4000-8000-000000000001',repeat('a',64)")" = "t|1"
          test "$(quota "11,'00000000-0000-4000-8000-000000000002',repeat('b',64)")" = "t|0"
          test "$(quota "11,'00000000-0000-4000-8000-000000000003',repeat('c',64)")" = "f|0"
          test "$(quota "11,'00000000-0000-4000-8000-000000000001',repeat('a',64)")" = "t|0"
          test "$(quota "11,'00000000-0000-4000-8000-000000000001',repeat('c',64)")" = "f|0"
          test "$(quota 12)" = "t|2"
          scratch="$(mktemp -d)"
          quota "12,'00000000-0000-4000-8000-000000000001',repeat('a',64)" > "$scratch/1" &
          a=$!
          quota "12,'00000000-0000-4000-8000-000000000002',repeat('b',64)" > "$scratch/2" &
          b=$!
          quota "12,'00000000-0000-4000-8000-000000000003',repeat('c',64)" > "$scratch/3" &
          c=$!
          wait "$a"
          wait "$b"
          wait "$c"
          test "$(cat "$scratch"/{1,2,3} | sort)" = "$(printf 'f|0\nt|0\nt|1')"
          test "$(psql -Atq -c "select has_function_privilege('anon','public.web_rph_weekly_usage(bigint,uuid,text)','EXECUTE'), has_function_privilege('authenticated','public.web_rph_weekly_usage(bigint,uuid,text)','EXECUTE'), has_table_privilege('anon','public.web_rph_weekly_exports','SELECT')")" = "f|f|f"
