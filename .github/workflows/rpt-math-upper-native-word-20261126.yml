name: RPT Mathematics SK Y4 Y5 Y6 native layout private QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/build_rpt_math_upper_native_word_20261126.py'
      - '.github/workflows/rpt-math-upper-native-word-20261126.yml'
permissions:
  contents: read
jobs:
  math:
    strategy:
      fail-fast: false
      matrix:
        year: [4,5,6]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - run: python -m tools.build_rpt_math_upper_native_word_20261126 --year ${{ matrix.year }} --out "$RUNNER_TEMP/rpt-private"
      - if: always()
        run: rm -rf "$RUNNER_TEMP/rpt-private"
