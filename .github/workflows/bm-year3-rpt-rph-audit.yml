name: BM Year 3 RPT RPH structural and readiness audit
on:
  push:
    branches:
      - staging/bm-rpt-2027-20261103
    paths:
      - 'rph_standalone/bahasa_melayu/year3/**'
      - 'rpt_2027/bahasa_melayu/**'
      - 'tools/qa_bm_year3_final_staging.py'
      - 'tools/export_bm_year3_rph_a4.py'
      - '.github/workflows/bm-year3-rpt-rph-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bm-year3-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile QA
        run: python -m py_compile tools/qa_bm_year3_final_staging.py
      - name: Check RPT, 165 RPH, PKJR and fail-closed READY gate
        run: python tools/qa_bm_year3_final_staging.py
      - name: Install document build dependencies
        run: python -m pip install --disable-pip-version-check python-docx reportlab pypdf
      - name: Build RPH A4 preview Word/PDF and RPT landscape Word
        run: python tools/export_bm_year3_rph_a4.py
      - name: Upload BM Year 3 DRAF preview package
        uses: actions/upload-artifact@v4
        with:
          name: CikguLaju-BM-Tahun3-2027-DRAF-Word-PDF
          path: dist/CikguLaju_BM_Tahun3_2027_DRAF_Pakej_Semakan.zip
          if-no-files-found: error
          retention-days: 30
