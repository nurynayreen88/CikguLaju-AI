name: Web teacher profile and timetable QA
on:
  push:
    branches:
      - feature/web-teacher-profile-timetable-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask==3.1.3
      - name: Validate secure profile storage, timetable, forms, and regressions
        run: |
          python -m py_compile web/teacher_profile_store.py web/teacher_profile_routes.py tools/run_web_production.py
          python -m unittest discover -s tests -p test_web_teacher_profile_timetable.py -v
          python -m unittest discover -s tests -p test_web_saved_classes.py -v
          python -m unittest discover -s tests -p test_web_sidebar_navigation.py -v
          python -m unittest discover -s tests -p test_web_v1_quick_preview.py -v
          python -m unittest discover -s tests -p test_web_unified_rph_preview.py -v
      - name: Validate teacher timetable and existing Web browser code
        run: |
          node --check web_v1_static_preview/teacher-profile.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('web_v1_static_preview/index.html').read_text(encoding='utf8')
          scripts=re.findall(r'<script>\s*(.*?)\s*</script>',html,flags=re.S)
          assert len(scripts)==1
          Path('/tmp/cikgulaju-existing-web.js').write_text(scripts[0],encoding='utf8')
          PY
          node --check /tmp/cikgulaju-existing-web.js
