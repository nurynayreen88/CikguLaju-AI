name: Year4 audio checks
on:
  push:
    branches:
      - staging/english-year4-standalone-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Year 4 audio source data
        run: python rph_standalone/english/year4/validate_audio_mapping.py
      - name: Run Year 4 audio regression tests
        run: python -m unittest discover -s rph_standalone/english/year4 -p 'test_audio_mapping.py' -v
