name: Validate English Year 4 standalone

on:
  push:
    branches:
      - staging/english-year4-standalone-20261030
    paths:
      - 'rph_standalone/english/year4/**'
      - 'scripts/validate_english_year4_standalone.py'
      - '.github/workflows/validate-english-year4-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Year 4 standalone integrity
        run: python scripts/validate_english_year4_standalone.py
