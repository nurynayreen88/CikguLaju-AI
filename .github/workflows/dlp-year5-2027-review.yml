name: DLP Science Year 4 and DLP Year 5 Word and PDF review
on:
  pull_request:
    branches: [main]
    paths:
      - 'staging/dlp/year5/**'
      - 'staging/dlp/year4/**'
      - 'rpt_2027/dlp/*_Year_5.docx'
      - 'rpt_2027/dlp/CikguLaju_RPT_DLP_2027_Science_Year_4.docx'
      - 'dlp_year2_rph.py'
      - 'tests/test_dlp_year5_review_exports.py'
      - 'tests/test_dlp_year4_science_review.py'
      - '.github/workflows/dlp-year5-2027-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install python-docx==1.2.0 reportlab==4.2.5 pypdf==5.1.0
      - name: Install Word conversion tools
        run: |
          if ! command -v soffice >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libreoffice-writer fonts-crosextra-carlito
          fi
      - run: python -m unittest discover -s tests -p 'test_dlp_year5_review_exports.py' -v
      - run: python -m unittest discover -s tests -p 'test_dlp_year4_science_review.py' -v
