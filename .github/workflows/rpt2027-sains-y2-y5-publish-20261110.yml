name: RPT 2027 Sains four source-complete PDF Web release QA
on:
  pull_request:
    branches:
      - production/cikgulaju-web-20261105
    paths:
      - '.github/workflows/rpt2027-sains-y2-y5-publish-20261110.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-web-review-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout production Web release branch
        uses: actions/checkout@v4
        with:
          ref: release/rpt2027-sains-y2-y5-dskp-source-pdfs-20261110
          path: web_release
          persist-credentials: true
      - name: Checkout pinned complete-SP staging generators
        uses: actions/checkout@v4
        with:
          ref: d24ed9cf297fc743722dbeb86817bd2d8d4dd0ce
          path: rpt_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: |
          python -m pip install 'PyMuPDF==1.24.14' 'reportlab==4.2.5'
      - name: Validate 310 real DSKP source codes, preserve unapproved flags
        run: |
          cd rpt_source
          python -m unittest tests.test_rpt2027_sains_kssr2017_complete_y2y3_20261110 tests.test_rpt2027_sains_kssr2017_full_y4y5_20261110 -v
      - name: Build all four replacement RPT PDFs from complete SP sources
        run: |
          cd rpt_source
          python - <<'PY'
          from pathlib import Path
          from scripts.build_rpt2027_sains_kssr2017_complete_y2y3_20261110 import build_all as y23
          from scripts.build_rpt2027_sains_kssr2017_complete_y4y5_20261110 import build_all as y45
          import fitz,hashlib,json
          out=Path('../staged_sains')
          a=y23(out/'y23')
          b=y45(out/'y45')
          built=a+b
          assert [(year,n) for year,n,p in built]==[(2,92),(3,103),(4,88),(5,116)]
          summary={}
          for year,n,p in built:
              p=Path(p)
              raw=p.read_bytes()
              with fitz.open(p) as d:
                  assert len(d)>=10
                  assert all(page.rect.width>page.rect.height for page in d)
                  cover=d[0].get_text()
                  assert 'NAMA GURU' in cover and 'NAMA SEKOLAH' in cover
                  content='\n'.join(page.get_text() for page in list(d)[1:])
                  assert 'M01' in content and 'Unit 1' in content and 'PdP 001' in content
                  assert '1.1.1' in content and 'PBD:' in content
                  assert 'Padankan muka surat' not in content
                  assert 'SEBELUM READY' not in content
                  pages=len(d)
              summary[str(year)]={'path':str(p),'pdp_count':n,'pages':pages,
                                  'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          (out/'build_summary.json').write_text(
              json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('FOUR_FULL_SOURCE_SAINS_PDFS_VERIFIED',json.dumps(summary))
          PY
      - name: Replace exactly four old Sains PDFs only on release review branch
        run: |
          python - <<'PY'
          import json,shutil,hashlib
          from pathlib import Path
          import fitz
          root=Path('web_release/rpt_2027/web_2027_pdfs')
          mpath=root/'manifest.json'
          m=json.loads(mpath.read_text('utf-8'))
          summary=json.loads(Path('staged_sains/build_summary.json').read_text('utf-8'))
          if m.get('count')!=56 or m.get('academic_final_approved') is not False:
              raise SystemExit('Cannot silently publish mismatched or academic-approved catalog')
          baseline={k:dict(v) for k,v in m['files'].items()}
          if len(baseline)!=56 or len(summary)!=4:
              raise SystemExit('Unexpected 56-file baseline or four replacement counts')
          for year,data in summary.items():
              key='sains:'+year
              if key not in baseline:
                  raise SystemExit('Wrong target year '+year)
              old=baseline[key]
              oldpath=root/old['path']
              raw=oldpath.read_bytes()
              if hashlib.sha256(raw).hexdigest()!=old['sha256']:
                  raise SystemExit('Bad baseline SHA '+key)
              if old['status']!=m['files'][key]['status']:
                  raise SystemExit('Academic status drift '+key)
              new=Path(data['path'])
              target=new.read_bytes()
              if hashlib.sha256(target).hexdigest()!=data['sha256']:
                  raise SystemExit('Bad new SHA '+key)
              shutil.copyfile(new,oldpath)
              for field in ('sha256','bytes','pages'):
                  m['files'][key][field]=data[field]
          if {k for k in m['files'] if m['files'][k]!=baseline[k]}!={f'sains:{y}' for y in range(2,6)}:
              raise SystemExit('Updated files are not exactly science Years 2-5')
          for key,value in m['files'].items():
              body=(root/value['path']).read_bytes()
              if hashlib.sha256(body).hexdigest()!=value['sha256'] or len(body)!=value['bytes']:
                  raise SystemExit('Final SHA and byte mismatch '+key)
              with fitz.open(root/value['path']) as d:
                  if len(d)!=value['pages']:
                      raise SystemExit('Final page count mismatch '+key)
              if key not in {f'sains:{y}' for y in range(2,6)} and value!=baseline[key]:
                  raise SystemExit('Other 52 PDF metadata were changed')
          if m.get('free_rph_quota_charged') is not False or m.get('telegram_production_database_modified') is not False:
              raise SystemExit('Unexpected quota/database flags')
          m['pages']=sum(v['pages'] for v in m['files'].values())
          m['source_projection']='RPT2027_SAINS_Y2_92_Y3_103_Y4_88_Y5_116_KSSR2017_SOURCE_COMPLETED_SP_ACADEMIC_REVIEW_HOLD'
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n','utf-8')
          print('RPT_56_PDF_SAINS4_UPDATED 4 new; 52 unchanged; all SHA verified; academic_final_approved=false')
          PY
      - name: Commit exactly 4 new Sains PDF assets plus manifest to review branch
        run: |
          cd web_release
          git config user.name "cikgulaju-rpt-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rpt_2027/web_2027_pdfs
          git diff --cached --name-only > ../web_rpt_changed_paths.txt
          python - <<'PY'
          from pathlib import Path
          changes=Path('../web_rpt_changed_paths.txt').read_text().splitlines()
          expected={f'rpt_2027/web_2027_pdfs/sains/tahun_{y}.pdf' for y in (2,3,4,5)}
          expected.add('rpt_2027/web_2027_pdfs/manifest.json')
          if set(changes)!=expected: raise SystemExit('Invalid PDF release diff '+repr(changes))
          print('EXACT_FIVE_FILES_ONLY',len(changes))
          PY
          git commit -m "rpt(web): replace four incomplete Sains RPT PDFs with full DSKP SP-sourced 92/103/88/116 plans"
          git push origin HEAD:refs/heads/release/rpt2027-sains-y2-y5-dskp-source-pdfs-20261110
      - name: Archive QA evidence and four teacher PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpt2027-sains-four-original-source-pdfs-review-20261110
          retention-days: 30
          if-no-files-found: warn
          path: |
            staged_sains/
            web_rpt_changed_paths.txt
