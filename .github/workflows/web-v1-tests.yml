name: Web V1 isolated tests

on:
  push:
    branches:
      - staging/cikgulaju-web-v1
    paths:
      - 'web_v1_entitlements.py'
      - 'web_v1_telegram_login.py'
      - 'web_v1_sessions.py'
      - 'web_v1_pairing_challenges.py'
      - 'web_v1_pairing_store.py'
      - 'web_v1_pairing_session.py'
      - 'web_v1_browser_binding.py'
      - 'web_v1_pairing_cleanup.py'
      - 'web_v1_access_policy.py'
      - 'web_v1_account_resolver.py'
      - 'web_v1_sqlite_account_adapter.py'
      - 'tools/inspect_web_v1_account_schema.py'
      - 'web_v1_dropdown_catalog.py'
      - 'web_v1_verified_pdp.py'
      - 'tools/run_web_v1_preview.py'
      - 'web_v1_preview/**'
      - 'tests/test_web_v1_entitlements.py'
      - 'tests/test_web_v1_telegram_login.py'
      - 'tests/test_web_v1_sessions.py'
      - 'tests/test_web_v1_auth_flow.py'
      - 'tests/test_web_v1_access_policy.py'
      - 'tests/test_web_v1_account_resolver.py'
      - 'tests/test_web_v1_sqlite_account_adapter.py'
      - 'tests/test_web_v1_sqlite_integration.py'
      - 'tests/test_web_v1_preview_security.py'
      - 'tests/test_web_v1_smoke_isolated.py'
      - 'tests/test_web_v1_phone_login_fail_closed.py'
      - 'tests/test_web_v1_pairing_challenges.py'
      - 'tests/test_web_v1_pairing_store.py'
      - 'tests/test_web_v1_pairing_session.py'
      - 'tests/test_web_v1_browser_binding.py'
      - 'tests/test_web_v1_health_database.py'
      - 'tests/test_web_v1_end_to_end_pairing.py'
      - 'tests/test_web_v1_pairing_cleanup.py'
      - 'tests/test_web_v1_deployment_status.py'
      - 'tests/test_web_v1_schema_inspector.py'
      - 'tests/test_web_v1_shared_routes.py'
      - '.github/workflows/web-v1-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preview dependency
        run: python -m pip install 'Flask>=3,<4'
      - name: Compile Web V1 Python modules
        run: python -m py_compile web_v1_entitlements.py web_v1_telegram_login.py web_v1_sessions.py web_v1_pairing_challenges.py web_v1_pairing_store.py web_v1_pairing_session.py web_v1_browser_binding.py web_v1_pairing_cleanup.py web_v1_access_policy.py web_v1_account_resolver.py web_v1_sqlite_account_adapter.py tools/inspect_web_v1_account_schema.py tools/run_web_v1_preview.py
      - name: Run isolated Web V1 tests
        run: python -m unittest discover -s tests -p 'test_web_v1_*.py' -v
