name: PI 2027 draft catalog isolation
on:
  pull_request:
    paths:
      - 'rph_standalone/pendidikan_islam_draf_2027/**'
      - '.github/workflows/pi-2027-partial-drafts.yml'
  workflow_dispatch:
jobs:
  validate-draft-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all 696, six held, no automatic publication
        run: python -m unittest discover -s rph_standalone/pendidikan_islam_draf_2027 -p 'test_pi*.py' -v
      - name: Generate all-lesson QA ledger with academic NO-GO
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_quality_audit.py --output pi_quality_audit_696.json
      - name: Prepare 690 domain-specific editor suggestions (not RPH)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_pedagogy_review.py --output pi_pedagogy_proposals_690.json
      - name: Audit Buku Aktiviti mapping without guessing page numbers
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_activity_book_audit.py --output pi_buku_aktiviti_audit_696.json
      - name: Produce 258 per-Lesson BA mapping proposals (174 review, 84 oral)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_ba_match_queue.py --output pi_ba_candidate_queue_258.json
      - name: Collect 42 second-hand workbook page hints (NO direct verification)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_ba_secondary_evidence.py --output pi_ba_secondary_evidence_42.json
      - name: Reject cross-curriculum KSSRPK workbook candidates
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_ba_source_integrity.py --output pi_ba_source_integrity.json
      - name: Prepare 174 conditional Jawi activity-book cues (not teacher material)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_ba_sentence_candidates.py --output pi_ba_sentence_candidates_174.json
      - name: Classify 42 secondary BA sources and their contradictions
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_ba_provenance_review.py --output pi_ba_provenance_42.json
      - name: Prepare 174-lesson BA verification register (CSV and JSON; editor only)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_ba_verification_register.py --json pi_ba_verification_register_174.json --csv pi_ba_verification_register_174.csv
      - name: Isolate 523 internal material notes in 690 editor-only RPH previews
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_editor_material_projection.py --output pi_editor_material_preview_690.json
      - name: Prioritize 696 lesson reviews including 43 generic PBD flags
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_content_review_queue.py --json pi_content_review_queue_696.json --csv pi_content_review_queue_696.csv
      - name: Group 690 Rumi closings for Jawi review with no automatic rewrites
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_closing_jawi_review_queue.py --json pi_closing_jawi_review_78.json --csv pi_closing_jawi_review_78.csv
      - name: Draft 10 high-frequency Jawi closings for expert review only
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_closing_jawi_candidates.py --json pi_closing_jawi_candidates_581.json --csv pi_closing_jawi_candidates_581.csv
      - name: Draft 13 more Jawi closings for expert review (23 groups total)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_closing_jawi_candidates_batch2.py --json pi_closing_jawi_candidates_635.json --csv pi_closing_jawi_candidates_635.csv
      - name: Prepare all 78 unique Jawi closing candidates for 690 draft lessons (NO_GO)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_closing_jawi_candidates_complete.py --json pi_closing_jawi_candidates_690.json --csv pi_closing_jawi_candidates_690.csv
      - name: Compare 77 Year-2 old page notes with original 2017 textbook table of contents
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_t2_textbook_toc_review.py --json pi_t2_toc_77.json --csv pi_t2_toc_77.csv
      - name: Report fail-closed Year 2-6 release blockers; do not merge
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_release_readiness.py --output pi_release_readiness_696_NO_GO.json
      - name: Generate 690 separate SK/SP-linked Jawi editor review rows (no publication)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_jawi_closing_lesson_review.py --json pi_jawi_closing_lesson_review_690.json --csv pi_jawi_closing_lesson_review_690.csv
      - name: Attest 3 Lesson-to-SP footer source crosschecks and 2 DSKP wording repairs (no academic READY)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_t2_54_direct_source_review.py --json pi_t2_dskp_tb_sp54_3.json --csv pi_t2_dskp_tb_sp54_3.csv
      - name: Audit all Year2 3-level SP code presence against 83 DSKP codes (leave 30 tasmi unassigned)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_t2_dskp_code_presence.py --json pi_t2_dskp_code_presence_111.json --csv pi_t2_dskp_code_presence_111.csv
      - name: Audit source Year3 Awalan book p46-51 for 12 lessons, exclude legacy PDF34 wrong topic
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_t3_awalan_book_review.py --json pi_t3_awalan_direct_book_12.json --csv pi_t3_awalan_direct_book_12.csv
      - name: Audit original Year3 textbook footer SP codes, flag 6.4.3 DSKP-valid exception
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_t3_book_footer_code_audit.py --json pi_t3_book_footer_sp_147.json --csv pi_t3_book_footer_sp_147.csv
      - name: Audit source-backed T4 L083 guest-hadith excerpt, keep expert HOLD
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_t4_hadith_source_audit.py --output pi_t4_l083_hadith_source_editor_HOLD.json
      - name: Verify every audit artifact exists, is nonempty, and stays review-only
        shell: bash
        run: |
          for file in \
            pi_quality_audit_696.json \
            pi_pedagogy_proposals_690.json \
            pi_buku_aktiviti_audit_696.json \
            pi_ba_candidate_queue_258.json \
            pi_ba_secondary_evidence_42.json \
            pi_ba_source_integrity.json \
            pi_ba_sentence_candidates_174.json \
            pi_ba_provenance_42.json \
            pi_ba_verification_register_174.json \
            pi_ba_verification_register_174.csv \
            pi_editor_material_preview_690.json \
            pi_content_review_queue_696.json \
            pi_content_review_queue_696.csv \
            pi_closing_jawi_review_78.json \
            pi_closing_jawi_review_78.csv \
            pi_closing_jawi_candidates_581.json \
            pi_closing_jawi_candidates_581.csv \
            pi_t2_toc_77.json \
            pi_t2_toc_77.csv \
            pi_closing_jawi_candidates_635.json \
            pi_closing_jawi_candidates_635.csv \
            pi_closing_jawi_candidates_690.json \
            pi_closing_jawi_candidates_690.csv \
            pi_release_readiness_696_NO_GO.json \
            pi_jawi_closing_lesson_review_690.json \
            pi_jawi_closing_lesson_review_690.csv \
            pi_t2_dskp_tb_sp54_3.json \
            pi_t2_dskp_tb_sp54_3.csv \
            pi_t2_dskp_code_presence_111.json \
            pi_t2_dskp_code_presence_111.csv \
            pi_t3_awalan_direct_book_12.json \
            pi_t3_awalan_direct_book_12.csv \
            pi_t3_book_footer_sp_147.json \
            pi_t3_book_footer_sp_147.csv \
            pi_t4_l083_hadith_source_editor_HOLD.json; do
            if [ ! -s "$file" ]; then
              echo "::error::Audit artifact missing or empty: $file"
              exit 1
            fi
          done
      - name: Upload isolated QA ledger and review queue (not teacher material)
        uses: actions/upload-artifact@v4
        with:
          name: pi-2027-696-staging-quality-audit
          path: |
            pi_quality_audit_696.json
            pi_pedagogy_proposals_690.json
            pi_buku_aktiviti_audit_696.json
            pi_ba_candidate_queue_258.json
            pi_ba_secondary_evidence_42.json
            pi_ba_source_integrity.json
            pi_ba_sentence_candidates_174.json
            pi_ba_provenance_42.json
            pi_ba_verification_register_174.json
            pi_ba_verification_register_174.csv
            pi_editor_material_preview_690.json
            pi_content_review_queue_696.json
            pi_content_review_queue_696.csv
            pi_closing_jawi_review_78.json
            pi_closing_jawi_review_78.csv
            pi_closing_jawi_candidates_581.json
            pi_closing_jawi_candidates_581.csv
            pi_t2_toc_77.json
            pi_t2_toc_77.csv
            pi_closing_jawi_candidates_635.json
            pi_closing_jawi_candidates_635.csv
            pi_closing_jawi_candidates_690.json
            pi_closing_jawi_candidates_690.csv
            pi_release_readiness_696_NO_GO.json
            pi_jawi_closing_lesson_review_690.json
            pi_jawi_closing_lesson_review_690.csv
            pi_t2_dskp_tb_sp54_3.json
            pi_t2_dskp_tb_sp54_3.csv
            pi_t2_dskp_code_presence_111.json
            pi_t2_dskp_code_presence_111.csv
            pi_t3_awalan_direct_book_12.json
            pi_t3_awalan_direct_book_12.csv
            pi_t3_book_footer_sp_147.json
            pi_t3_book_footer_sp_147.csv
            pi_t4_l083_hadith_source_editor_HOLD.json
          retention-days: 30

  physical-word-pdf-a4:
    name: Audit temporary Word/PDF A4 for 687 non-held drafts (NO_GO)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated print dependencies and Amiri Jawi font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-hosny-amiri fonts-liberation
          python -m pip install --disable-pip-version-check python-docx==1.1.2 pypdf==5.1.0
          fc-match "Amiri" | head -1
      - name: Convert all 687 non-held RPH drafts to temporary Word and PDF
        run: |
          python rph_standalone/pendidikan_islam_draf_2027/pi_word_pdf_print_audit.py \
            --output build/pi_word_pdf_a4_696_report.json --batch-size 25
      - name: Upload only QA report (never distribute draft Word/PDF files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-2027-a4-print-qa-review-only
          path: |
            build/pi_word_pdf_a4_696_report.json
            build/pi_word_pdf_a4_696_report.csv
          if-no-files-found: warn
          retention-days: 30
