name: PI 2027 draft catalog isolation
on:
  pull_request:
    paths:
      - 'rph_standalone/pendidikan_islam_draf_2027/**'
      - '.github/workflows/pi-2027-partial-drafts.yml'
  workflow_dispatch:
jobs:
  validate-draft-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all 696, six held, no automatic publication
        run: python -m unittest discover -s rph_standalone/pendidikan_islam_draf_2027 -p 'test_pi*.py' -v
      - name: Generate all-lesson QA ledger with academic NO-GO
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_quality_audit.py --output pi_quality_audit_696.json
      - name: Prepare 690 domain-specific editor suggestions (not RPH)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_pedagogy_review.py --output pi_pedagogy_proposals_690.json
      - name: Audit Buku Aktiviti mapping without guessing page numbers
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_activity_book_audit.py --output pi_buku_aktiviti_audit_696.json
      - name: Produce 258 per-Lesson BA mapping proposals (174 review, 84 oral)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_ba_match_queue.py --output pi_ba_candidate_queue_258.json
      - name: Collect 42 second-hand workbook page hints (NO direct verification)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_ba_secondary_evidence.py --output pi_ba_secondary_evidence_42.json
      - name: Reject cross-curriculum KSSRPK workbook candidates
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_ba_source_integrity.py --output pi_ba_source_integrity.json
      - name: Prepare 174 conditional Jawi activity-book cues (not teacher material)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_ba_sentence_candidates.py --output pi_ba_sentence_candidates_174.json
      - name: Classify 42 secondary BA sources and their contradictions
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_ba_provenance_review.py --output pi_ba_provenance_42.json
      - name: Prepare 174-lesson BA verification register (CSV and JSON; editor only)
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_ba_verification_register.py --json pi_ba_verification_register_174.json --csv pi_ba_verification_register_174.csv
      - name: Isolate 523 internal material notes in 690 editor-only RPH previews
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_editor_material_projection.py --output pi_editor_material_preview_690.json
      - name: Prioritize 696 lesson reviews including 43 generic PBD flags
        run: python rph_standalone/pendidikan_islam_draf_2027/pi_content_review_queue.py --json pi_content_review_queue_696.json --csv pi_content_review_queue_696.csv
      - name: Verify every audit artifact exists, is nonempty, and stays review-only
        shell: bash
        run: |
          for file in \
            pi_quality_audit_696.json \
            pi_pedagogy_proposals_690.json \
            pi_buku_aktiviti_audit_696.json \
            pi_ba_candidate_queue_258.json \
            pi_ba_secondary_evidence_42.json \
            pi_ba_source_integrity.json \
            pi_ba_sentence_candidates_174.json \
            pi_ba_provenance_42.json \
            pi_ba_verification_register_174.json \
            pi_ba_verification_register_174.csv \
            pi_editor_material_preview_690.json \
            pi_content_review_queue_696.json \
            pi_content_review_queue_696.csv; do
            if [ ! -s "$file" ]; then
              echo "::error::Audit artifact missing or empty: $file"
              exit 1
            fi
          done
      - name: Upload isolated QA ledger and review queue (not teacher material)
        uses: actions/upload-artifact@v4
        with:
          name: pi-2027-696-staging-quality-audit
          path: |
            pi_quality_audit_696.json
            pi_pedagogy_proposals_690.json
            pi_buku_aktiviti_audit_696.json
            pi_ba_candidate_queue_258.json
            pi_ba_secondary_evidence_42.json
            pi_ba_source_integrity.json
            pi_ba_sentence_candidates_174.json
            pi_ba_provenance_42.json
            pi_ba_verification_register_174.json
            pi_ba_verification_register_174.csv
            pi_editor_material_preview_690.json
            pi_content_review_queue_696.json
            pi_content_review_queue_696.csv
          retention-days: 30
