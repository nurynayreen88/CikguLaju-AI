name: PI 2027 draft catalog isolation
on:
  pull_request:
    paths:
      - 'rph_standalone/pendidikan_islam_draf_2027/**'
      - '.github/workflows/pi-2027-partial-drafts.yml'
  workflow_dispatch:
jobs:
  validate-draft-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 690 draf, 6 held, no auto publication
        run: python -m unittest discover -s rph_standalone/pendidikan_islam_draf_2027 -p 'test_pi_review_catalog.py' -v