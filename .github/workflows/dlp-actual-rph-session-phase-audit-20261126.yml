name: DLP actual RPH source phase audit
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/audit_dlp_actual_rph_session_phases_20261126.py'
      - 'tools/build_dlp_distinct_session_activity_drafts_20261126.py'
      - 'tools/dlp_session_targeted_reinforcement_20261126.json'
      - 'tools/prepare_dlp_paired_session_content_20261126.py'
      - 'tools/dlp_science_continuation_open_exit_20261126.json'
      - 'tools/build_dlp_seven_session_previews_20261126.py'
      - 'tools/render_dlp_science_session_rph_previews_20261126.py'
      - '.github/workflows/dlp-actual-rph-session-phase-audit-20261126.yml'
permissions:
  contents: read
concurrency:
  group: dlp-paired-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  phase-crosswalk:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/dlp-seven-sets-fixed-session-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: rpt
      - uses: actions/checkout@v4
        with:
          ref: 8fd340fdc17ece2dc3074d085083a6f7d28d5a77
          persist-credentials: false
          path: rph
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r rpt/requirements-rph-word-bundle.txt 'flask==3.1.3' 'requests>=2' 'reportlab>=4,<5' 'pypdf>=5,<7'
      - working-directory: rpt
        run: python -m tools.audit_dlp_seven_fixed_sessions_20261126 --out ../session-plan.json
      - working-directory: rph
        run: python ../rpt/tools/audit_dlp_actual_rph_session_phases_20261126.py --plan ../session-plan.json --out ../actual-rph-phase-crosswalk.json
      - working-directory: rpt
        run: python -m tools.build_dlp_distinct_session_activity_drafts_20261126 --crosswalk ../actual-rph-phase-crosswalk.json --out ../distinct-session-activity-drafts.json
      - working-directory: rpt
        run: python -m tools.prepare_dlp_paired_session_content_20261126 --crosswalk ../actual-rph-phase-crosswalk.json --drafts ../distinct-session-activity-drafts.json --out ../paired-session-content.json
      - uses: actions/upload-artifact@v4
        with:
          name: dlp-actual-rph-phase-crosswalk
          path: |
            actual-rph-phase-crosswalk.json
            distinct-session-activity-drafts.json
            paired-session-content.json
          if-no-files-found: error
  paired-native-rpt:
    needs: phase-crosswalk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {subject: mathematics_dlp, year: 3}
          - {subject: mathematics_dlp, year: 4}
          - {subject: mathematics_dlp, year: 5}
          - {subject: mathematics_dlp, year: 6}
          - {subject: science_dlp, year: 2}
          - {subject: science_dlp, year: 3}
          - {subject: science_dlp, year: 6}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dlp-actual-rph-phase-crosswalk
          path: session-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3' 'requests>=2'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-writer fonts-liberation2
      - run: python -m tools.build_dlp_seven_session_previews_20261126 --subject ${{ matrix.subject }} --year ${{ matrix.year }} --paired session-data/paired-session-content.json --out previews
      - uses: actions/upload-artifact@v4
        with:
          name: paired-native-rpt-${{ matrix.subject }}-y${{ matrix.year }}
          path: previews/
          if-no-files-found: error
  dlp-native-rph:
    needs: phase-crosswalk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {subject: science_dlp, year: 2}
          - {subject: science_dlp, year: 3}
          - {subject: science_dlp, year: 6}
          - {subject: mathematics_dlp, year: 3}
          - {subject: mathematics_dlp, year: 4}
          - {subject: mathematics_dlp, year: 5}
          - {subject: mathematics_dlp, year: 6}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: rpt
      - uses: actions/checkout@v4
        with:
          ref: 8fd340fdc17ece2dc3074d085083a6f7d28d5a77
          persist-credentials: false
          path: rph
      - uses: actions/download-artifact@v4
        with:
          name: dlp-actual-rph-phase-crosswalk
          path: session-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r rpt/requirements-rph-word-bundle.txt 'flask==3.1.3' 'requests>=2' 'reportlab>=4,<5' 'pypdf>=5,<7'
      - working-directory: rph
        run: python ../rpt/tools/render_dlp_science_session_rph_previews_20261126.py --paired ../session-data/paired-session-content.json --rpt-root ../rpt/rpt_2027 --subject ${{ matrix.subject }} --year ${{ matrix.year }} --out ../science-previews
      - uses: actions/upload-artifact@v4
        with:
          name: native-rph-${{ matrix.subject }}-y${{ matrix.year }}
          path: science-previews/
          if-no-files-found: error
