name: Paired Science Web actual release checks
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'web/dlp_paired_science_rpt.py'
      - 'tests/test_dlp_paired_science_web.py'
      - '.github/workflows/dlp-paired-science-web.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3' 'requests>=2'
      - run: python -m unittest discover -s tests -p 'test_dlp_paired_science_web.py' -v
      - run: node --check web_v1_static_preview/rph-today.js
