name: Web RPT2027 Year1 preview and first-party private school-cover QA
on:
  pull_request:
    branches:
      - 'production/cikgulaju-web-20261105'
    paths:
      - '.github/workflows/web-rpt2027-year1-personal-cover-ci.yml'
      - 'web/rpt_2027_all_http.py'
      - 'web_v1_static_preview/index.html'
      - 'web_v1_static_preview/rpt-personalize.js'
      - 'web_v1_static_preview/pdf-lib.min.js'
      - 'tools/run_web_production.py'
      - 'tests/test_web_rpt2027_56_release_catalog.py'
      - 'tests/qa_web_rpt_personal_cover_node.cjs'
permissions:
  contents: write
  pull-requests: read
jobs:
  personalized_rpt:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/web-rpt2027-year1-personal-cover-20261108' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing paid authentication plus 10 disabled Year1 KP2027 choices
        run: |
          python -m pip install 'flask==3.1.3'
          python -m unittest tests.test_web_rpt2027_56_release_catalog tests.test_web_rpt_2027_all -v
          node --check web_v1_static_preview/rpt-personalize.js
          node --check tests/qa_web_rpt_personal_cover_node.cjs
      - name: Vendor pinned pdf-lib from npm 1.17.1 as a FIRST-PARTY asset, not a runtime CDN
        shell: bash
        run: |
          set -euo pipefail
          if [ -f web_v1_static_preview/pdf-lib.min.js ]; then
            sha256sum -c web_v1_static_preview/pdf-lib.min.js.sha256
          else
            curl --fail --silent --show-error --location --retry 3 \
              'https://registry.npmjs.org/pdf-lib/-/pdf-lib-1.17.1.tgz' \
              -o "$RUNNER_TEMP/pdf-lib-1.17.1.tgz"
            tar -xOzf "$RUNNER_TEMP/pdf-lib-1.17.1.tgz" package/dist/pdf-lib.min.js \
              > web_v1_static_preview/pdf-lib.min.js
            test "$(wc -c < web_v1_static_preview/pdf-lib.min.js)" -gt 300000
            test "$(wc -c < web_v1_static_preview/pdf-lib.min.js)" -lt 1500000
            sha256sum web_v1_static_preview/pdf-lib.min.js \
              > web_v1_static_preview/pdf-lib.min.js.sha256
          fi
          node --check web_v1_static_preview/pdf-lib.min.js
      - name: Test inserting logo cover without dropping any of 12 real subject PDFs
        run: |
          node tests/qa_web_rpt_personal_cover_node.cjs
      - name: Commit only first-party PDF helper, never user profiles or DB
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'feature/web-rpt2027-year1-personal-cover-20261108'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web_v1_static_preview/pdf-lib.min.js web_v1_static_preview/pdf-lib.min.js.sha256
          if git diff --cached --quiet; then
            echo "Pinned PDF library already present, verified. Nothing to write."
          else
            git commit -m 'assets(web): vendor reviewed pdf-lib v1.17.1 on first-party site'
            git push origin HEAD:feature/web-rpt2027-year1-personal-cover-20261108
          fi
