name: Web Sejarah 2027 Telegram shared source QA
on:
  push:
    paths:
      - 'web/native_telegram_sejarah_2027_client.py'
      - 'web/unified_rph_web.py'
      - 'tools/run_web_v1_preview.py'
      - 'tests/test_web_sejarah_2027_client.py'
      - '.github/workflows/web-sejarah-2027-shared-source-qa.yml'
  pull_request:
    paths:
      - 'web/native_telegram_sejarah_2027_client.py'
      - 'web/unified_rph_web.py'
      - 'tools/run_web_v1_preview.py'
      - 'tests/test_web_sejarah_2027_client.py'
      - '.github/workflows/web-sejarah-2027-shared-source-qa.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'flask==3.1.3' 'python-docx==1.2.0'
      - name: Verify Sejarah Web proxy and paid/trial guard
        run: python -m unittest -v tests.test_web_sejarah_2027_client
      - name: Verify existing native RPH routing does not change
        run: python -m unittest -v tests.test_web_native_sequence_rph_bridge tests.test_web_unified_rph_preview
