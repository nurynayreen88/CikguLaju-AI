name: KSSR 41 physical page heading and margin QA
on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - 'tools/rpt_kssr_physical_pages.py'
      - '.github/workflows/rpt-kssr-physical-pages-20261126.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        subject: [pendidikan_moral,pjpk,psv,muzik,rbt,sejarah,sains,matematik,english]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-rph-word-bundle.txt 'flask==3.1.3'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile,json,re
          from docx import Document
          from tools import build_kssr_rpt_merged_week_batch_20261126 as k
          from tools import build_rpt_math_upper_native_word_20261126 as m
          from tools import build_rpt_science_approved_word_20261126 as s
          from tools import build_english_rpt_merged_week_word_pdf_20261126 as e
          from tools.rpt_kssr_physical_pages import verify_pages
          subject="${{ matrix.subject }}"
          manifest=json.loads((k.ROOT/"manifest.json").read_text())
          lock=json.loads((k.ROOT/"original_cover_layout_verified.json").read_text())
          for year in range(2,7):
              if subject in ("rbt","sejarah") and year<4:continue
              with tempfile.TemporaryDirectory() as td:
                  out=Path(td)
                  if subject=="english":e.render(year,out)
                  elif subject=="matematik" and year>=4:m.render(year,out)
                  elif subject=="sains" and year>=5:s.render(year,out)
                  else:k.render(subject,year,out,manifest,lock)
                  word=next(out.glob("*.docx"));pdf=next(out.glob("*.pdf"))
                  d=Document(word)
                  verify_pages(word,pdf,[c.text for c in d.tables[0].rows[0].cells],lambda v:re.sub(r"\s+"," ",v).strip())
                  print("PHYSICAL_PAGE_PASS",subject,year,len(d.tables),flush=True)
          PY
