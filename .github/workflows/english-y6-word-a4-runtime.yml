name: English Year 6 Word A4 runtime safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/english_y6_word_a4_runtime.py'
      - 'tests/test_english_y6_word_a4_runtime.py'
      - 'tools/run_telegram_with_curriculum_api.py'
      - '.github/workflows/english-y6-word-a4-runtime.yml'
permissions: {contents: read}
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install python-docx==1.1.2
      - run: python -m unittest discover -s tests -p 'test_english_y6_word_a4_runtime.py' -v
      - run: python -m unittest discover -s tests -p 'test_telegram_optional_wsgi.py' -v
