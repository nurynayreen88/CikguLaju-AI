name: Pendidikan Islam 696 private Word-PDF QA

on:
  pull_request:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - web/pi_696_private_bundle.py
      - tests/test_pi_696_login_v2_selection_20261121.py
      - tests/test_pi_696_private_bundle_web_20261121.py
      - requirements-rph-word-bundle.txt
      - .github/workflows/web-pi-696-private-rph-qa.yml
  push:
    branches: [production/cikgulaju-web-20261105]
    paths:
      - web/pi_696_private_bundle.py
      - tests/test_pi_696_private_bundle_web_20261121.py
      - requirements-rph-word-bundle.txt
      - .github/workflows/web-pi-696-private-rph-qa.yml

permissions:
  contents: read

jobs:
  private-rph-word-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the actual Web PDF and Word runtime
        run: pip install 'python-docx==1.1.2' 'PyMuPDF>=1.24.0,<1.27'
      - name: Check 696 catalog, extra six lessons, auth-independent source and PDF fields
        run: python -m unittest discover -s tests -p 'test_pi_696*20261121.py' -v
