name: PJPK v26.18 staging integration checks
on:
  push:
    branches:
      - staging/pjpk-v26-18-review
    paths:
      - 'app.py'
      - 'pjpk_*.py'
      - 'rebuild_pjpk_candidate.py'
      - 'tests/test_pjpk_runtime_integration_v2618.py'
      - 'tests/test_pjpk_rph_composer_v2669.py'
      - 'tests/test_pjpk_refinement_v2672.py'
      - 'tests/test_pjpk_coverage_v2670.py'
      - 'test_pjpk_v26_18_staging.py'
      - 'test_pjpk_v26_18_bridge_gate.py'
      - 'scripts/audit_pjpk_runtime_coverage_v2618.py'
      - '.github/workflows/pjpk-v26-18-staging.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app.py'
      - 'pjpk_*.py'
      - 'rebuild_pjpk_candidate.py'
      - 'tests/test_pjpk_runtime_integration_v2618.py'
      - 'tests/test_pjpk_rph_composer_v2669.py'
      - 'tests/test_pjpk_refinement_v2672.py'
      - 'tests/test_pjpk_coverage_v2670.py'
      - 'test_pjpk_v26_18_staging.py'
      - 'test_pjpk_v26_18_bridge_gate.py'
      - '.github/workflows/pjpk-v26-18-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse app and PJPK modules
        run: |
          python -m py_compile app.py pjpk_t3_safe_preview_adapter.py pjpk_rpt_bridge_v2659.py pjpk_activity_planner_v2665.py pjpk_activity_adapter_v2666.py pjpk_rph_integration_v2664.py pjpk_rph_composer_v2669.py pjpk_rph_quality_v2672.py rebuild_pjpk_candidate.py
      - name: Audit actual bundled runtime DB PJPK coverage (read-only)
        run: python scripts/audit_pjpk_runtime_coverage_v2618.py
      - name: Rebuild isolated candidate DB without touching production DB
        run: python rebuild_pjpk_candidate.py
      - name: Inventory all-year PJPK preview tables (read-only)
        run: |
          python - <<'PY'
          import json, sqlite3
          db = "pjpk_candidate.db"
          with sqlite3.connect("file:" + db + "?mode=ro", uri=True) as con:
              tables = {r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              report = {"all_year_menu_table_present": "pjpk_v26_30_candidate_menu" in tables}
              if "pjpk_v26_30_candidate_menu" in tables:
                  report["menu_counts"] = [
                      {"year": r[0], "component": r[1], "status": r[2], "count": r[3]}
                      for r in con.execute(
                          "SELECT year,component,entry_status,COUNT(*) FROM pjpk_v26_30_candidate_menu "
                          "GROUP BY year,component,entry_status ORDER BY year,component,entry_status"
                      )
                  ]
              for table in ("pjpk_dskp_provenance","pjpk_dskp_exact_reconciliation","pjpk_v47_generator_gate"):
                  if table in tables:
                      report[table + "_rows"] = con.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
              print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Verify candidate integrity and editorial gates
        run: python pjpk_v26_18_release_preflight.py
      - name: Test bridge fail-closed behavior
        run: python test_pjpk_v26_18_bridge_gate.py
      - name: Test verified RPH integration and subject isolation
        run: python -m unittest tests.test_pjpk_runtime_integration_v2618 tests.test_pjpk_rph_composer_v2669 tests.test_pjpk_refinement_v2672 tests.test_pjpk_coverage_v2670
