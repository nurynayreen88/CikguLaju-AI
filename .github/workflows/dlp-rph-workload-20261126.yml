name: DLP ten original RPH workload and display checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/verify_dlp_rph_workload_20261126.py'
      - '.github/workflows/dlp-rph-workload-20261126.yml'
      - 'dlp_year2_rph.py'
      - 'staging/dlp/**'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'python-docx>=1.1,<2' 'reportlab>=4,<5' 'pypdf>=5,<7' 'PyMuPDF>=1.24,<2' 'flask>=3,<4' 'lxml>=5,<7'
      - run: python -m tools.verify_dlp_rph_workload_20261126
